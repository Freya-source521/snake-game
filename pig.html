<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>猪了个猪</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='52' r='40' fill='%23ff9db1'/><circle cx='36' cy='44' r='5' fill='%23222'/><circle cx='64' cy='44' r='5' fill='%23222'/><ellipse cx='50' cy='64' rx='12' ry='8' fill='%23ff7a94'/><path d='M38 26 L34 12 M62 26 L66 12' stroke='%23ff9db1' stroke-width='6' stroke-linecap='round'/></svg>" />
<style>
  :root {
    --bg: #0b0e1a; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --accent: #38f0d0; --accent2: #ff9db1; --text: #e8ecff; --muted: #8a92b8; --err: #ff5d6c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 15%, #241a2e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-height: 100%; padding: 10px 8px 14px; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  a.home { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    text-decoration: none; border-radius: 10px; padding: 7px 12px; font-size: 13px; }
  .hud { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; font-size: 14px; display: flex; align-items: center; gap: 6px; min-width: 70px; justify-content: center; }
  .hud .lbl { color: var(--muted); font-size: 11px; }
  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 7px 10px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn .cnt { color: var(--accent); font-weight: 700; }
  .btn:disabled { opacity: .4; cursor: default; }
  #board { position: relative; width: min(92vmin, 470px); margin-top: 2px; flex-shrink: 0; }
  .tile {
    position: absolute; width: var(--ts); height: var(--ts);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--ts) * 0.52);
    background: linear-gradient(145deg, #3a3350, #241f38);
    border: 1px solid rgba(255,255,255,0.18); border-radius: 12%;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    cursor: pointer; transition: transform .1s ease, opacity .15s ease;
  }
  .tile:hover { transform: scale(1.05); }
  .tile.covered { filter: brightness(0.5) saturate(0.6); cursor: not-allowed; }
  .tile.pop { animation: tpop .25s ease-out; }
  @keyframes tpop { 0% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .tile.removing { transform: scale(0); opacity: 0; }
  #tray { display: flex; gap: 6px; width: min(92vmin, 470px); justify-content: center; margin-top: 4px; flex-shrink: 0; }
  .slot { width: 52px; height: 52px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; }
  .slot.filled { animation: tpop .18s ease-out; }
  #bankbar { display: flex; align-items: center; gap: 6px; margin-top: 6px; min-height: 44px; }
  #bankbar .bankitem { width: 42px; height: 42px; background: rgba(255,157,177,0.15);
    border: 1px solid rgba(255,157,177,0.4); border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 24px; }
  .saved-tip { color: var(--muted); font-size: 11px; margin-top: 4px; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,10,22,0.85); backdrop-filter: blur(5px); z-index: 1000; }
  #overlay.hidden { display: none; }
  #overlay .box { background: #141a33; border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 34px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 92vw; }
  #overlay h2 { font-size: 30px; letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay p { color: var(--muted); font-size: 14px; line-height: 1.8; }
  #overlay p b { color: var(--accent); }
  #overlay .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #overlay button { background: linear-gradient(90deg, var(--accent), #22c1a8); color: #062a24;
    font-size: 15px; font-weight: 700; border: none; padding: 10px 24px; border-radius: 999px; cursor: pointer; }
  #overlay button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <a class="home" href="./">🏠 返回主页</a>
    <div class="hud"><span class="lbl">第</span><span id="level">1</span><span class="lbl">关</span></div>
    <div class="hud"><span class="lbl">消除</span><span id="cleared">0</span></div>
    <button class="btn" id="undo-btn">↩ 撤回</button>
    <button class="btn" id="shuffle-btn">🔀 洗牌 <span class="cnt" id="shuffle-cnt">2</span></button>
    <button class="btn" id="remove-btn">📦 移出 <span class="cnt" id="remove-cnt">1</span></button>
    <button class="btn" id="new-btn">🔄 重开</button>
  </header>
  <div id="board"></div>
  <div id="tray"></div>
  <div id="bankbar"></div>
  <div class="saved-tip">💾 自动存档 · 关闭页面后回来可继续</div>
  <footer>点击猪猪放进槽里 · 3 个相同自动消除 · 槽满 7 个失败</footer>
  <div id="overlay"><div class="box"><h2 id="ov-title">猪了个猪</h2><p id="ov-sub">像羊了个羊一样的堆叠消除<br/>点击猪猪凑齐 3 个相同即可消除</p><div class="btns"><button id="ov-btn">开始游戏</button></div></div></div>
  <script>
(function () {
  'use strict';

  var COLS = 7, ROWS = 8;
  var TRAY_CAP = 7;
  var SAVE_KEY = 'pig.save.v1';
  var TYPES_L1 = 8, TYPES_L2 = 10, TYPES_L3 = 12;
  var ICONS = ['🐷','🐖','🥓','🍖','🍯','🌾','🥛','🧀','🥕','🍠','🌽','🧺','🥚','🍄','🌶️'];
  var audio = null;

  var boardEl = document.getElementById('board');
  var trayEl = document.getElementById('tray');
  var bankEl = document.getElementById('bankbar');
  var levelEl = document.getElementById('level');
  var clearedEl = document.getElementById('cleared');
  var undoBtn = document.getElementById('undo-btn');
  var shuffleBtn = document.getElementById('shuffle-btn');
  var removeBtn = document.getElementById('remove-btn');
  var newBtn = document.getElementById('new-btn');
  var shuffleCnt = document.getElementById('shuffle-cnt');
  var removeCnt = document.getElementById('remove-cnt');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovSub = document.getElementById('ov-sub');
  var ovBtn = document.getElementById('ov-btn');

  var level = 1;
  var tiles = [];     // {id, r, c, layer, type, done, el}
  var tray = [];      // {id, type, or, oc, ol}
  var bank = [];
  var cleared = 0;
  var toolShuffle = 2, toolRemove = 1;
  var tileSize = 54;
  var shift = 0, topPad = 0;
  var over = false;
  var nextId = 1;

  // ---------- audio ----------
  function ensureAudio() {
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, slide) {
    if (!audio) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    click: function () { tone(300, 0.04, 'sine', 0.07); },
    match: function () { tone(520, 0.1, 'triangle', 0.16, 260); setTimeout(function(){ tone(760,0.12,'triangle',0.16,220); },90); },
    win: function () { [523,659,784].forEach(function(f,i){ setTimeout(function(){ tone(f,0.15,'triangle',0.16,0); }, i*120); }); },
    lose: function () { tone(300, 0.5, 'sawtooth', 0.16, -160); },
    tool: function () { tone(440, 0.06, 'sine', 0.1, 120); }
  };

  // ---------- save ----------
  var saveTimer = null;
  function queueSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 350);
  }
  function saveNow() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1, level: level, cleared: cleared,
        tiles: tiles.map(function (t) { return { r: t.r, c: t.c, layer: t.layer, type: t.type, done: t.done }; }),
        tray: tray.map(function (t) { return { type: t.type, or: t.or, oc: t.oc, ol: t.ol }; }),
        bank: bank, toolShuffle: toolShuffle, toolRemove: toolRemove, over: over, ts: Date.now()
      }));
    } catch (e) {}
  }
  function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
  window.addEventListener('pagehide', saveNow);

  // ---------- layout ----------
  function currentMaxDepth() {
    return level === 1 ? 4 : level === 2 ? 5 : level === 3 ? 6 : level === 4 ? 7 : 8;
  }
  function buildBoard() {
    var w = boardEl.clientWidth;
    tileSize = Math.floor((w - 10) / COLS);
    shift = Math.round(tileSize * 0.26);
    topPad = (currentMaxDepth() - 1) * shift + 6;
    boardEl.style.setProperty('--ts', tileSize + 'px');
    boardEl.style.height = (topPad + ROWS * tileSize + 8) + 'px';
  }

  // ---------- generation ----------
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function makeLayout() {
    var maxDepth = currentMaxDepth();
    var target = level === 1 ? 51 : level === 2 ? 78 : level === 3 ? 102 : level === 4 ? 120 : 138;
    var cells = [];
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) cells.push([r, c]);
    shuffle(cells);
    var depths = {};
    var total = 0;
    for (var i = 0; i < cells.length && total < target; i++) {
      var key = cells[i][0] + ',' + cells[i][1];
      var d = 1 + Math.floor(Math.random() * maxDepth);
      if (total + d > target + 3) d = 1;
      depths[key] = d;
      total += d;
    }
    while (total < target) {
      var k = cells[(Math.random() * cells.length) | 0];
      var kk = k[0] + ',' + k[1];
      depths[kk] = (depths[kk] || 0) + 1;
      total++;
    }
    while (total % 3 !== 0) {
      var k2 = cells[(Math.random() * cells.length) | 0];
      var kk2 = k2[0] + ',' + k2[1];
      depths[kk2] = (depths[kk2] || 0) + 1;
      total++;
    }
    // multiset
    var typeCount = level === 1 ? TYPES_L1 : level === 2 ? TYPES_L2 : level === 3 ? TYPES_L3 : level === 4 ? 14 : 15;
    var multiset = [];
    for (var g = 0; g < total / 3; g++) {
      var t = (Math.random() * typeCount) | 0;
      multiset.push(t, t, t);
    }
    shuffle(multiset);
    // assign
    var list = [];
    var idx = 0;
    for (var key2 in depths) {
      var parts = key2.split(',');
      var r2 = +parts[0], c2 = +parts[1];
      for (var l = 0; l < depths[key2]; l++) {
        list.push({ r: r2, c: c2, layer: l, type: multiset[idx] });
        idx++;
      }
    }
    return list;
  }

  function resetLevel() {
    tiles = [];
    tray = [];
    bank = [];
    cleared = 0;
    toolShuffle = 2; toolRemove = 1;
    over = false;
    clearedEl.textContent = '0';
    levelEl.textContent = level;
    buildBoard();
    updateToolBtns();
    var data = makeLayout();
    boardEl.innerHTML = '';
    for (var i = 0; i < data.length; i++) {
      var d = data[i];
      var el = document.createElement('div');
      el.className = 'tile';
      el.textContent = ICONS[d.type];
      el.dataset.id = nextId;
      var t = { id: nextId, r: d.r, c: d.c, layer: d.layer, type: d.type, done: false, el: el };
      nextId++;
      (function (tt) {
        el.addEventListener('click', function () { clickTile(tt); });
      })(t);
      boardEl.appendChild(el);
      tiles.push(t);
    }
    layoutTiles();
    renderTray();
    renderBank();
  }

  function layoutTiles() {
    for (var i = 0; i < tiles.length; i++) {
      var t = tiles[i];
      if (t.done) { t.el.style.display = 'none'; continue; }
      t.el.style.display = 'flex';
      var x = 4 + t.c * tileSize;
      var y = topPad + 4 + t.r * tileSize - t.layer * shift;
      t.el.style.left = x + 'px';
      t.el.style.top = y + 'px';
      t.el.style.zIndex = 100 + t.layer;
    }
    // coverage
    for (var j = 0; j < tiles.length; j++) {
      var tt = tiles[j];
      if (tt.done) continue;
      tt.el.classList.toggle('covered', isCovered(tt));
    }
  }

  function isCovered(t) {
    for (var i = 0; i < tiles.length; i++) {
      var o = tiles[i];
      if (o.done || o.id === t.id) continue;
      if (o.r === t.r && o.c === t.c && o.layer > t.layer) return true;
    }
    return false;
  }

  // ---------- tray ----------
  function clickTile(t) {
    if (over) return;
    if (t.done || isCovered(t)) return;
    ensureAudio();
    t.done = true;
    t.el.classList.add('removing');
    var entry = { id: t.id, type: t.type, or: t.r, oc: t.c, ol: t.layer };
    tray.push(entry);
    sfx.click();
    renderTray();
    layoutTiles();
    // match 3
    var same = tray.filter(function (e) { return e.type === entry.type; });
    if (same.length >= 3) {
      setTimeout(function () {
        for (var i = 0; i < 3; i++) {
          var e = same[i];
          var ix = tray.indexOf(e);
          if (ix >= 0) tray.splice(ix, 1);
        }
        cleared++;
        clearedEl.textContent = cleared;
        sfx.match();
        renderTray();
        renderBank();
        queueSave();
        checkWin();
      }, 180);
    } else {
      if (tray.length >= TRAY_CAP) {
        setTimeout(function () {
          over = true;
          sfx.lose();
          showOverlay('🐷 猪栏满了！', '第 <b>' + level + '</b> 关 · 已消除 <b>' + cleared + '</b> 组', '重新开始', false);
          queueSave();
        }, 250);
      } else {
        queueSave();
      }
    }
  }

  function renderTray() {
    trayEl.innerHTML = '';
    for (var i = 0; i < TRAY_CAP; i++) {
      var s = document.createElement('div');
      s.className = 'slot';
      if (tray[i]) { s.classList.add('filled'); s.textContent = ICONS[tray[i].type]; }
      trayEl.appendChild(s);
    }
  }

  function renderBank() {
    bankEl.innerHTML = '';
    if (!bank.length) return;
    var label = document.createElement('span');
    label.style.color = 'var(--muted)';
    label.style.fontSize = '12px';
    label.textContent = '移出区:';
    bankEl.appendChild(label);
    for (var i = 0; i < bank.length; i++) {
      var s = document.createElement('div');
      s.className = 'bankitem';
      s.textContent = ICONS[bank[i]];
      bankEl.appendChild(s);
    }
  }

  // ---------- tools ----------
  function updateToolBtns() {
    shuffleCnt.textContent = toolShuffle;
    removeCnt.textContent = toolRemove;
    shuffleBtn.disabled = toolShuffle <= 0;
    removeBtn.disabled = toolRemove <= 0;
  }
  function undo() {
    if (over) return;
    if (!tray.length) return;
    ensureAudio();
    var e = tray.pop();
    // find the original tile (not done) and restore
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].id === e.id) { tiles[i].done = false; tiles[i].el.classList.remove('removing'); }
    }
    sfx.tool();
    renderTray();
    layoutTiles();
    queueSave();
  }
  function doShuffle() {
    if (over || toolShuffle <= 0) return;
    var remaining = [];
    for (var i = 0; i < tiles.length; i++) if (!tiles[i].done) remaining.push(tiles[i]);
    var types = remaining.map(function (t) { return t.type; });
    shuffle(types);
    for (var j = 0; j < remaining.length; j++) {
      remaining[j].type = types[j];
      remaining[j].el.textContent = ICONS[types[j]];
    }
    toolShuffle--;
    sfx.tool();
    updateToolBtns();
    queueSave();
  }
  function doRemove() {
    if (over || toolRemove <= 0) return;
    if (!tray.length) return;
    var n = Math.min(3, tray.length);
    for (var i = 0; i < n; i++) bank.push(tray.shift().type);
    toolRemove--;
    sfx.tool();
    renderTray();
    renderBank();
    updateToolBtns();
    queueSave();
  }

  // ---------- flow ----------
  function checkWin() {
    for (var i = 0; i < tiles.length; i++) if (!tiles[i].done) return;
    over = true;
    sfx.win();
    showOverlay('🎉 过关！', '第 <b>' + level + '</b> 关完成 · 消除 <b>' + cleared + '</b> 组', '下一关', false);
    queueSave();
  }
  function nextLevel() {
    level++;
    clearSave();
    resetLevel();
    hideOverlay();
  }
  function restart() {
    clearSave();
    resetLevel();
    hideOverlay();
  }

  function showOverlay(title, sub, btn, isGhost) {
    ovTitle.textContent = title;
    ovSub.innerHTML = sub;
    ovBtn.textContent = btn;
    ovBtn.className = isGhost ? 'ghost' : '';
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  // ---------- restore ----------
  function restoreGame(data) {
    level = data.level || 1;
    cleared = data.cleared || 0;
    clearedEl.textContent = cleared;
    levelEl.textContent = level;
    buildBoard();
    toolShuffle = data.toolShuffle || 0;
    toolRemove = data.toolRemove || 0;
    bank = data.bank || [];
    over = !!data.over;
    boardEl.innerHTML = '';
    tiles = [];
    for (var i = 0; i < data.tiles.length; i++) {
      var d = data.tiles[i];
      var el = document.createElement('div');
      el.className = 'tile';
      el.textContent = ICONS[d.type];
      var t = { id: nextId, r: d.r, c: d.c, layer: d.layer, type: d.type, done: d.done, el: el };
      nextId++;
      (function (tt) { el.addEventListener('click', function () { clickTile(tt); }); })(t);
      if (d.done) el.classList.add('removing');
      boardEl.appendChild(el);
      tiles.push(t);
    }
    tray = data.tray.map(function (e) { return { type: e.type, or: e.or, oc: e.oc, ol: e.ol }; });
    updateToolBtns();
    layoutTiles();
    renderTray();
    renderBank();
    hideOverlay();
  }

  // ---------- events ----------
  undoBtn.addEventListener('click', undo);
  shuffleBtn.addEventListener('click', doShuffle);
  removeBtn.addEventListener('click', doRemove);
  newBtn.addEventListener('click', restart);
  ovBtn.addEventListener('click', function () {
    if (ovTitle.textContent === '🎉 过关！') nextLevel();
    else restart();
  });
  window.addEventListener('resize', function () { buildBoard(); layoutTiles(); });

  // ---------- boot ----------
  buildBoard();
  var saved = loadSave();
  if (saved) {
    resetLevel();
    showOverlay('检测到存档', '上次玩到第 <b>' + saved.level + '</b> 关，是否继续？',
      '放弃存档，新游戏', true);
    var resumeBtn = document.createElement('button');
    resumeBtn.textContent = '继续上次游戏';
    resumeBtn.style.background = 'linear-gradient(90deg, var(--accent), #22c1a8)';
    ovBtn.parentNode.insertBefore(resumeBtn, ovBtn.nextSibling);
    resumeBtn.addEventListener('click', function () { resumeBtn.remove(); restoreGame(saved); });
  } else {
    resetLevel();
    hideOverlay();
  }

  // debug hook (read-only, harmless)
  window.__pig = {
    getState: function () {
      return {
        tiles: tiles.map(function (t) { return { id: t.id, type: t.type, done: t.done, r: t.r, c: t.c, layer: t.layer, covered: !t.done && isCovered(t) }; }),
        tray: tray.map(function (e) { return { type: e.type }; }),
        level: level, cleared: cleared, bank: bank.slice()
      };
    },
    clickById: function (id) {
      for (var i = 0; i < tiles.length; i++) if (tiles[i].id === id) { clickTile(tiles[i]); return true; }
      return false;
    },
    forceWin: function () { for (var i = 0; i < tiles.length; i++) tiles[i].done = true; layoutTiles(); checkWin(); }
  };
})();
  
  // ===== 背景音乐 (轻快欢乐风格 · 旋律+低音) =====
  (function () {
    'use strict';
    var BGM_KEY = 'bgm.muted.v1';
    var on = true;
    try { on = localStorage.getItem(BGM_KEY) !== '1'; } catch (e) {}
    var audio = null, timer = null, idx = 0;
    var MELODY = [523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33,
                  523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 0];
    var BASS =   [130.81, 130.81, 196.00, 196.00, 220.00, 220.00, 174.61, 174.61,
                  130.81, 130.81, 196.00, 196.00, 220.00, 174.61, 196.00, 0];

          if (b > 0) play(b, next, step * 1.8, 'sine', 0.15);

    }

    function toggle() {
      ensure();

        if (audio && audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); }

      try { localStorage.setItem(BGM_KEY, on ? '0' : '1'); } catch (e) {}

      setBtn();
    }
    var st = document.createElement('style');
    st.textContent = '#bgm-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;z-index:30}';
    document.head.appendChild(st);
    var hdr = document.querySelector('header');
    if (hdr) {
      var btn = document.createElement('button');
      btn.id = 'bgm-btn'; btn.className = 'btn'; btn.textContent = '🎵'; btn.title = '背景音乐';
      btn.addEventListener('click', toggle);
      hdr.appendChild(btn);
    }
    function tryStart() { ensure(); if (audio && on) { if (audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); } if (!timer) start(); } }
    function first(e) { if (e && e.target && e.target.closest && e.target.closest('#bgm-btn')) return; tryStart(); }

    document.addEventListener('touchstart', first, { once: true });
    document.addEventListener('keydown', first, { once: true });
    tryStart();
    window.addEventListener('pagehide', stop);
    setBtn();
  })();
