<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>贪吃蛇 · Snake</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%2338f0d0'/><circle cx='36' cy='36' r='9' fill='%23062a24'/><circle cx='64' cy='36' r='9' fill='%23062a24'/></svg>" />
<style>
  :root {
    --bg: #0b0e1a;
    --panel: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12);
    --accent: #38f0d0;
    --accent2: #7c6bff;
    --text: #e8ecff;
    --muted: #8a92b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 20%, #141a33 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 100%;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  header { display: flex; align-items: center; gap: 16px; }
  .hud {
    display: flex; flex-direction: column; align-items: center; min-width: 116px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px 18px;
  }
  .hud .label { font-size: 12px; color: var(--muted); letter-spacing: 3px; }
  .hud .value { font-size: 26px; font-weight: 700; line-height: 1.2; }
  #score { color: var(--accent); }
  #best { color: #ffd166; }
  #mute-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 18px;
  }
  #mute-btn:hover { background: rgba(255,255,255,0.1); }
  #wrap { position: relative; }
  canvas {
    width: min(88vmin, 540px);
    aspect-ratio: 1 / 1;
    background: #0d1226;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: block;
    touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(8,10,22,0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 20px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 42px; letter-spacing: 6px; margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 2; max-width: 320px; }
  #overlay .sub b { color: var(--accent); }
  #start-btn {
    margin-top: 6px; background: linear-gradient(90deg, var(--accent), #22c1a8);
    color: #062a24; font-size: 18px; font-weight: 700; border: none;
    padding: 12px 36px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(56,240,208,.35);
  }
  #start-btn:active { transform: scale(.96); }
  .keys { display: flex; gap: 6px; justify-content: center; margin-top: 4px; flex-wrap: wrap; }
  .key {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: var(--muted);
  }
  footer { color: var(--muted); font-size: 12px; }
  @media (max-width: 520px) {
    #overlay h1 { font-size: 30px; letter-spacing: 4px; }
    .hud { min-width: 90px; }
    .hud .value { font-size: 20px; }
    #wrap { width: 100%; display: flex; justify-content: center; }
    canvas { width: min(94vw, 88vmin); }
  }
</style>
</head>
<body>
  <header>
    <div class="hud"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="hud"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <button id="mute-btn" title="声音开关">🔊</button>
  </header>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1 id="ov-title">贪吃蛇</h1>
      <div class="sub" id="ov-sub"></div>
      <button id="start-btn">开始游戏</button>
      <div class="keys">
        <span class="key">↑↓←→ / WASD</span>
        <span class="key">空格 暂停</span>
        <span class="key">R 重开</span>
        <span class="key">📱 滑动控制</span>
      </div>
    </div>
  </div>
  <footer>吃掉红色苹果 +10 · 金色星星 +30（限时）</footer>
  <script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovSub = document.getElementById('ov-sub');
  const startBtn = document.getElementById('start-btn');
  const muteBtn = document.getElementById('mute-btn');

  const COLS = 28, ROWS = 28;
  const BASE_STEP = 145, MIN_STEP = 60, SPEED_DOWN = 3;
  const APPLE_PTS = 10, GOLDEN_PTS = 30, GOLDEN_LIFE = 8000, GOLDEN_CHANCE = 0.22;
  const BEST_KEY = 'snake.best.v1', MUTE_KEY = 'snake.muted.v1';

  let dpr = 1, cssW = 400, pad = 18, board = 364, cell = board / COLS;
  let state = 'idle';
  let snake = [], prev = [], dir = { x: 1, y: 0 }, queued = { x: 1, y: 0 };
  let apple = null, golden = null;
  let score = 0, best = 0;
  let foodsEaten = 0, stepMs = BASE_STEP, timer = 0, t = 0;
  let particles = [], shake = 0, flash = 0;
  let muted = false;
  let raf = null, last = 0, audio = null;

  try { best = +(localStorage.getItem(BEST_KEY) || 0); } catch (e) {}
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}

  // ---------- audio ----------
  function ensureAudio() {
    try {
      if (!audio) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audio = new AC();
      }
      if (audio && audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted || !audio) return;
    try {
      const o = audio.createOscillator();
      const g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    eat() { tone(520, 0.09, 'sine', 0.2, 260); },
    golden() {
      tone(660, 0.1, 'triangle', 0.22, 330);
      setTimeout(function () { tone(880, 0.12, 'triangle', 0.22, 220); }, 90);
    },
    die() { tone(320, 0.5, 'sawtooth', 0.22, -220); },
    click() { tone(440, 0.05, 'sine', 0.12); }
  };

  // ---------- layout ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cssW = canvas.clientWidth;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssW * dpr);
    pad = cssW * 0.045;
    board = cssW - pad * 2;
    cell = board / COLS;
  }

  // ---------- helpers ----------
  function lerp(a, b, k) { return a + (b - a) * k; }
  function ease(k) { return 1 - Math.pow(1 - k, 3); }
  function clone(s) { return s.map(function (p) { return { x: p.x, y: p.y }; }); }

  function randomFreeCell() {
    const takenArr = snake.map(function (p) { return p.x + ',' + p.y; });
    if (apple) takenArr.push(apple.x + ',' + apple.y);
    if (golden) takenArr.push(golden.x + ',' + golden.y);
    const taken = new Set(takenArr);
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!taken.has(x + ',' + y)) free.push({ x: x, y: y });
      }
    }
    return free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function spawnApple() {
    const p = randomFreeCell();
    if (p) apple = { x: p.x, y: p.y };
  }

  function reset() {
    snake = [{ x: 13, y: 14 }, { x: 12, y: 14 }, { x: 11, y: 14 }];
    prev = clone(snake);
    dir = { x: 1, y: 0 }; queued = { x: 1, y: 0 };
    apple = null; golden = null;
    score = 0; foodsEaten = 0; stepMs = BASE_STEP; timer = 0; t = 0;
    particles = []; shake = 0; flash = 0;
    scoreEl.textContent = '0';
    spawnApple();
  }

  // ---------- flow ----------
  function setOverlay(title, sub, btn, show) {
    ovTitle.textContent = title;
    ovSub.innerHTML = sub;
    startBtn.textContent = btn;
    overlay.classList.toggle('hidden', !show);
  }

  function start() {
    ensureAudio();
    reset();
    state = 'playing';
    setOverlay('', '', '', false);
  }

  function pause() {
    if (state !== 'playing') return;
    state = 'paused';
    setOverlay('已暂停', '按 空格 / P 或点按钮继续', '继续游戏', true);
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'playing';
    setOverlay('', '', '', false);
  }
  function gameOver() {
    state = 'over';
    sfx.die();
    shake = 10; flash = 1;
    const isNew = score > best && score > 0;
    if (isNew) {
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
      bestEl.textContent = best;
    }
    setOverlay('游戏结束',
      '本局得分 <b>' + score + '</b>' + (isNew ? ' · 新纪录！' : '') +
      '<br/>最高分 <b>' + best + '</b>',
      '再玩一次', true);
  }

  // ---------- logic ----------
  function step() {
    dir = queued;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { gameOver(); return; }

    const eatApple = !!(apple && head.x === apple.x && head.y === apple.y);
    const eatGolden = !!(golden && head.x === golden.x && head.y === golden.y);
    const willEat = eatApple || eatGolden;

    const body = willEat ? snake : snake.slice(0, -1);
    for (let i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) { gameOver(); return; }
    }

    prev = clone(snake);
    snake.unshift(head);

    if (willEat) {
      if (eatApple) {
        score += APPLE_PTS;
        sfx.eat();
        spawnApple();
        burst(head, '#ff5d6c');
        maybeSpawnGolden();
      } else {
        score += GOLDEN_PTS;
        sfx.golden();
        golden = null;
        burst(head, '#ffd166');
        shake = Math.max(shake, 5);
      }
      foodsEaten++;
      stepMs = Math.max(MIN_STEP, BASE_STEP - foodsEaten * SPEED_DOWN);
      scoreEl.textContent = score;
    } else {
      snake.pop();
    }

    if (golden && Date.now() - golden.born > GOLDEN_LIFE) golden = null;
  }

  function maybeSpawnGolden() {
    if (golden) return;
    if (Math.random() < GOLDEN_CHANCE) {
      const p = randomFreeCell();
      if (p) golden = { x: p.x, y: p.y, born: Date.now() };
    }
  }

  function setDir(d) {
    ensureAudio();
    if (state === 'over' || state === 'idle') start();
    if (state === 'paused' || state !== 'playing') return;
    const rev = function (a, b) { return a.x + b.x === 0 && a.y + b.y === 0; };
    if (rev(d, dir) || rev(d, queued)) return;
    queued = d;
  }

  function burst(p, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      particles.push({
        x: p.x + 0.5, y: p.y + 0.5,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.5 + Math.random() * 0.4, age: 0,
        size: 2 + Math.random() * 3, color: color
      });
    }
  }

  // ---------- update ----------
  function update(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
      if (p.age >= p.life) particles.splice(i, 1);
    }
    shake = Math.max(0, shake - dt * 28);
    flash = Math.max(0, flash - dt * 2.5);

    if (state !== 'playing') return;
    timer += dt * 1000;
    if (timer >= stepMs) {
      timer -= stepMs;
      step();
      if (state !== 'playing') return;
    }
    t = Math.min(1, timer / stepMs);
  }

  // ---------- draw ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function drawStar(x, y, spikes, outer, inner) {
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const rad = i % 2 === 0 ? outer : inner;
      const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
      const px = x + Math.cos(a) * rad;
      const py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssW);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // board background
    roundRect(0, 0, cssW, cssW, cssW * 0.06);
    ctx.fillStyle = '#0d1226';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = pad + i * cell;
      ctx.moveTo(x, pad); ctx.lineTo(x, pad + board);
    }
    for (let j = 1; j < ROWS; j++) {
      const y = pad + j * cell;
      ctx.moveTo(pad, y); ctx.lineTo(pad + board, y);
    }
    ctx.stroke();

    const cx = function (p) { return pad + (p.x + 0.5) * cell; };
    const cy = function (p) { return pad + (p.y + 0.5) * cell; };

    // apple
    if (apple) {
      const pulse = 1 + Math.sin(performance.now() / 220) * 0.08;
      const r = cell * 0.33 * pulse;
      const x = cx(apple), y = cy(apple);
      ctx.save();
      ctx.shadowColor = 'rgba(255,93,108,0.8)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff5d6c';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.arc(x - r * 0.32, y - r * 0.32, r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3fae5a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y - r);
      ctx.quadraticCurveTo(x + r * 0.2, y - r * 1.15, x + r * 0.45, y - r * 0.9);
      ctx.stroke();
      ctx.restore();
    }

    // golden star
    if (golden) {
      const now = Date.now();
      const remain = Math.max(0, 1 - (now - golden.born) / GOLDEN_LIFE);
      const pulse = 1 + Math.sin(performance.now() / 160) * 0.12;
      const x = cx(golden), y = cy(golden);
      const r = cell * 0.42 * pulse;
      ctx.save();
      ctx.shadowColor = 'rgba(255,209,102,0.9)';
      ctx.shadowBlur = 20;
      drawStar(x, y, 5, r, r * 0.5);
      ctx.fillStyle = '#ffd166';
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, r + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * remain);
      ctx.stroke();
      ctx.restore();
    }

    // snake
    const k = ease(t);
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const from = prev[Math.min(i, prev.length - 1)];
      const to = snake[i];
      const px = pad + (lerp(from.x, to.x, k) + 0.5) * cell;
      const py = pad + (lerp(from.y, to.y, k) + 0.5) * cell;
      const headFrac = 1 - i / n;
      const radius = cell * (0.28 + 0.08 * headFrac);
      ctx.save();
      if (i === 0) {
        ctx.shadowColor = 'rgba(56,240,208,0.8)';
        ctx.shadowBlur = 16;
      }
      const g = ctx.createLinearGradient(px - radius, py - radius, px + radius, py + radius);
      if (i === 0) {
        g.addColorStop(0, '#7dffe8'); g.addColorStop(1, '#1fc7ae');
      } else {
        g.addColorStop(0, '#38e0c0'); g.addColorStop(1, '#169c8c');
      }
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, radius, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
      if (i === 0) {
        const ex = dir.x, ey = dir.y;
        const pv = { x: -ey, y: ex };
        const eyeOff = radius * 0.5;
        const fwd = radius * 0.45;
        for (let s = 1; s >= -1; s -= 2) {
          const exx = px + ex * fwd + pv.x * eyeOff * s;
          const eyy = py + ey * fwd + pv.y * eyeOff * s;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.arc(exx, eyy, radius * 0.22, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#0b2a26';
          ctx.beginPath();
          ctx.arc(exx + ex * radius * 0.1, eyy + ey * radius * 0.1, radius * 0.11, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // particles
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pad + p.x * cell, pad + p.y * cell, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // death flash
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,60,80,' + (flash * 0.22) + ')';
      ctx.fillRect(0, 0, cssW, cssW);
    }
  }

  // ---------- loop ----------
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    raf = requestAnimationFrame(loop);
  }

  // ---------- events ----------
  const KEYMAP = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
  };

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown' ||
        e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
    const d = KEYMAP[e.key];
    if (d) { setDir(d); return; }
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      ensureAudio();
      if (state === 'playing') pause();
      else if (state === 'paused') resume();
      else if (state === 'over') start();
      return;
    }
    if (e.key === 'r' || e.key === 'R' || e.key === 'Enter') {
      if (state === 'playing' || state === 'paused' || state === 'over' || state === 'idle') start();
    }
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    ensureAudio();
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir({ x: Math.sign(dx), y: 0 });
    else setDir({ x: 0, y: Math.sign(dy) });
  }, { passive: true });

  canvas.addEventListener('pointerup', function (e) {
    if (e.pointerType !== 'mouse') return;
    ensureAudio();
    if (state === 'idle' || state === 'over') start();
    else if (state === 'paused') resume();
  });

  startBtn.addEventListener('click', function () {
    ensureAudio();
    sfx.click();
    if (state === 'paused') resume(); else start();
  });
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (err) {}
    muteBtn.textContent = muted ? '🔇' : '🔊';
    ensureAudio();
  });
  window.addEventListener('resize', resize);

  // ---------- boot ----------
  bestEl.textContent = best;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  resize();
  reset();
  setOverlay('贪吃蛇',
    '吃掉红色苹果得 <b>10</b> 分，金色星星得 <b>30</b> 分（限时出现）<br/>越吃越快，别撞墙也别咬到自己',
    '开始游戏', true);
  last = performance.now();
  raf = requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
