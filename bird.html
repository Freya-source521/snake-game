<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>愤怒的小鸟 · Angry Birds</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='36' fill='%23ff4d4d'/><path d='M22 46 a30 26 0 0 1 56 0 l-6 4 q-3 -5 -8 -3 q3 6 -1 8 q-4 -6 -10 -3 q3 6 -1 7 q-4 -6 -12 -2 q3 5 0 7 q-6 -7 -14 -3 q4 4 2 7 q-8 -4 -14 2 q-1 -6 2 -9 q-6 1 -8 -5 q4 -3 9 -5 q-2 -4 -2 -4z' fill='%23f2d8a0'/><circle cx='33' cy='47' r='4' fill='%23000'/><circle cx='67' cy='47' r='4' fill='%23000'/><path d='M50 52 l0 10' stroke='%23000' stroke-width='2'/></svg>" />
<style>
  :root {
    --bg: #0b0e1a; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --accent: #38f0d0; --accent2: #ffb347; --text: #e8ecff; --muted: #8a92b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 12%, #20304a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; min-height: 100%; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  header { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; justify-content: center; }
  a.home { text-decoration: none; color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; }
  .hud { background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 3px 9px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  .hud b { color: var(--accent); }
  #bgm-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 4px 8px; cursor: pointer; font-size: 14px; }
  #wrap { position: relative; }
  canvas {
    width: min(96vw, 150vh, 900px);
    aspect-ratio: 760 / 420;
    background: linear-gradient(180deg, #8fd0ff 0%, #cfeaff 60%, #6dbd4f 60%, #4d9c38 100%);
    border-radius: 16px; border: 1px solid var(--border);
    box-shadow: 0 16px 48px rgba(0,0,0,.5); display: block; cursor: crosshair;
    touch-action: none;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; background: rgba(8,10,22,0.82);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    border-radius: 16px; text-align: center; padding: 16px; z-index: 1000;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 30px; letter-spacing: 4px; margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay .sub { color: var(--muted); font-size: 13px; line-height: 1.9; }
  #overlay .sub b { color: var(--accent); }
  #overlay .row { display: flex; gap: 8px; align-items: center; }
  #overlay select, #start-btn {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #start-btn { background: linear-gradient(90deg, var(--accent), #22c1a8); color: #062a24; border: none; }
  #start-btn:active { transform: scale(.96); }
  .keys { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .key { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; font-size: 11px; color: var(--muted); }
  .saved-tip { color: var(--muted); font-size: 11px; text-align: center; }
  @media (max-width: 600px) { #overlay h1 { font-size: 22px; } .hud { font-size: 11px; padding: 2px 6px; } }
</style>
</head>
<body>
  <header>
    <a class="home" href="./">🏠 主页</a>
    <div class="hud">关卡 <b id="lvl">1</b>/15</div>
    <div class="hud">猪猪 <b id="pignum">0</b></div>
    <div class="hud">得分 <b id="score">0</b></div>
    <div class="hud">最高 <b id="best">0</b></div>
    <button id="bgm-btn" title="背景音乐">🎵</button>
  </header>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>🐦 愤怒的小鸟</h1>
      <div class="sub">横屏体验最佳 📱<br/>按住小鸟向后拖，松手发射 · 轨迹预览帮你瞄准<br/>击倒<b>所有绿猪</b>过关！飞行中<b>点按</b>触发技能<br/>🟡加速 · 🔵分身</div>
      <div class="row">
        <select id="lvl-sel"></select>
        <button id="start-btn">开始游戏</button>
      </div>
      <div class="keys"><span class="key">📱 拖拽发射</span><span class="key">点按=技能</span></div>
    </div>
  </div>
  <div class="saved-tip">💾 自动存档最高关卡与得分 · 15 关 · 难度递增</div>
  <script>
(function () {
  'use strict';

  // ===== 存档 =====
  var SAVE_KEY = 'bird.save.v1';
  var best = 0, unlocked = 1;
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) { var o = JSON.parse(raw); best = o.best || 0; unlocked = o.unlocked || 1; }
  } catch (e) {}
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ best: best, unlocked: unlocked })); } catch (e) {} }

  // ===== 画布(横屏) =====
  var W = 760, H = 420, GROUND = 376;
  var canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  var lvlEl = document.getElementById('lvl'), pigEl = document.getElementById('pignum');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay'), sel = document.getElementById('lvl-sel');
  var startBtn = document.getElementById('start-btn');

  // ===== 物理常量 =====
  var GRAV = 1000, DAMP = 0.99, ITER = 8, PSTEP = 1 / 120;

  // ===== 素材 =====
  var MAT = {
    wood: { c: '#d29a56', c2: '#8a5a28', breakByBird: 150, breakByBody: 520, inv: 0.9 },
    ice:  { c: '#c9ecff', c2: '#7dbce4', breakByBird: 85,  breakByBody: 540, inv: 0.8 },
    stone:{ c: '#a6aeba', c2: '#5d6570', breakByBird: 9999, breakByBody: 9999, inv: 0.22 }
  };
  var BIRD = { r: { c: '#ff5b52', c2: '#b21a14' }, y: { c: '#ffd94d', c2: '#c99a00' }, b: { c: '#7ec8ff', c2: '#2b6fd0' } };
  var PIG = { c: '#93d84a', c2: '#4f8f1d' };
  var PIG_R = 17, KILL_PIG_SPEED = 280;
  var SLING = { x: 70, y: GROUND - 66 };
  var LAUNCH_K = 6.2, MAX_SPEED = 1200;

  // ===== 游戏状态 =====
  var state = 'menu';
  var level = 1, score = 0;
  var bodies = [], birdQueue = [], loaded = null, active = [];
  var usedAbility = {};
  var startedAt = 0, waiting = 0, nextT = -1;
  var puffs = [], scoreFloats = [];
  var shake = 0, freezeT = 0;
  var prevP = null, dragging = false, dragStart = null;

  function addBody(o) {
    if (o.inv === undefined) o.inv = 1;
    o.px = o.x; o.py = o.y; o.vx = o.vx || 0; o.vy = o.vy || 0; o.dead = false;
    bodies.push(o);
    return o;
  }

  // ===== 关卡生成(横屏, 从地面正确堆叠) =====
  var S = 32, PH = 14;
  function B(x, y, w, h, mat) { return { kind: 'box', mat: mat, x: x, y: y, hw: w / 2, hh: h / 2 }; }
  function col(x, h, mat) { var a = []; for (var i = 0; i < h; i++) a.push(B(x, GROUND - S / 2 - i * S, S, S, mat)); return a; }
  function pground(x) { return { kind: 'circle', type: 'pig', x: x, y: GROUND - PIG_R, r: PIG_R }; }
  function pcol(x, h) { return { kind: 'circle', type: 'pig', x: x, y: GROUND - h * S - PIG_R, r: PIG_R }; }
  function pplank(x, h) { return { kind: 'circle', type: 'pig', x: x, y: GROUND - h * S - PH - PIG_R, r: PIG_R }; }
  function plank(cx, w, h, mat) { return [B(cx, GROUND - h * S - PH / 2, w, PH, mat)]; }

  function makeLevel(n) {
    var blocks = [], pigs = [], birds = [];
    function aB(bs) { for (var i = 0; i < bs.length; i++) blocks.push(bs[i]); }
    function aP(p) { pigs.push(p); }
    function towerPair(c1, c2, h, mat, topPig) {
      aB(col(c1, h, mat)); aB(col(c2, h, mat));
      if (topPig) { aP(pcol(c1, h)); }
    }
    if (n === 1) { birds = ['r', 'r', 'r']; aP(pground(300)); }
    else if (n === 2) { birds = ['r', 'r', 'r']; aP(pground(280)); aP(pground(430)); }
    else if (n === 3) { birds = ['r', 'r', 'r', 'r']; aB(col(360, 2, 'wood')); aP(pcol(360, 2)); aP(pground(220)); aP(pground(520)); }
    else if (n === 4) { birds = ['r', 'r', 'r', 'y']; aB(col(340, 2, 'wood')); aP(pcol(340, 2)); aB(col(480, 1, 'wood')); aP(pcol(480, 1)); aP(pground(220)); aP(pground(580)); }
    else if (n === 5) { birds = ['r', 'r', 'y', 'r']; aB(col(300, 1, 'wood')); aB(col(440, 1, 'wood')); aB(plank(370, 220, 1, 'wood')); aP(pplank(300, 1)); aP(pplank(440, 1)); aP(pground(220)); aP(pground(560)); }
    else if (n === 6) { birds = ['r', 'r', 'y', 'y']; aB(col(360, 3, 'wood')); aP(pcol(360, 3)); aB(col(480, 1, 'wood')); aP(pcol(480, 1)); aP(pground(250)); aP(pground(560)); }
    else if (n === 7) { birds = ['r', 'r', 'r', 'y', 'y']; aB(col(320, 2, 'wood')); aB(col(470, 2, 'wood')); aB(plank(395, 260, 2, 'wood')); aP(pplank(330, 2)); aP(pplank(460, 2)); aP(pground(230)); aP(pground(600)); }
    else if (n === 8) { birds = ['r', 'r', 'r', 'y', 'r']; aB(col(360, 3, 'wood')); aP(pcol(360, 3)); aB(col(470, 1, 'ice')); aP(pcol(470, 1)); aP(pground(260)); aP(pground(560)); aB(col(220, 1, 'wood')); aP(pcol(220, 1)); }
    else if (n === 9) { birds = ['r', 'r', 'y', 'b', 'r']; aB(col(300, 1, 'wood')); aB(col(440, 1, 'wood')); aB(plank(370, 240, 1, 'wood')); aP(pplank(320, 1)); aP(pplank(420, 1)); aB(col(580, 3, 'ice')); aP(pcol(580, 3)); aP(pground(150)); aP(pground(650)); }
    else if (n === 10) { birds = ['r', 'r', 'y', 'b']; aB(col(340, 2, 'stone')); aP(pcol(340, 2)); aB(col(470, 1, 'stone')); aP(pcol(470, 1)); aB(col(230, 2, 'ice')); aP(pcol(230, 2)); aP(pground(580)); }
    else if (n === 11) { birds = ['r', 'y', 'b', 'r', 'y']; aB(col(280, 2, 'wood')); aB(col(430, 2, 'stone')); aB(plank(355, 260, 2, 'wood')); aP(pplank(300, 2)); aP(pplank(450, 2)); aB(col(580, 3, 'ice')); aP(pcol(580, 3)); aP(pground(170)); aP(pground(650)); }
    else if (n === 12) { birds = ['y', 'y', 'b', 'r']; aB(col(320, 3, 'stone')); aP(pcol(320, 3)); aB(col(450, 2, 'ice')); aP(pcol(450, 2)); aP(pground(230)); aP(pground(560)); aB(col(200, 1, 'stone')); aP(pcol(200, 1)); }
    else if (n === 13) { birds = ['b', 'b', 'y', 'r', 'r']; aB(col(270, 2, 'stone')); aB(col(400, 2, 'stone')); aB(plank(335, 260, 2, 'wood')); aP(pplank(290, 2)); aP(pplank(380, 2)); aB(col(330, 3, 'ice')); aP(pcol(330, 3)); aP(pground(170)); aP(pground(560)); aP(pground(620)); }
    else if (n === 14) { birds = ['y', 'b', 'y', 'b', 'r']; aB(col(300, 3, 'stone')); aP(pcol(300, 3)); aB(col(440, 1, 'wood')); aB(plank(440, 120, 1, 'ice')); aP(pplank(440, 1)); aB(col(190, 2, 'ice')); aP(pcol(190, 2)); aB(col(520, 2, 'stone')); aP(pcol(520, 2)); aP(pground(560)); aP(pground(640)); }
    else {
      birds = ['r', 'y', 'b', 'y', 'r'];
      aB(col(220, 2, 'stone')); aP(pcol(220, 2));
      aB(col(340, 2, 'wood')); aP(pcol(340, 2));
      aB(col(480, 2, 'stone')); aP(pcol(480, 2));
      aB(plank(290, 200, 2, 'wood')); aP(pplank(290, 2));
      aB(col(410, 3, 'ice')); aP(pcol(410, 3));
      aB(col(580, 1, 'wood')); aP(pcol(580, 1));
      aP(pground(150));
    }
    return { birds: birds, pigs: pigs, blocks: blocks };
  }

  // ===== 物理: PBD(已验证) =====
  function step(h) {
    var i, j, k, b, f;
    for (i = 0; i < bodies.length; i++) {
      f = bodies[i];
      if (!isFinite(f.x) || !isFinite(f.y)) { f.x = f.px; f.y = f.py; f.vx = 0; f.vy = 0; }
      f.px = f.x; f.py = f.y;
      f.vy += GRAV * h;
      f.x += f.vx * h; f.y += f.vy * h;
      if (!isFinite(f.x) || !isFinite(f.y)) { f.x = f.px; f.y = f.py; f.vx = 0; f.vy = 0; }
    }
    for (var it = 0; it < ITER; it++) {
      for (i = 0; i < bodies.length; i++) walls(bodies[i]);
      for (i = 0; i < bodies.length; i++) {
        for (j = i + 1; j < bodies.length; j++) collide(bodies[i], bodies[j]);
      }
      for (k = 0; k < bodies.length; k++) {
        b = bodies[k];
        if (!isFinite(b.x) || !isFinite(b.y)) {
          b.x = isFinite(b.px) ? b.px : 300;
          b.y = isFinite(b.py) ? b.py : GROUND - 40;
          b.vx = 0; b.vy = 0;
        }
      }
    }
    for (i = 0; i < bodies.length; i++) {
      b = bodies[i];
      b.vx = (b.x - b.px) / h * DAMP;
      b.vy = (b.y - b.py) / h * DAMP;
      if (!isFinite(b.vx) || !isFinite(b.vy)) { b.vx = 0; b.vy = 0; }
      if (bottom(b) >= GROUND - 0.5) { if (b.vy > 0) b.vy = 0; b.vx *= 0.998; }
      var spd = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (spd > MAX_SPEED) { b.vx *= MAX_SPEED / spd; b.vy *= MAX_SPEED / spd; }
      if (Math.abs(b.vx) < 0.04) b.vx = 0;
      if (Math.abs(b.vy) < 0.04) b.vy = 0;
    }
  }
  function bottom(b) { return b.kind === 'circle' ? b.y + b.r : b.y + b.hh; }
  function walls(b) {
    if (bottom(b) > GROUND) b.y -= bottom(b) - GROUND;
    if ((b.kind === 'circle' ? b.x - b.r : b.x - b.hw) < 0) b.x += b.kind === 'circle' ? 0 - (b.x - b.r) : 0 - (b.x - b.hw);
    if ((b.kind === 'circle' ? b.x + b.r : b.x + b.hw) > W) b.x -= (b.kind === 'circle' ? b.x + b.r : b.x + b.hw) - W;
  }
  function speedOf(b) { return Math.sqrt(b.vx * b.vx + b.vy * b.vy); }
  function collide(A, B) {
    var nx = 0, ny = 0, pen = 0;
    if (!isFinite(A.x + A.y + B.x + B.y)) return;
    var invSum, wA, wB;
    if (A.kind === 'circle' && B.kind === 'circle') {
      var dx = B.x - A.x, dy = B.y - A.y;
      var md = A.r + B.r, d2 = dx * dx + dy * dy;
      if (d2 >= md * md) return;
      if (d2 < 1e-6) { var ra = Math.random() * 6.2832; nx = Math.cos(ra); ny = Math.sin(ra); pen = md * 0.5; }
      else { var d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = md - d; }
      invSum = A.inv + B.inv; wA = A.inv / invSum; wB = B.inv / invSum;
      A.x -= nx * pen * wA; A.y -= ny * pen * wA;
      B.x += nx * pen * wB; B.y += ny * pen * wB;
    } else if (A.kind === 'box' && B.kind === 'box') {
      var ol = Math.min(A.x + A.hw, B.x + B.hw) - Math.max(A.x - A.hw, B.x - B.hw);
      var ot = Math.min(A.y + A.hh, B.y + B.hh) - Math.max(A.y - A.hh, B.y - B.hh);
      if (ol <= 0 || ot <= 0) return;
      if (ol < ot) { nx = A.x < B.x ? 1 : -1; ny = 0; pen = ol; }
      else { nx = 0; ny = A.y < B.y ? 1 : -1; pen = ot; }
      invSum = A.inv + B.inv; wA = A.inv / invSum; wB = B.inv / invSum;
      A.x -= nx * pen * wA; A.y -= ny * pen * wA;
      B.x += nx * pen * wB; B.y += ny * pen * wB;
    } else {
      var C = A.kind === 'circle' ? A : B;
      var K = A.kind === 'box' ? A : B;
      var cx = Math.max(K.x - K.hw, Math.min(C.x, K.x + K.hw));
      var cy = Math.max(K.y - K.hh, Math.min(C.y, K.y + K.hh));
      var ddx = C.x - cx, ddy = C.y - cy, d3 = Math.sqrt(ddx * ddx + ddy * ddy);
      if (d3 > 1e-6) {
        if (d3 >= C.r) return;
        nx = ddx / d3; ny = ddy / d3; pen = C.r - d3;
      } else {
        var l = C.x - (K.x - K.hw), rr = (K.x + K.hw) - C.x, tp = C.y - (K.y - K.hh), bt = (K.y + K.hh) - C.y;
        var m = Math.min(l, rr, tp, bt);
        if (m === l) { nx = -1; ny = 0; pen = C.r + l; }
        else if (m === rr) { nx = 1; ny = 0; pen = C.r + rr; }
        else if (m === tp) { nx = 0; ny = -1; pen = C.r + tp; }
        else { nx = 0; ny = 1; pen = C.r + bt; }
      }
      invSum = C.inv + K.inv;
      if (invSum > 0) {
        var cW = C.inv / invSum, kW = K.inv / invSum;
        C.x += nx * pen * cW; C.y += ny * pen * cW;
        K.x -= nx * pen * kW; K.y -= ny * pen * kW;
      }
    }
  }

  // ===== 游戏流程 =====
  function startLevel(n) {
    level = Math.max(1, Math.min(15, n));
    score = 0;
    var L = makeLevel(level);
    bodies = []; active = []; puffs = []; scoreFloats = []; loaded = null; usedAbility = {}; waiting = 0; nextT = -1; shake = 0; freezeT = 0;
    birdQueue = L.birds.slice();
    for (var i = 0; i < L.blocks.length; i++) {
      var blk = L.blocks[i];
      addBody({ kind: 'box', mat: blk.mat, x: blk.x, y: blk.y, hw: blk.hw, hh: blk.hh, inv: MAT[blk.mat].inv });
    }
    for (i = 0; i < L.pigs.length; i++) {
      var pg = L.pigs[i];
      addBody({ kind: 'circle', type: 'pig', x: pg.x, y: pg.y, r: pg.r });
    }
    lvlEl.textContent = level;
    updateHud();
    state = 'playing';
    startedAt = performance.now();
    hideOverlay();
    loadNextBird();
  }
  function loadNextBird() {
    if (birdQueue.length) {
      var t = birdQueue[0];
      loaded = { type: t, x: SLING.x, y: SLING.y, r: t === 'b' ? 9 : 14 };
    } else loaded = null;
  }
  function launch() {
    if (!loaded || state !== 'playing') return;
    var dx = SLING.x - loaded.x, dy = SLING.y - loaded.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 14) { loaded.x = SLING.x; loaded.y = SLING.y; return; }
    var vx = dx * LAUNCH_K, vy = dy * LAUNCH_K;
    var sp = Math.sqrt(vx * vx + vy * vy);
    if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
    var t = birdQueue.shift();
    var body = addBody({ kind: 'circle', type: 'bird', btype: t, x: loaded.x, y: loaded.y, vx: vx, vy: vy, r: loaded.r, born: performance.now() });
    body.id = 'b' + Math.random();
    usedAbility[body.id] = false;
    active.push(body);
    loaded = null;
    sfx('launch');
    updateHud();
  }
  function ability() {
    if (state !== 'playing') return;
    var arr = active.slice();
    for (var i = 0; i < arr.length; i++) {
      var b = arr[i];
      if (!b || b.dead || usedAbility[b.id]) continue;
      usedAbility[b.id] = true;
      if (b.btype === 'y') { b.vx *= 1.9; b.vy *= 0.8; sfx('dash'); }
      else if (b.btype === 'b') {
        b.dead = true;
        for (var s = -1; s <= 1; s++) {
          var nb = addBody({ kind: 'circle', type: 'bird', btype: 'r', x: b.x, y: b.y + s * 10, vx: b.vx + s * 50, vy: b.vy - 20, r: 8, born: performance.now() });

      else if (kind === 'split') { tone(700, 0.08, 'triangle', 0.12, 0); tone(1050, 0.1, 'triangle', 0.1, 0.05); }
      else if (kind === 'win') { [523, 659, 784, 1046].forEach(function (f, i) { setTimeout(function () { tone(f, 0.16, 'triangle', 0.14, 0); }, i * 110); }); }
      else if (kind === 'lose') { tone(300, 0.4, 'sawtooth', 0.16, 0); }
    } catch (e) {}
  }

  // ===== 背景音乐 =====
  var BGM_KEY = 'bgm.muted.v1';
  var on = true;
  try { on = localStorage.getItem(BGM_KEY) !== '1'; } catch (e) {}
  var audio = null, timer = null, bIdx = 0;
  var MELODY = [523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33, 523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 0];
  var BASS = [130.81, 130.81, 196.00, 196.00, 220.00, 220.00, 174.61, 174.61, 130.81, 130.81, 196.00, 196.00, 220.00, 174.61, 196.00, 0];
  function ensure() {
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); }
    } catch (e) {}
  }
  function play(f, t, dur, type, vol) {
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function startBgm() {
    ensure();
    if (!audio || timer || !on) return;
    var step = 60 / 120 / 2;
    var next = audio.currentTime + 0.1;
    timer = setInterval(function () {
      if (audio.state === 'suspended') return;
      var now = audio.currentTime;
      while (next < now + 0.4) {
        var m = MELODY[bIdx % MELODY.length], b = BASS[bIdx % BASS.length];
        if (m > 0) play(m, next, step * 0.9, 'triangle', 0.2);
        if (b > 0) play(b, next, step * 1.8, 'sine', 0.15);
        bIdx++; next += step;
      }
    }, 120);
  }
  function stopBgm() { if (timer) { clearInterval(timer); timer = null; } }
  function setBtn() { var b = document.getElementById('bgm-btn'); if (b) b.textContent = on ? '🎵' : '🔇'; }
  function toggle() {
    ensure();
    if (on && !(timer && audio && audio.state === 'running')) {
      if (audio && audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); }
      startBgm(); setBtn(); return;
    }
    on = !on;
    try { localStorage.setItem(BGM_KEY, on ? '0' : '1'); } catch (e) {}
    if (on) startBgm(); else stopBgm();
    setBtn();
  }
  document.getElementById('bgm-btn').addEventListener('click', toggle);
  function tryStart() { ensure(); if (audio && on) { if (audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); } if (!timer) startBgm(); } }
  function first(e) { if (e && e.target && e.target.closest && e.target.closest('#bgm-btn')) return; tryStart(); }
  document.addEventListener('pointerdown', first, { once: true });
  document.addEventListener('touchstart', first, { once: true });
  document.addEventListener('keydown', first, { once: true });
  tryStart();

  // ===== 启动 =====
  for (var lv = 1; lv <= 15; lv++) {
    var op = document.createElement('option');
    op.value = lv; op.textContent = '第 ' + lv + ' 关';
    sel.appendChild(op);
  }
  sel.value = Math.min(unlocked, 15);
  bestEl.textContent = best;
  showMenuOverlay();
  requestAnimationFrame(frame);

  // 调试钩子
  window.__bird = {
    getState: function () { return { state: state, level: level, score: score, pigsLeft: bodies.filter(function (b) { return b.type === 'pig' && !b.dead; }).length, birdsLeft: birdQueue.length, active: active.length, loaded: !!loaded }; },
    start: function (n) { startLevel(n || 1); },
    launch: function (vx, vy) {
      if (state !== 'playing') startLevel(1);
      if (!loaded) return false;
      loaded.x = SLING.x - vx; loaded.y = SLING.y - vy;
      launch();
      return true;
    },
    killAll: function () {
      var arr = bodies.slice();
      for (var i = 0; i < arr.length; i++) if (arr[i].type === 'pig') killBody(arr[i], 5000, '#93d84a', 'pop');
    },
    tapAbility: function () { ability(); },
    bodies: function () { return bodies.map(function (b) { return { kind: b.kind, type: b.type || b.mat, x: b.x, y: b.y, px: b.px, py: b.py, vx: b.vx, vy: b.vy, r: b.r, hw: b.hw, hh: b.hh, dead: b.dead }; }); },
    birds: function () { return active.map(function (b) { return { type: b.btype, x: b.x, y: b.y, vx: b.vx, vy: b.vy }; }); }
  };
})();
</script>
