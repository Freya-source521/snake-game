<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>小游戏合集 · 贪吃蛇 2048 消消乐 俄罗斯方块</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='20' fill='%230b0e1a' stroke='%2338f0d0' stroke-width='6'/><text x='50' y='68' font-size='40' text-anchor='middle'>🎮</text></svg>" />
<style>
  :root {
    --bg: #0b0e1a; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --accent: #38f0d0; --accent2: #7c6bff; --text: #e8ecff; --muted: #8a92b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 15%, #141a33 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px 24px; gap: 20px; min-height: 100vh;
  }
  h1 {
    font-size: clamp(26px, 5vw, 40px); letter-spacing: 4px; text-align: center;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { color: var(--muted); font-size: 14px; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 18px; width: 100%; max-width: 1000px; margin-top: 8px; }
  a.card {
    text-decoration: none; color: var(--text);
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 20px; padding: 26px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.card:hover { transform: translateY(-4px); border-color: rgba(56,240,208,0.5); box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .icon { width: 84px; height: 84px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 44px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .c-snake { background: linear-gradient(135deg, #16a08d, #38f0d0); }
  .c-2048 { background: linear-gradient(135deg, #1e5ac2, #38b6ff); }
  .c-xxl { background: linear-gradient(135deg, #e04f62, #ff9a5e); }
  .c-tetris { background: linear-gradient(135deg, #8a5cf6, #38b6ff); }
  .name { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .desc { color: var(--muted); font-size: 13px; line-height: 1.8; min-height: 47px; }
  .go { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: 2px; }
  footer { color: var(--muted); font-size: 12px; margin-top: auto; padding-top: 24px; }
</style>
</head>
<body>
  <h1>🎮 小游戏合集</h1>
  <div class="sub">贪吃蛇 · 2048 · 消消乐 · 俄罗斯方块 —— 选择一个开始玩吧</div>
  <div class="grid">
    <a class="card" href="./snake.html">
      <div class="icon c-snake">🐍</div>
      <div class="name">贪吃蛇</div>
      <div class="desc">吃苹果涨分，小心别撞墙咬到自己<br/>金色星星限时 +30</div>
      <div class="go">开始游戏 →</div>
    </a>
    <a class="card" href="./2048.html">
      <div class="icon c-2048">🔢</div>
      <div class="name">2048</div>
      <div class="desc">滑动合并相同数字<br/>合成 2048 方块吧</div>
      <div class="go">开始游戏 →</div>
    </a>
    <a class="card" href="./xiaoxiaole.html">
      <div class="icon c-xxl">🍬</div>
      <div class="name">消消乐</div>
      <div class="desc">交换相邻糖果，三消连击<br/>消除越多分越高</div>
      <div class="go">开始游戏 →</div>
    </a>
    <a class="card" href="./tetris.html">
      <div class="icon c-tetris">🧱</div>
      <div class="name">俄罗斯方块</div>
      <div class="desc">消除整行得分，等级越高落得越快<br/>支持暂存与幽灵投影</div>
      <div class="go">开始游戏 →</div>
    </a>
  </div>
  <footer>纯浏览器小游戏 · 手机/电脑均可直接游玩</footer>
</body>
</html>
