<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>抓小猪 · Catch the Pig</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='52' r='40' fill='%23ff9db1'/><circle cx='36' cy='44' r='5' fill='%23222'/><circle cx='64' cy='44' r='5' fill='%23222'/><ellipse cx='50' cy='64' rx='12' ry='8' fill='%23ff7a94'/></svg>" />
<style>
  :root {
    --bg: #0b0e1a; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --accent: #38f0d0; --accent2: #ff7a94; --text: #e8ecff; --muted: #8a92b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 15%, #141a33 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; min-height: 100%; overflow: hidden;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
  a.home { text-decoration: none; color: var(--muted); font-size: 13px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; }
  .hud {
    display: flex; flex-direction: column; align-items: center; min-width: 74px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 5px 14px;
  }
  .hud .label { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  .hud .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
  #score { color: var(--accent); }
  #best { color: #ffd166; }
  #lives { color: #ff6b81; letter-spacing: 1px; font-size: 18px; }
  #level { color: var(--accent2); }
  #bgm-btn {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 18px;
  }
  #wrap { position: relative; }
  canvas {
    width: min(92vw, 420px); aspect-ratio: 480 / 700;
    background: linear-gradient(180deg, #10172e 0%, #0d1226 70%);
    border-radius: 20px; border: 1px solid var(--border);
    box-shadow: 0 20px 60px rgba(0,0,0,.5); display: block;
    touch-action: none; cursor: pointer;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: rgba(8,10,22,0.8);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 20px; text-align: center; padding: 20px; z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 40px; letter-spacing: 5px; margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 2; max-width: 340px; }
  #overlay .sub b { color: var(--accent); }
  #overlay .result { font-size: 15px; color: var(--text); line-height: 1.9; display: none; }
  #overlay .result.show { display: block; }
  #overlay .result b { color: var(--accent); font-size: 20px; }
  #start-btn {
    margin-top: 4px; background: linear-gradient(90deg, var(--accent), #22c1a8);
    color: #062a24; font-size: 18px; font-weight: 700; border: none;
    padding: 12px 38px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(56,240,208,.35);
  }
  #start-btn:active { transform: scale(.96); }
  .keys { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .key { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .saved-tip { color: var(--muted); font-size: 11px; }
  @media (max-width: 520px) {
    #overlay h1 { font-size: 30px; letter-spacing: 4px; }
    .hud { min-width: 62px; } .hud .value { font-size: 18px; }
  }
</style>
</head>
<body>
  <header>
    <a class="home" href="./">🏠 主页</a>
    <div class="hud"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="hud"><div class="label">最高分</div><div class="value" id="best">0</div></div>
    <div class="hud"><div class="label">关卡</div><div class="value" id="level">1</div></div>
    <div class="hud"><div class="label">生命</div><div class="value" id="lives">❤️❤️❤️</div></div>
    <button id="bgm-btn" title="背景音乐">🎵</button>
  </header>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h1>🐷 抓小猪</h1>
      <div class="sub">移动托盘接住下落的猪猪<br/>连击加分 · 接住 ⭐ 大加分 · 千万别接 💣<br/>漏接好物或接到炸弹都会扣❤️</div>
      <div class="result" id="result"></div>
      <button id="start-btn">开始游戏</button>
      <div class="keys">
        <span class="key">📱 手指滑动控制托盘</span>
        <span class="key">← → 方向键</span>
        <span class="key">空格 暂停</span>
      </div>
    </div>
  </div>
  <div class="saved-tip">💾 自动存档最高分与关卡 · 关闭页面后回来还在</div>
  <script>
(function () {
  'use strict';

  // ---------- 存档 ----------
  var SAVE_KEY = 'catchpig.save.v1';
  var save = { best: 0, maxLevel: 1 };
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) { var o = JSON.parse(raw); if (o && typeof o.best === 'number') { save.best = o.best; save.maxLevel = o.maxLevel || 1; } }
  } catch (e) {}
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

  // ---------- DOM ----------
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  var levelEl = document.getElementById('level'), livesEl = document.getElementById('lives');
  var overlay = document.getElementById('overlay'), resultEl = document.getElementById('result');
  var startBtn = document.getElementById('start-btn');
  var W = 480, H = 700;

  // ---------- 游戏状态 ----------
  var state = 'menu'; // menu | playing | paused | over
  var score = 0, best = save.best, level = 1, lives = 3, combo = 0, maxCombo = 0;
  var basket = { x: W / 2, w: 108, y: H - 74 };
  var items = [], floats = [], parts = [];
  var autoSpawn = true;
  var spawnTimer = 0, shake = 0, spawnGap = 900, overTick = 0;

  // 物品配置: emoji, 分值, 权重
  var ITEMS = [
    { e: '🥚', v: 5,  w: 16 },   // 蛋
    { e: '🌽', v: 5,  w: 16 },   // 玉米
    { e: '🐷', v: 10, w: 30 },   // 小猪
    { e: '🐖', v: 15, w: 14 },   // 猪猪
    { e: '⭐', v: 30, w: 10 },   // 星星
    { e: '💣', v: -1, w: 10 }    // 炸弹
  ];
  function pickItem() {
    var total = 0, i;
    for (i = 0; i < ITEMS.length; i++) total += ITEMS[i].w;
    var r = Math.random() * total;
    for (i = 0; i < ITEMS.length; i++) { r -= ITEMS[i].w; if (r <= 0) return ITEMS[i]; }
    return ITEMS[0];
  }

  function setState(s) {
    state = s;
    overlay.classList.toggle('hidden', s === 'playing' || s === 'paused');
    if (s === 'paused') { overlay.classList.remove('hidden'); document.querySelector('#overlay h1').textContent = '⏸ 已暂停'; document.querySelector('#overlay .sub').textContent = '按 空格 / 点击 继续'; document.querySelector('#overlay .result').classList.remove('show'); startBtn.textContent = '继续游戏'; }
    else if (s === 'playing') { document.querySelector('#overlay .result').classList.remove('show'); }
    else if (s === 'menu') { document.querySelector('#overlay h1').textContent = '🐷 抓小猪'; document.querySelector('#overlay .sub').innerHTML = '移动托盘接住下落的猪猪<br/>连击加分 · 接住 ⭐ 大加分 · 千万别接 💣<br/>漏接好物或接到炸弹都会扣❤️'; document.querySelector('#overlay .result').classList.remove('show'); startBtn.textContent = '开始游戏'; }
    else if (s === 'over') { overlay.classList.remove('hidden'); document.querySelector('#overlay h1').textContent = '💥 游戏结束'; document.querySelector('#overlay .sub').textContent = ''; resultEl.classList.add('show'); resultEl.innerHTML = '本局得分 <b>' + score + '</b><br/>最高分 <b>' + best + '</b> · 最高连击 <b>' + maxCombo + '</b>'; startBtn.textContent = '再来一局'; }
  }

  function newGame() {
    score = 0; level = 1; lives = 3; combo = 0; maxCombo = 0;
    items = []; floats = []; parts = []; spawnTimer = 0; shake = 0;
    updateHud();
    setState('playing');
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    levelEl.textContent = level;
    var h = '';
    for (var i = 0; i < 3; i++) h += i < lives ? '❤️' : '🖤';
    livesEl.textContent = h;
  }

  function addFloat(x, y, txt, color) {
    floats.push({ x: x, y: y, txt: txt, color: color, t: 0 });
  }
  function boom(x, y) {
    for (var i = 0; i < 16; i++) {
      var a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 4;
      parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, t: 0, c: ['#ff6b81', '#ffd166', '#ff9db1'][i % 3] });
    }
    shake = 14;
    sfx('bomb');
  }

  function catchItem(it) {
    if (it.v < 0) {
      lives--; combo = 0; boom(it.x, it.y);
      addFloat(it.x, it.y, '-1 ❤️', '#ff6b81');
    } else {
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      var mult = Math.min(5, 1 + Math.floor(combo / 5));
      var gain = it.v * mult;
      score += gain;
      addFloat(it.x, it.y - 8, '+' + gain + (mult > 1 ? ' ×' + mult : ''), '#38f0d0');
      sfx('catch');
      var nl = 1 + Math.floor(score / 150);
      if (nl > level) { level = nl; addFloat(W / 2, H / 2 - 40, '🎉 进入第 ' + level + ' 关', '#ffd166'); sfx('level'); }
    }
    updateHud();
  }
  function missItem(it) {
    if (it.v < 0) return; // 炸弹漏接无惩罚
    lives--; combo = 0;
    addFloat(it.x, H - 30, '漏接 -1 ❤️', '#ff6b81');
    sfx('miss');
    updateHud();
  }

  function spawn() {
    var it = pickItem();
    items.push({ x: 26 + Math.random() * (W - 52), y: -26, r: 20, e: it.e, v: it.v });
  }

  // ---------- 主循环 ----------
  var last = 0;
  function frame(ts) {
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var dt = Math.min(50, ts - last); last = ts;

    if (state === 'playing') {
      var fallSpeed = 0.11 + level * 0.02; // 每帧速度(逻辑单位/ms 近似)
      if (autoSpawn) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawn();
          spawnTimer = Math.max(260, 950 - level * 60) * (0.7 + Math.random() * 0.6);
        }
      }
      // 更新下落
      for (var i = items.length - 1; i >= 0; i--) {
        var it = items[i];
        it.y += fallSpeed * dt;
        var bx = basket.x, bw = basket.w;
        if (it.y + it.r >= basket.y - 10 && it.y - it.r <= basket.y + 24 && it.x > bx - bw / 2 - 6 && it.x < bx + bw / 2 + 6) {
          catchItem(it); items.splice(i, 1); continue;
        }
        if (it.y - it.r > H + 20) { missItem(it); items.splice(i, 1); }
      }
      if (lives <= 0) { lives = 0; updateHud(); gameOver(); }
    }

    // 浮动文字 / 粒子
    for (var j = floats.length - 1; j >= 0; j--) { var f = floats[j]; f.t += dt; f.y -= 0.05 * dt; if (f.t > 900) floats.splice(j, 1); }
    for (var k = parts.length - 1; k >= 0; k--) { var p = parts[k]; p.t += dt; p.x += p.vx * dt * 0.16; p.y += p.vy * dt * 0.16; p.vy += 0.05; if (p.t > 700) parts.splice(k, 1); }
    if (shake > 0) shake = Math.max(0, shake - dt * 0.03);

    draw();
  }

  function gameOver() {
    if (score > save.best) { save.best = score; best = score; }
    if (level > save.maxLevel) save.maxLevel = level;
    persist();
    updateHud();
    setState('over');
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // 草地
    ctx.fillStyle = '#0f1628'; ctx.fillRect(0, H - 46, W, 46);
    ctx.fillStyle = 'rgba(56,240,208,0.08)';
    for (var gx = 0; gx < W; gx += 40) { ctx.beginPath(); ctx.arc(gx + 10, H - 46, 8, Math.PI, 0); ctx.fill(); }

    // 物品
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      ctx.save();
      ctx.font = '34px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.e, it.x, it.y);
      ctx.restore();
    }

    // 托盘
    var bx = basket.x, by = basket.y, bw = basket.w;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.strokeStyle = 'rgba(56,240,208,0.55)'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(bx - bw / 2, by); ctx.lineTo(bx - bw / 2 + 12, by - 16);
    ctx.lineTo(bx + bw / 2 - 12, by - 16); ctx.lineTo(bx + bw / 2, by);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🧺', bx, by - 8);

    // 浮动文字
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (var j = 0; j < floats.length; j++) {
      var f = floats[j];
      ctx.globalAlpha = Math.max(0, 1 - f.t / 900);
      ctx.font = 'bold 20px "Segoe UI", sans-serif';
      ctx.fillStyle = f.color;
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    // 粒子
    for (var k = 0; k < parts.length; k++) {
      var p = parts[k];
      ctx.globalAlpha = Math.max(0, 1 - p.t / 700);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 连击提示
    if (state === 'playing' && combo >= 3) {
      ctx.font = 'bold 16px "Segoe UI", sans-serif';
      ctx.fillStyle = 'rgba(255,209,102,0.9)';
      ctx.fillText('🔥 连击 ×' + combo, W / 2, 34);
    }
    ctx.restore();
  }

  // ---------- 音效 ----------
  var sfxCtx = null;
  function sfx(kind) {
    try {
      if (!sfxCtx) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) sfxCtx = new AC(); }
      if (!sfxCtx || sfxCtx.state === 'suspended') return;
      var t0 = sfxCtx.currentTime;
      function tone(f, dur, type, vol, when) {
        var o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0 + when);
        g.gain.linearRampToValueAtTime(vol, t0 + when + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + when + dur);
        o.connect(g); g.connect(sfxCtx.destination);
        o.start(t0 + when); o.stop(t0 + when + dur + 0.02);
      }
      if (kind === 'catch') { tone(660, 0.09, 'triangle', 0.15, 0); tone(880, 0.1, 'triangle', 0.12, 0.05); }
      else if (kind === 'bomb') { tone(160, 0.3, 'sawtooth', 0.2, 0); tone(80, 0.35, 'square', 0.15, 0.03); }
      else if (kind === 'miss') { tone(300, 0.15, 'sine', 0.15, 0); }
      else if (kind === 'level') { tone(523, 0.1, 'triangle', 0.15, 0); tone(659, 0.1, 'triangle', 0.15, 0.08); tone(784, 0.16, 'triangle', 0.15, 0.16); }
    } catch (e) {}
  }

  // ---------- 背景音乐 (自动播放 + 首次触摸兜底) ----------
  var BGM_KEY = 'bgm.muted.v1';
  var on = true;
  try { on = localStorage.getItem(BGM_KEY) !== '1'; } catch (e) {}
  var audio = null, timer = null, bIdx = 0;
  var MELODY = [523.25, 659.25, 783.99, 659.25, 880.00, 783.99, 659.25, 587.33, 523.25, 659.25, 783.99, 880.00, 783.99, 659.25, 587.33, 0];
  var BASS = [130.81, 130.81, 196.00, 196.00, 220.00, 220.00, 174.61, 174.61, 130.81, 130.81, 196.00, 196.00, 220.00, 174.61, 196.00, 0];
  function ensure() {
    try {
      if (!audio) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
      if (audio && audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); }
    } catch (e) {}
  }
  function play(f, t, dur, type, vol) {
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch (e) {}
  }
  function start() {
    ensure();
    if (!audio || timer || !on) return;
    var step = 60 / 120 / 2;
    var next = audio.currentTime + 0.1;
    timer = setInterval(function () {
      if (audio.state === 'suspended') return;
      var now = audio.currentTime;
      while (next < now + 0.4) {
        var m = MELODY[bIdx % MELODY.length], b = BASS[bIdx % BASS.length];
        if (m > 0) play(m, next, step * 0.9, 'triangle', 0.2);
        if (b > 0) play(b, next, step * 1.8, 'sine', 0.15);
        bIdx++; next += step;
      }
    }, 120);
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  function setBtn() { var b = document.getElementById('bgm-btn'); if (b) b.textContent = on ? '🎵' : '🔇'; }
  function toggle() {
    ensure();
    if (on && !(timer && audio && audio.state === 'running')) {
      if (audio && audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); }
      start(); setBtn(); return;
    }
    on = !on;
    try { localStorage.setItem(BGM_KEY, on ? '0' : '1'); } catch (e) {}
    if (on) start(); else stop();
    setBtn();
  }
  document.getElementById('bgm-btn').addEventListener('click', toggle);
  function tryStart() { ensure(); if (audio && on) { if (audio.state === 'suspended') { var p = audio.resume(); if (p && p.catch) p.catch(function(){}); } if (!timer) start(); } }
  function first(e) { if (e && e.target && e.target.closest && e.target.closest('#bgm-btn')) return; tryStart(); }
  document.addEventListener('pointerdown', first, { once: true });
  document.addEventListener('touchstart', first, { once: true });
  document.addEventListener('keydown', first, { once: true });
  tryStart();

  // ---------- 控制 ----------
  function pointerToX(clientX) {
    var r = canvas.getBoundingClientRect();
    var scale = W / r.width;
    return (clientX - r.left) * scale;
  }
  function moveTo(x) {
    basket.x = Math.max(basket.w / 2 + 6, Math.min(W - basket.w / 2 - 6, x));
  }
  canvas.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
    moveTo(pointerToX(ev.clientX));
  });
  canvas.addEventListener('pointermove', function (ev) {
    if (ev.buttons > 0) moveTo(pointerToX(ev.clientX));
  });
  // 鼠标拖拽(兼容)
  canvas.addEventListener('mousemove', function (ev) { if (ev.buttons > 0) moveTo(pointerToX(ev.clientX)); });

  var keys = {};
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'ArrowLeft' || ev.key === 'a' || ev.key === 'A') keys.left = true;
    else if (ev.key === 'ArrowRight' || ev.key === 'd' || ev.key === 'D') keys.right = true;
    else if (ev.key === ' ' || ev.key === 'Spacebar') {
      ev.preventDefault();
      if (state === 'playing') setState('paused');
      else if (state === 'paused') setState('playing');
    }
  });
  document.addEventListener('keyup', function (ev) {
    if (ev.key === 'ArrowLeft' || ev.key === 'a' || ev.key === 'A') keys.left = false;
    else if (ev.key === 'ArrowRight' || ev.key === 'd' || ev.key === 'D') keys.right = false;
  });
  // 键盘移动融入主循环
  var origFrame = frame;
  frame = function (ts) {
    if (state === 'playing') {
      if (keys.left) moveTo(basket.x - 7);
      if (keys.right) moveTo(basket.x + 7);
    }
    origFrame(ts);
  };

  startBtn.addEventListener('click', function () {
    if (state === 'over' || state === 'menu') newGame();
    else if (state === 'paused') setState('playing');
    else newGame();
  });

  // 离开页面自动暂停
  document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'playing') setState('paused'); });

  // ---------- 启动 ----------
  bestEl.textContent = save.best;
  updateHud();
  requestAnimationFrame(frame);
  // 调试/测试钩子
  window.__catchpig = {
    getState: function () { return { state: state, score: score, lives: lives, level: level, combo: combo, itemCount: items.length }; },
    start: function () { newGame(); },
    move: function (x) { moveTo(x); },
    setAutoSpawn: function (v) { autoSpawn = v; },
    spawn: function (kind, x) {
      var it = null;
      for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].e === kind) it = ITEMS[i];
      if (!it) it = ITEMS[0];
      items.push({ x: typeof x === 'number' ? x : W / 2, y: 30, r: 20, e: it.e, v: it.v });
    }
  };
})();
</script>
</body>
</html>
