<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05060c" />
<title>拳皇风格 · 格斗之王 97 致敬版 | ARCADE FIGHTER 97</title>
<link rel="icon" href="./favicon.svg" />
<style>
  :root{ --lw:100vw; --lh:100vh; --vh:100vh; --ink:#eaeaff; --dim:#8f96bb; --gold:#ffd35e; --red:#ff4b3a; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#04050a}
  body{display:flex;align-items:center;justify-content:center;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
       color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
  #stage{position:relative;line-height:0;box-shadow:0 0 0 2px #14182a,0 24px 70px rgba(0,0,0,.8)}
  #cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#05060c}
  /* ---------- 强制横屏（与站内泰拉瑞亚/魂斗罗同一套方案） ---------- */
  html.rotmode{overflow:hidden;background:#04050a;height:var(--lh)}
  html.rotmode body{position:fixed;left:0;top:0;width:var(--lw);height:var(--lh);overflow:hidden;transform-origin:0 0}
  html.rotmode.rotA body{transform:translateY(var(--lw)) rotate(-90deg)}
  html.rotmode.rotB body{transform:translateX(var(--lh)) rotate(90deg)}
  #rotflip{position:absolute;left:50%;top:4px;transform:translateX(-50%);z-index:320;display:none;
    font:700 11px/1 "Segoe UI",system-ui,sans-serif;color:#fff;background:rgba(20,26,40,.9);
    border:2px solid rgba(150,175,225,.6);border-radius:4px;padding:7px 11px;letter-spacing:1px;cursor:pointer}
  html.rotmode #rotflip{display:block}
  #rotate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(900px 620px at 50% 34%,#1a1230 0%,#04050a 72%);text-align:center;padding:22px;z-index:300;line-height:1.5}
  #rotate .ph{width:58px;height:100px;border:4px solid #7a6ea8;border-radius:12px;position:relative;animation:rotshake 2.4s ease-in-out infinite}
  #rotate .ph:after{content:"";position:absolute;left:50%;top:7px;width:22px;height:4px;margin-left:-11px;border-radius:2px;background:#7a6ea8}
  @keyframes rotshake{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
  #rotate .rt{font-size:19px;font-weight:800;letter-spacing:5px;color:var(--gold);text-shadow:2px 2px 0 #6a1a10}
  #rotatetip{font-size:12px;color:#a6abd0;letter-spacing:1px;line-height:1.7}
  #rotdiag{font-size:11px;color:#7d84a8;line-height:1.7}
  #rotate button{font:700 13px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:2px;color:#fff;cursor:pointer;padding:10px 16px;
    background:linear-gradient(180deg,#3a4460,#232a3c);border:2px solid #6d7ba0;border-bottom-width:4px;border-radius:4px}
  #rotate button.pri{background:linear-gradient(180deg,#e0522c,#8e2412);border-color:#ffb07a}
  /* ---------- 触屏手柄 ---------- */
  #touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:12;touch-action:none}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;
      font:800 12px/1 "Segoe UI",system-ui,sans-serif;color:#f2f5ff;text-shadow:0 1px 2px rgba(0,0,0,.9);
      background:rgba(14,18,32,.30);border:2px solid rgba(170,190,240,.42);border-radius:50%;touch-action:none}
  .tb:active,.tb.dn{background:rgba(96,140,220,.55);border-color:#e6eeff}
  #dpad{position:absolute;left:calc(2% + env(safe-area-inset-left,0px));bottom:calc(4% + env(safe-area-inset-bottom,0px));width:24%;padding-top:24%}
  #dpad .tb{width:33%;height:33%;border-radius:10%;font-size:14px}
  #dpad .u{left:33.5%;top:0}  #dpad .d{left:33.5%;bottom:0}
  #dpad .l{left:0;top:33.5%}  #dpad .r{right:0;top:33.5%}
  #dpad .c{left:33.5%;top:33.5%;background:rgba(14,18,32,.16);border-style:dashed}
  #btnA{right:calc(19% + env(safe-area-inset-right,0px));bottom:calc(24% + env(safe-area-inset-bottom,0px));width:11%;padding-top:11%}
  #btnB{right:calc(7% + env(safe-area-inset-right,0px));bottom:calc(24% + env(safe-area-inset-bottom,0px));width:11%;padding-top:11%}
  #btnC{right:calc(19% + env(safe-area-inset-right,0px));bottom:calc(6% + env(safe-area-inset-bottom,0px));width:11%;padding-top:11%}
  #btnD{right:calc(7% + env(safe-area-inset-right,0px));bottom:calc(6% + env(safe-area-inset-bottom,0px));width:11%;padding-top:11%}
  #btnAB{right:calc(31% + env(safe-area-inset-right,0px));bottom:calc(7% + env(safe-area-inset-bottom,0px));width:8%;padding-top:8%;font-size:10px}
  #btnBC{right:calc(31% + env(safe-area-inset-right,0px));bottom:calc(20% + env(safe-area-inset-bottom,0px));width:8%;padding-top:8%;font-size:10px}
  #btnMenu{right:calc(2% + env(safe-area-inset-right,0px));top:calc(2.5% + env(safe-area-inset-top,0px));width:6%;padding-top:6%;font-size:11px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="640" height="360"></canvas>
  <div id="touch">
    <div id="dpad">
      <div class="tb u" data-k="up">&#9650;</div>
      <div class="tb d" data-k="down">&#9660;</div>
      <div class="tb l" data-k="left">&#9664;</div>
      <div class="tb r" data-k="right">&#9654;</div>
      <div class="tb c" style="pointer-events:none"></div>
    </div>
    <div class="tb" id="btnA" data-k="A">A</div>
    <div class="tb" id="btnB" data-k="B">B</div>
    <div class="tb" id="btnC" data-k="C">C</div>
    <div class="tb" id="btnD" data-k="D">D</div>
    <div class="tb" id="btnAB" data-k="AB">AB</div>
    <div class="tb" id="btnBC" data-k="BC">BC</div>
    <div class="tb" id="btnMenu" data-k="menu">&#8214;</div>
  </div>
  <div id="rotate">
    <div class="ph"></div>
    <div class="rt">请 横 屏 游 玩</div>
    <div id="rotatetip">本游戏为横屏街机格斗：点下面的按钮进入全屏横屏。<br>如果手机仍然竖着，请手动旋转设备。</div>
    <button class="pri" id="btn-rotate">进入全屏横屏</button>
    <button id="btn-forcerot">强制横屏显示（画面自动旋转 90&deg;）</button>
    <button id="btn-force">已经是横屏 &middot; 直接继续</button>
    <div id="rotdiag"></div>
  </div>
</div>
<button id="rotflip">&#10227; 换个方向</button>
<script>
"use strict";
(function(){
/* ============================================================================
   格斗之王 97 致敬版  ARCADE FIGHTER 97
   —— 单文件 / 零依赖 / 全程序化像素美术与合成音频
   所有角色、招式、场景、音乐均为原创，采用 90 年代街机格斗的玩法体系。
   ============================================================================ */
var VW = 640, VH = 360;
var GROUND = 296;              /* 地面（角色脚底）y */
var WORLD_W = 900;             /* 舞台世界宽度 */
var FPS = 60;
var cv = document.getElementById("cv");
var ctx = cv.getContext("2d", { alpha:false });
ctx.imageSmoothingEnabled = false;

function $(id){ return document.getElementById(id); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function sgn(v){ return v<0?-1:(v>0?1:0); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function irnd(a,b){ return Math.floor(a+Math.random()*(b-a+1)); }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function pad2(n){ return (n<10?"0":"")+n; }
function aabb(a,b){ return a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h; }
function approach(v,t,s){ return v<t?Math.min(v+s,t):Math.max(v-s,t); }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

/* ============================================================================
   音频：合成 BGM（多轨循环）+ 打击音效 + 播报
   ============================================================================ */
var SND = (function(){
  var AC=null, master=null, bgmBus=null, sfxBus=null, muted=false, bgmOn=false, timer=null, step=0, track=0, bgmVol=0.5;
  function ensure(){
    if (AC) return AC;
    try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    master = AC.createGain(); master.gain.value = 0.95; master.connect(AC.destination);
    sfxBus = AC.createGain(); sfxBus.gain.value = 0.62; sfxBus.connect(master);
    bgmBus = AC.createGain(); bgmBus.gain.value = bgmVol; bgmBus.connect(master);
    return AC;
  }
  function resume(){ var a=ensure(); if (a && a.state==="suspended"){ try{ a.resume(); }catch(e){} } }
  function tone(freq,dur,type,vol,slide,delay,detune){
    var a=ensure(); if(!a||muted) return;
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(freq,t0);
    if (detune) o.detune.setValueAtTime(detune,t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide), t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol==null?0.25:vol, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
    o.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0+dur+0.03);
  }
  function noise(dur,vol,type,freq,delay){
    var a=ensure(); if(!a||muted) return;
    var len=Math.max(1,Math.floor(a.sampleRate*dur));
    var buf=a.createBuffer(1,len,a.sampleRate), d=buf.getChannelData(0);
    for (var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6); }
    var src=a.createBufferSource(); src.buffer=buf;
    var f=a.createBiquadFilter(); f.type=type||"lowpass"; f.frequency.value=freq||1400;
    var g=a.createGain(); g.gain.value=vol==null?0.35:vol;
    g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+dur);
    src.connect(f); f.connect(g); g.connect(sfxBus); src.start(a.currentTime+(delay||0));
  }
  /* --- 播报员：用共振峰式音块拼出 "ROUND 1 / FIGHT / K.O. / WINNER" 的语气 --- */
  function syllable(f0,f1,dur,vol,delay,type){
    var a=ensure(); if(!a||muted) return;
    var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
    o.type=type||"sawtooth"; f.type="bandpass"; f.Q.value=4.2;
    o.frequency.setValueAtTime(f0,t0); o.frequency.linearRampToValueAtTime(f1,t0+dur);
    f.frequency.setValueAtTime(760,t0); f.frequency.linearRampToValueAtTime(1180,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(f); f.connect(g); g.connect(sfxBus); o.start(t0); o.stop(t0+dur+0.02);
    var o2=a.createOscillator(), g2=a.createGain();
    o2.type="square"; o2.frequency.setValueAtTime(f0*0.5,t0);
    g2.gain.setValueAtTime(0.0001,t0); g2.gain.exponentialRampToValueAtTime(vol*0.28,t0+0.02);
    g2.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o2.connect(g2); g2.connect(sfxBus); o2.start(t0); o2.stop(t0+dur+0.02);
  }
  var SFX = {
    hitL:  function(){ noise(0.055,0.30,"bandpass",1500); tone(360,0.05,"square",0.14,180); },
    hitM:  function(){ noise(0.08,0.40,"bandpass",1100); tone(240,0.08,"square",0.20,110); },
    hitH:  function(){ noise(0.14,0.55,"lowpass",900); tone(150,0.16,"sawtooth",0.30,52); tone(90,0.2,"square",0.2,40,0.01); },
    hitS:  function(){ noise(0.22,0.60,"lowpass",700); tone(120,0.3,"sawtooth",0.34,38); },
    block: function(){ noise(0.07,0.32,"highpass",2600); tone(900,0.05,"square",0.10,600); },
    whiff: function(){ noise(0.09,0.15,"bandpass",900); },
    jump:  function(){ tone(300,0.09,"square",0.14,620); },
    land:  function(){ noise(0.07,0.22,"lowpass",700); },
    dash:  function(){ noise(0.14,0.20,"bandpass",1800); },
    fire:  function(){ noise(0.28,0.34,"bandpass",700); tone(180,0.26,"sawtooth",0.22,420); },
    ice:   function(){ tone(1500,0.2,"triangle",0.18,2600); noise(0.16,0.16,"highpass",3000); },
    bolt:  function(){ noise(0.2,0.34,"highpass",2400); tone(1800,0.14,"sawtooth",0.20,240); },
    shadow:function(){ noise(0.18,0.24,"bandpass",600); tone(900,0.14,"sine",0.14,120); },
    burn:  function(){ noise(0.4,0.30,"lowpass",1200); },
    meter: function(){ [0,70,140].forEach(function(d,i){ tone([700,900,1200][i],0.1,"square",0.16,null,d); }); },
    max:   function(){ [0,90,180,300].forEach(function(d,i){ tone([520,660,780,1040][i],0.22,"square",0.20,null,d); }); },
    superf:function(){ noise(0.5,0.4,"bandpass",600); tone(120,0.5,"sawtooth",0.24,900); },
    ko:    function(){ tone(140,0.9,"sawtooth",0.36,40); noise(0.6,0.4,"lowpass",900); },
    bell:  function(){ [0,0.16,0.32].forEach(function(d){ tone(1180,0.3,"triangle",0.22,1160,d); }); },
    ui:    function(){ tone(680,0.05,"square",0.16); },
    ok:    function(){ tone(760,0.06,"square",0.18,null,0); tone(1020,0.09,"square",0.18,null,0.06); },
    cancel:function(){ tone(1200,0.05,"square",0.14,1700); },
    throwS:function(){ noise(0.16,0.4,"lowpass",620); tone(180,0.2,"square",0.22,70); },
    crack: function(){ noise(0.24,0.5,"bandpass",3400); },
    cheer: function(){ noise(1.1,0.16,"bandpass",900); }
  };
  var VOICE = {
    round1: function(){ syllable(300,240,0.16,0.20,0.00); syllable(430,300,0.22,0.20,0.18,"square"); },
    round2: function(){ syllable(300,240,0.16,0.20,0.00); syllable(400,290,0.15,0.20,0.18,"square"); syllable(520,340,0.24,0.20,0.34,"square"); },
    round3: function(){ syllable(320,250,0.16,0.20,0.00); syllable(430,300,0.15,0.20,0.18,"square"); syllable(600,380,0.26,0.22,0.34,"square"); },
    fight:  function(){ syllable(420,700,0.14,0.26,0.00,"square"); syllable(760,300,0.26,0.26,0.14); },
    ko:     function(){ syllable(560,180,0.34,0.28,0.00,"square"); syllable(300,120,0.5,0.26,0.22,"sawtooth"); },
    winner: function(){ syllable(360,300,0.14,0.22,0.00); syllable(430,340,0.14,0.22,0.15,"square"); syllable(520,300,0.32,0.24,0.30,"square"); },
    perfect:function(){ syllable(700,760,0.12,0.22,0.00,"square"); syllable(760,700,0.12,0.22,0.14,"square"); syllable(900,560,0.36,0.24,0.28,"square"); },
    continue_:function(){ syllable(500,420,0.2,0.22,0.00,"square"); syllable(420,300,0.34,0.22,0.22,"square"); },
    select: function(){ syllable(620,760,0.09,0.18,0.00,"square"); },
    final:  function(){ syllable(280,220,0.3,0.24,0.00,"sawtooth"); syllable(420,320,0.4,0.24,0.32,"square"); }
  };
  /* ---- BGM：四首循环曲目（贝斯 + 主旋 + 鼓） ---- */
  var TRACKS = [
    { bpm:150, bass:[0,0,7,0, 5,5,0,0, 3,3,10,10, 12,12,7,7],
      lead:[12,15,19,15, 17,15,12,10, 12,15,19,22, 19,15,12,12],
      root:110.0, lead2:"square", swing:0.0 },
    { bpm:132, bass:[0,-2,3,3, 5,5,-2,-2, 0,0,3,3, 7,7,5,5],
      lead:[19,17,15,17, 12,15,17,19, 22,19,17,15, 12,12,10,12],
      root:98.0, lead2:"sawtooth" },
    { bpm:168, bass:[0,0,0,3, 5,5,5,7, 10,10,10,7, 5,5,3,3],
      lead:[24,22,19,22, 24,26,24,22, 19,22,24,26, 27,24,22,19],
      root:123.47, lead2:"square" },
    { bpm:144, bass:[0,3,7,3, -2,3,7,10, 0,3,7,3, 5,7,10,12],
      lead:[15,19,22,19, 15,19,24,22, 19,22,26,24, 22,19,15,12],
      root:87.31, lead2:"triangle" }
  ];
  function semi(root,n){ return root*Math.pow(2,n/12); }
  function bgmTick(){
    if (!bgmOn || muted) return;
    var a=ensure(); if (!a) return;
    var T=TRACKS[track%TRACKS.length], s=step++, bar=Math.floor(s/16)%4;
    var spb=60/T.bpm/2;
    var bn=T.bass[s%16]+(bar===3?5:0);
    var o=a.createOscillator(), g=a.createGain();
    o.type="triangle"; o.frequency.value=semi(T.root,bn);
    g.gain.setValueAtTime(0.0001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.30,a.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008,a.currentTime+spb*0.92);
    o.connect(g); g.connect(bgmBus); o.start(); o.stop(a.currentTime+spb);
    var ln=T.lead[s%16]+(bar===1?12:0);
    var o2=a.createOscillator(), g2=a.createGain();
    o2.type=T.lead2||"square"; o2.frequency.value=semi(T.root,ln+12);
    g2.gain.setValueAtTime(0.0001,a.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.115,a.currentTime+0.01);
    g2.gain.exponentialRampToValueAtTime(0.0006,a.currentTime+spb*0.72);
    o2.connect(g2); g2.connect(bgmBus); o2.start(); o2.stop(a.currentTime+spb);
    if (s%4===0){ noise(0.05,0.20,"lowpass",260); }
    if (s%8===4){ noise(0.14,0.26,"highpass",2200); }
    if (s%2===1){ noise(0.03,0.07,"highpass",6000); }
    if (bar===3 && s%16===15){ noise(0.3,0.22,"lowpass",1400); }
  }
  return {
    resume: resume,
    sfx: function(n){ var f=SFX[n]; if (!f || muted) return; var a=ensure(); if(!a) return; try{ f(); }catch(e){} },
    voice: function(n){ var f=VOICE[n]; if (!f || muted) return; var a=ensure(); if(!a) return; try{ f(); }catch(e){} },
    startBgm: function(t){ if (t!=null) track=t; ensure();
      if (timer) clearInterval(timer); bgmOn=true; step=0;
      timer=setInterval(bgmTick, Math.round(60000/TRACKS[track%TRACKS.length].bpm/2));
      bgmTick(); },
    stopBgm: function(){ bgmOn=false; if (timer){ clearInterval(timer); timer=null; } },
    playing: function(){ return bgmOn; },
    isMuted: function(){ return muted; },
    setMuted: function(m){ muted=!!m; if (master) master.gain.value = muted?0:0.95; },
    setBgmVol: function(v){ bgmVol=clamp(v,0,1); if (bgmBus) bgmBus.gain.value=bgmVol; },
    bgmVol: function(){ return bgmVol; },
    track: function(){ return track; }
  };
})();

/* ============================================================================
   屏幕自适应 + 强制横屏（与站内其他游戏一致的手机端方案）
   ============================================================================ */
var ROT = { on:false, dir:1 };
try { var _rd = parseInt(localStorage.getItem("kof.rotDir")||"",10); if (_rd===1||_rd===-1) ROT.dir=_rd; } catch(e){}
var isTouch=false, landscapeWanted=false, forceLandscape=false, lastOrientFlip=null, portraitSince=null;
var SCALE = 1;
function logicalSize(){
  var iw=Math.max(1,Math.round(window.innerWidth||1)), ih=Math.max(1,Math.round(window.innerHeight||1));
  if (ROT.on) return { w:ih, h:iw };
  return { w:iw, h:ih };
}
function applyRot(){
  var el=document.documentElement;
  el.classList.toggle("rotmode", ROT.on);
  el.classList.toggle("rotA", ROT.on && ROT.dir>0);
  el.classList.toggle("rotB", ROT.on && ROT.dir<0);
}
function setRot(on,dir){
  if (on && dir!=null) ROT.dir = dir>0?1:-1;
  var was=ROT.on; ROT.on=!!on; applyRot(); resizeCanvas();
  if (was!==ROT.on && typeof scheduleOrientation==="function") scheduleOrientation();
}
function resizeCanvas(){
  var L=logicalSize(), w=L.w, h=L.h;
  var st=document.documentElement.style;
  st.setProperty("--vh",h+"px"); st.setProperty("--lw",w+"px"); st.setProperty("--lh",h+"px");
  var s=Math.min(w/VW,h/VH);
  if (isTouch) s=Math.max(0.2,s);

}

/* 世界坐标绘制角色（含朝向镜像、阴影、状态染色） */
function drawFighter(g, f){
  var ch=f.ch, pose;
  if (f.st==="down"||f.st==="ko") pose=poseAt("down",0.6,0);
  else if (f.st==="hitstun") pose=poseAt("hit",clamp(f.stun/10,0,1),0);
  else if (f.st==="blockstun") pose=poseAt(f.crouching?"blockC":"blockS",0,0);
  else if (f.st==="attack"&&f.move) pose=poseAt(f.move.anim||"punchL", f.animT, 0);
  else if (f.st==="throwHold") pose=poseAt("grab",0.6,0);
  else if (f.st==="win") pose=poseAt("win",(FRAME%90)/90,0);
  else if (f.st==="intro") pose=poseAt("intro",clamp(f.stT/22,0,1),0);
  else if (!f.grounded) pose=poseAt("jump", clamp((GROUND-f.y)/70,0,1),0);
  else if (f.crouching) pose=poseAt("crouch",0.5,0);
  else if (f.blocking) pose=poseAt("blockS",0,0);
  else if (Math.abs(f.vx)>2.6) pose=poseAt("run",(FRAME%16)/16,0);
  else if (Math.abs(f.vx)>0.2) pose=poseAt(f.face*vxSign(f.vx)>0?"walkF":"walkB",(FRAME%18)/18,0);
  else pose=poseAt("idle",(FRAME%72)/72,0);
  var animName = f.st==="attack"&&f.move ? (f.move.anim||"punchL") : null;
  var spr;
  if (animName){ spr=spriteFrame(ch,animName, f.animT); }
  else {
    /* 非攻击状态用姿态直接烘焙（走/跳/受击等） */
    var key=ch.id+"|P"+poseKey(pose);
    spr=SPR[key];
    if (!spr){ spr=bake(SPW,SPH,function(g2c){ drawFighterSprite(g2c,ch,pose); }); SPR[key]=spr; }
  }
  var x=Math.round(f.x), y=Math.round(f.y);
  var sc=f.scale||1;
  g.save();
  g.translate(x,y);
  if (sc!==1) g.scale(sc,sc);
  if (f.face<0){ g.scale(-1,1); }
  g.drawImage(spr,-SOX,-SOY);
  /* 受击闪白 */
  if (f.flash>0){
    g.globalCompositeOperation="lighter";
    g.globalAlpha=clamp(f.flash/4,0,1)*0.75;
    g.drawImage(spr,-SOX,-SOY);
    g.globalAlpha=1; g.globalCompositeOperation="source-over";
  }
  /* 气力 MAX 光环 */
  if (f.maxT>0){
    g.globalCompositeOperation="lighter";
    g.globalAlpha=0.30+0.14*Math.sin(FRAME*0.35);
    g.fillStyle=ch.col.aura;
    g.beginPath(); g.ellipse(0,-b_h(ch)/2, 26, b_h(ch)*0.66, 0, 0, 6.283); g.fill();
    g.globalAlpha=1; g.globalCompositeOperation="source-over";
  }
  g.restore();
}

  var s="", a=["hip","neck","head","lsh","lel","lha","rsh","rel","rha","lhip","lkn","lft","rhip","rkn","rft"];
  for (var i=0;i<a.length;i++){ var q=p[a[i]]; if (q) s+=Math.round(q[0])+","+Math.round(q[1])+";"; }

}

function applyHit(att, def, mv, opts){

  def.st="hitstun"; def.stT=0;
  def.crouching = def.crouching && mv.guard!=="over";

  if (mv.knockdown){ def.knockbackDown=true; if (def.grounded){ def.vy=-4.6; def.vx=att.face*kbx*0.8; def.grounded=false; } }

  popText(def.x, def.y-def.ch.build.h*0.92, (Math.round(dmg*10)/10)+"", mv.dmg>=12?"#ff8a4a":"#ffe08a", mv.dmg>=12?13:11);

/* ============================================================================
   输入解析 → 招式发动（超必 > 必杀 > 指令技 > 通常技，含取消与连打）
   ============================================================================ */
function humanCtrl(f){
  var ip=IN[f.side];
  var backD=relDir(ip.dir,f.face);
  return { ip:ip, raw:ip.dir, dir:backD, pressed:ip.pressed, held:ip.held,
    back:(backD===4||backD===1||backD===7), start:!!(ip.pressed&0x1000),
    blocksBack:function(){ return this.back; } };
}
function btnOf(mask){ if (mask&BTN.A) return "A"; if (mask&BTN.B) return "B"; if (mask&BTN.C) return "C"; if (mask&BTN.D) return "D"; return null; }
function canCancel(f, cls){
  if (f.st!=="attack"||!f.move) return false;
  if (!f.moveHit) return false;
  if (f.move.cls==="super") return false;
  var c=f.move.cancel;
  if (!c) return false;
  for (var i=0;i<c.length;i++) if (c[i]===cls) return true;
  return false;
}
function tryAction(f, key, heavy, force){
  var mv=movesOf(f.ch)[key]; if (!mv) return false;
  var free=f.canAct();
  var cancelled = canCancel(f, mv.cls);
  if (!free && !cancelled && !force) return false;
  if (mv.cls==="super" && f.meter<mv.cost) return false;
  if (mv.cls==="special" && f.st==="attack" && f.move && f.move.cls==="special" && !force) return false;
  if (cancelled && f.move){ SND.sfx("cancel"); popText(f.x, f.y-84, "CANCEL!", "#7cf0ff", 11); }
  f.hitConnected=false;
  return f.startMove(key, heavy);
}
function resolveInput(f, opp){
  var c=f.ctrl; if (!c) return;
  var ip=c.ip;
  if (!f.canAct() && !(f.st==="attack"&&f.moveHit)) {
    /* 空中可以出必杀 */
    if (!f.grounded && (f.st==="jump"||f.st==="jumpF"||f.st==="jumpB"||f.st==="fall")){
      if (ip && (ip.pressed&(BTN.A|BTN.C)) && ip.matchSeq([2,3,6], f.face, 22, 9)){ tryAction(f,"sp1",!!(ip.pressed&BTN.C),true); return; }
    }
    return;
  }
  if (ip && ip.pressed){
    /* 爆气：A+B+C */
    if (ip.combo(BTN.A|BTN.B|BTN.C,3) && f.meter>=1 && f.maxT<=0 && f.grounded){
      f.meter-=1; f.maxT=480; SND.sfx("max"); SND.voice("final");
      popText(f.x,f.y-92,"MAX!","#ffd25a",16); ring(f.x,f.y-40,f.ch.col.aura,6,64,20);
      for (var z=0;z<20;z++) fx(f.x+rnd(-14,14),f.y-rnd(6,70),f.ch.style==="zoner"?"ice":"fire",2,1.2);
      return;
    }
    /* 紧急回避 A+B */
    if (ip.combo(BTN.A|BTN.B,3) && f.grounded){ if (tryAction(f,"AB",false)) { SND.sfx("dash"); f.vx=-f.face*4.6; } return; }
    /* 吹飞攻击 B+C */
    if (ip.combo(BTN.B|BTN.C,3) && f.grounded){ if (tryAction(f,"BC",false)) return; }
    var pressed=ip.pressed, btn=btnOf(pressed);
    if (btn){
      var heavy = (btn==="C"||btn==="D");
      /* 超必杀（236236 / 蓄力超必） */
      var mk=movesOf(f.ch), kk;
      if (ip.matchSeq([2,3,6,2,3,6], f.face, 40, 12)){
        for (kk in mk){ if (mk[kk].cls==="super" && mk[kk].cost<=f.meter && f.meter>=mk[kk].cost){ if (tryAction(f,kk,heavy)) { return; } } }
      }
      /* 必杀技 */
      for (kk in mk){
        var mv=mk[kk]; if (mv.cls!=="special") continue;
        if (mv.air && f.grounded) continue;
        if (!mv.air && !f.grounded) continue;
        var ok=false;
        if (mv.input==="236") ok=ip.matchSeq([2,3,6], f.face, 22, 9);
        else if (mv.input==="214") ok=ip.matchSeq([2,1,4], f.face, 22, 9);
        else if (mv.input==="623") ok=ip.matchSeq([6,2,3], f.face, 24, 9);
        else if (mv.input==="63214") ok=ip.matchSeq([6,3,2,1,4], f.face, 34, 10);
        else if (mv.input==="41236") ok=ip.matchSeq([4,1,2,3,6], f.face, 34, 10);
        else if (mv.input==="46") ok=(ip.chargeOK(4,f.face,40) && (c.raw===6||c.raw===3));
        else if (mv.input==="28") ok=(ip.chargeOK(2,f.face,40) && (c.raw===8||c.raw===9));
        if (!ok && mv.input==="623" && ip.matchSeq([6,2,3], f.face, 30, 12)) ok=true;
        if (ok && mv.btns && mv.btns.indexOf(btn)>=0){
          if (tryAction(f,kk,heavy && mv.btns.length>1)) return;
        }
      }
      /* 指令技 */
      if (c.dir===6 && btn==="B" && f.grounded){ if (tryAction(f,"6B",false)) return; }
      if (c.dir===6 && btn==="A" && f.grounded){ if (tryAction(f,"6A",false)) return; }
      /* 投技（近身 4/6 + C） */
      if (f.grounded && btn==="C" && (c.dir===4||c.dir===6) && Math.abs(opp.x-f.x)<52 && opp.grounded && opp.st!=="down"){
        if (tryAction(f,"THR",false)) return;
      }
      /* 通常技 */
      var key2;
      if (!f.grounded) key2 = btn==="A"?"jA":(btn==="B"?"jB":(btn==="C"?"jC":"jD"));
      else if (f.crouching) key2 = btn==="A"?"2A":(btn==="B"?"2B":(btn==="C"?"2C":"2D"));
      else {
        var close = Math.abs(opp.x-f.x)<58;
        if (btn==="A") key2= "5A"; else if (btn==="B") key2="5B";
        else if (btn==="C") key2= close?"5Cc":"5C"; else key2= close?"5Dc":"5D";
      }
      if (tryAction(f, key2, heavy)) return;
    }
  }
}
/* ============================================================================
   角色逐帧更新
   ============================================================================ */
function updateFighter(f, opp){
  f.stT++;
  if (f.flash>0) f.flash--;
  if (f.invul>0) f.invul--;
  if (f.armor>0) f.armor--;
  if (f.meterLock>0) f.meterLock--;
  if (f.tapT>0){ f.tapT--; if (f.tapT===0) f.runHold=0; }
  if (f.runHold&&(f.st==="idle"||f.st==="crouch")) f.runHold=0;
  if (f.maxT>0){ f.maxT--; if (f.maxT===0) popText(f.x,f.y-90,"MAX END","#8a92b8",11); }
  if (f.comboT>0){ f.comboT--; if (f.comboT===0) f.combo=0; }
  if (f.blocking) f.guardHold++;
  if (f.st!=="attack") f.animT=0;
  /* 朝向：非攻击/受击时自动面向对手 */
  if (f.canAct()||f.st==="hitstun"||f.st==="blockstun"){
    if (f.canAct()) f.face = (opp.x>=f.x)?1:-1;
  }
  var c=f.ctrl;
  switch (f.st){
    case "intro":
      if (f.stT>60) f.setSt("idle");
      break;
    case "idle": case "walk": case "crouch": case "run": case "land": {
      var wantCrouch=false, moving=0;
      if (c){
        if (c.dir===2||c.dir===1||c.dir===3){ f.crouching=true; wantCrouch=true; }
        else f.crouching=false;
        var fwd = (c.dir===6||c.dir===9||c.dir===3)?1:((c.dir===4||c.dir===7||c.dir===1)?-1:0);
        var mvOK=(f.grounded&&!wantCrouch);
        /* 双击前冲 */
        if (mvOK&&fwd===1&&c.pressed===0&&!f.runHold){
          if (f.tapT>0&&f.tapDir===1){ f.runHold=1; SND.sfx("dash"); }
          else { f.tapT=14; f.tapDir=1; }
        }
        if (mvOK&&fwd===1&&f.runHold) moving=2;
        else if (mvOK&&fwd!==0) moving=1;
        f.vx = moving===2? f.face*f.spd*1.75 : (moving===1? f.face*f.spd*0.92*fwd : 0);
        if (moving===2&&f.st!=="run"){ setSt(f,"run"); }
        else if (moving===1&&f.st!=="walk"){ setSt(f,"walk"); }
        else if (!moving&&!wantCrouch&&f.st!=="idle"){ setSt(f,"idle"); }
        if (wantCrouch&&f.st!=="crouch") setSt(f,"crouch");
        /* 跳跃 */
        if (f.grounded&&(c.dir===7||c.dir===8||c.dir===9)&&f.jumpLock!==FRAME){
          f.vy=f.jumpV; f.grounded=false; f.jumpLock=FRAME;
          if (c.dir===7) f.vx=-f.face*f.spd*1.15; else if (c.dir===9) f.vx=f.face*f.spd*1.15;
          SND.sfx("jump"); fx(f.x,GROUND,"dust",5,0.7);
        }
        /* 防御姿态（对手在近处有攻击动作时举盾） */
        var threat = (Math.abs(opp.x-f.x)<150 && (opp.st==="attack"||opp.st==="hitstun"&&0));
        f.blocking = c.back && f.grounded && (threat || (opp.st==="attack"));
      }
      if (f.st==="land"){ if (f.stT>5) setSt(f,f.crouching?"crouch":"idle"); }
      resolveInput(f,opp);
      break; }
    case "jump": case "jumpF": case "jumpB": case "fall":
      if (f.st==="fall"&&f.grounded) f.setSt("land");
      resolveInput(f,opp);
      break;
    case "attack": {
      var mv=f.move; if (!mv){ setSt(f,"idle"); break; }
      f.moveT++; f.animT=clamp(f.moveT/Math.max(1,mv.total),0,0.999);
      if (f.hitCd>0) f.hitCd--;
      var tt=f.grounded?1:1;
      if (mv.dash){
        if (f.moveT>=mv.dash.f[0]&&f.moveT<=mv.dash.f[1]) f.vx=f.dashDir*(f.dashed?f.dashSpd*0.86:f.dashSpd);
      } else if (f.grounded) f.vx*=0.72;
      /* 弹道生成 */
      if (mv.proj && f.moveT===mv.start){ launchProj(f,mv); }
      if (mv.kind==="teleport" && f.moveT===mv.start){
        var behind = opp.x + (f.face>0?26:-26);
        f.x=clamp(behind,40,WORLD_W-40); f.face=(opp.x>=f.x)?1:-1;
        CHAFF(f); SND.sfx("shadow");
      }
      if (mv.shock && f.moveT===mv.boxF[0]){ SHAKE=Math.max(SHAKE,6); SND.sfx("hitH");
        for (var sx=-30;sx<=30;sx+=10) fx(f.x+sx,GROUND,"dust",2,1.1); }
      if (f.moveT>=mv.total || (f.airMove&&f.grounded&&f.moveT>=mv.start)){ endMove(f); }
      break; }
    case "hitstun":
      f.stun--;
      if (f.grounded) f.vx*=0.82;
      if (f.stun<=0&&f.grounded){ setSt(f,"idle"); f.juggle=0; }
      break;
    case "blockstun":
      f.stun--;
      if (f.grounded) f.vx*=0.8;
      if (f.stun<=0){ setSt(f,f.crouching?"crouch":"idle"); }
      break;
    case "down":
      f.vx*=0.86;
      if (f.stT>44){ setSt(f,"wake"); f.invul=20; }
      break;
    case "wake":
      if (f.stT>16){ setSt(f,"idle"); }
      break;
    case "ko":
      f.vx*=0.9;
      break;
    case "thrown":
      f.vx*=0.9;
      if (f.stT>50){ setDown(f); f.st="down"; }
      break;
    case "win":
      break;
  }
  moveFighter(f);
}
function setSt(f,s){ f.st=s; f.stT=0; }
function CHAFF(f){
  for (var i=0;i<12;i++) fx(f.x+rnd(-10,10), f.y-rnd(6,60), "shadow", 1, 1.1);
  AFTER.push({ f:null, x:f.x, y:f.y, t:0, life:14, col:f.ch.col.aura });
}
function launchProj(f, mv){
  var p=mv.proj;
  var hx=f.x+f.face*(mv.box?Math.abs(mv.box[0])+12:24), hy=f.y-f.ch.build.h*0.55;
  var heavy=f.move.heavy;
  spawnProj(f, p.type, hx, hy, f.face, p.spd*(heavy?1.16:0.94), p.dmg*(heavy?1.15:1), p.life, { freeze:p.freeze||0, heavy:heavy });
  SND.sfx("fire");
}
/* ============================================================================
   命中判定
   ============================================================================ */
function checkHits(){
  var a=MATCH.f[0], b=MATCH.f[1];
  if (!a||!b) return;
  checkPair(a,b); checkPair(b,a);
  for (var i=0;i<PROJ.length;i++){
    var p=PROJ[i]; if (!p||p.dead) continue;
    var t = (p.owner===a)?b:a;
    if (!t||t.invul>0||t.st==="ko"||t.st==="down"||t.st==="thrown") continue;
    if (projHit(p,t)){
      var mv={ dmg:p.dmg, hs:14, bs:10, kbx:3.0, kby:0, meter:5, chip:2, cls:"special", box:[0,0,10,10], fx:(p.type==="ice"?"ice":(p.type==="bolt"?"bolt":"fire")), knockdown:false, freeze:p.extra.freeze };
      applyHit(p.owner, t, mv, {});
      fx(p.x,p.y,"spark",10,1.2); ring(p.x,p.y,"#ffffff",3,28,12);
      p.dead=true; PROJ.splice(i,1); i--;
    }
  }
}
function checkPair(att,def){
  if (att.st!=="attack"||!att.move) return;
  if (att.hitsLeft<=0) return;
  if (att.hitCd>0) return;
  var hb=att.hitbox(); if (!hb) return;
  var tb=hurtbox(def);
  if (!aabb(hb,tb)) return;
  if (def.st==="ko"||def.st==="down") return;
  var mv=att.move;
  if (mv.throw){
    if (!def.grounded||def.invul>0||def.st==="thrown"||def.st==="hitstun") return;
    if (def.st==="attack"&&def.move&&def.move.cls==="special") return;
  }
  if (def.armor>0 && (mv.cls==="normal"||mv.cls==="cmd")){
    def.hp-=Math.max(1,Math.round(mv.dmg*0.4)); def.flash=3; HITSTOP=Math.max(HITSTOP,4);
    fx((att.x+def.x)/2, def.y-48,"spark",6,1); SND.sfx("block");
    att.moveHit=true; att.hitsLeft--;
    if (def.hp<=0) koFighter(def);
    return;
  }
  var hit=applyHit(att,def,mv,{});
  if (hit&&att.hitsLeft>0) att.hitCd=6;
}
/* 身体推挤 + 摄像机 */
function separateBodies(){
  var a=MATCH.f[0], b=MATCH.f[1]; if (!a||!b) return;
  var minD = (a.ch.style==="grappler"||b.ch.style==="grappler")?42:36;
  var dx=b.x-a.x;
  if (Math.abs(dx)<minD && a.grounded && b.grounded){
    var push=(minD-Math.abs(dx))/2 * (dx>=0?1:-1);
    a.x-=push; b.x+=push;
    a.x=clamp(a.x,26,WORLD_W-26); b.x=clamp(b.x,26,WORLD_W-26);
  }
}
function updateCamera(){
  var a=MATCH.f[0], b=MATCH.f[1];
  var mid=(a.x+b.x)/2;
  var target=clamp(mid-VW/2, 0, WORLD_W-VW);
  CAMX=lerp(CAMX, target, 0.12);
  if (CAMX<0) CAMX=0; if (CAMX>WORLD_W-VW) CAMX=WORLD_W-VW;
}

/* ============================================================================
   AI：接近 / 牵制 / 对空 / 防御 / 反击 / 连段（随难度变化）
   ============================================================================ */
function aiCtrl(f, opp){
  var ai=f.ai||{aggr:0.6,block:0.6,react:13,aa:0.5,combo:2};
  var c={ ip:null, raw:5, dir:5, pressed:0, held:0, back:false, blocksBack:function(){ return this.back; } };
  f.aiT=(f.aiT||0)-1;
  var dx=opp.x-f.x, dist=Math.abs(dx), toward=6, away=4;
  var oppAtk = opp.st==="attack" && opp.move;
  var inRange = oppAtk && dist < 90;
  var projThreat=false;
  for (var i=0;i<PROJ.length;i++){ var p=PROJ[i];
    if (p.owner===opp && Math.abs(p.x-f.x)<150 && ((p.vx>0&&p.x<f.x)||(p.vx<0&&p.x>f.x))) projThreat=true; }
  /* 防御反应 */
  if ((inRange||projThreat) && Math.random()<ai.block*0.9){
    c.back=true; c.dir=(opp.crouching&&Math.random()<0.4)?1:4;
    if (Math.random()<0.05&&f.grounded&&f.st!=="attack"){ f.vx=-f.face*4; }
    return c;
  }
  /* 起身反击 */
  if (f.st==="wake" && Math.random()<ai.aa*0.2 && dist<70){ f.aiPlan="reverse"; }
  if (f.st!=="idle"&&f.st!=="walk"&&f.st!=="crouch"&&f.st!=="run"&&f.st!=="land") return c;
  /* 连段：普通技命中后接必杀 */
  if (f.moveHit && f.st==="attack" && f.move && f.move.cls==="normal" && dist<80){
    var mk=movesOf(f.ch);
    if (Math.random()<0.5+ai.combo*0.12){
      var keys=["sp1","sp2","sp3"];
      for (var k=0;k<keys.length;k++){ var mv=mk[keys[k]];
        if (mv && !mv.air && tryAction(f,keys[k],Math.random()<0.4,true)) { f.aiT=ai.react; return c; } }
      if (f.meter>=1){ tryAction(f,"su1",false,true); f.aiT=ai.react; return c; }
    }
  }
  if (f.aiT>0){ c.dir=f.aiDir||5; return c; }
  f.aiT = Math.max(4, ai.react + irnd(-3,6));
  /* 对空 */
  if (!opp.grounded && dist<76 && Math.random()<ai.aa){
    if (tryAction(f,"sp2",Math.random()<0.4,true)) return c;
    if (tryAction(f,"2C",false,true)) return c;
    if (tryAction(f,"6A",false,true)) return c;
  }
  var r=Math.random();
  if (dist>150){
    if (r<0.30+ai.aggr*0.2){ var mk3=movesOf(f.ch); if (mk3.sp1 && tryAction(f,"sp1",Math.random()<0.5,true)) return c; }
    if (r<0.72){ f.aiDir=toward; c.dir=toward; }
    else { f.aiDir=away; c.dir=away; c.back=true; }
  } else if (dist>72){
    if (r<0.36+ai.aggr*0.24){ f.aiDir=toward; c.dir=toward; if (Math.random()<0.18) c.dir=(dx>0?9:7); }
    else if (r<0.62){ var mk4=movesOf(f.ch); var pool=["sp3","6B","5D"];
      if (tryAction(f,pick(pool),Math.random()<0.4,true)) return c; }
    else { f.aiDir=away; c.dir=away; c.back=true; }
  } else {
    if (r<ai.aggr){
      var pool2=["5A","2B","5B","2A"];
      if (Math.random()<0.42){ pool2=["5Cc","2C","5Dc","6A","THR","BC"]; }
      if (f.meter>=1 && Math.random()<0.14) pool2=["su1"];
      var nm=pick(pool2);
      if (nm==="THR" && Math.random()>0.5) nm="5Cc";
      tryAction(f,nm,Math.random()<0.25,true);
    } else if (r<ai.aggr+0.22){
      c.back=true; c.dir=(Math.random()<0.4)?1:4;
    } else {
      f.aiDir=toward; c.dir=toward;
    }
  }
  return c;
}
/* ============================================================================
   对战流程：组队战 / 回合 / 计时 / 加时 / 结算
   ============================================================================ */
var MATCH = {
  f:[null,null], team:[[],[]], cur:[0,0], round:1, timer:99*60,
  phase:"ready", phaseT:0, mode:"arcade", aiLevel:2, stage:0,
  winSide:-1, doubleKO:false, slow:0, perfect:[true,true], arcade:null, hurryPlayed:false
};
function spawnFighters(){
  MATCH.f[0]=new Fighter(MATCH.team[0][MATCH.cur[0]], 0);
  MATCH.f[1]=new Fighter(MATCH.team[1][MATCH.cur[1]], 1);
  var a=MATCH.f[0], b=MATCH.f[1];
  a.x=MATCH.cur[0]===0?250:220; a.x = 210+Math.random()*40;
  b.x = 430+Math.random()*40;
  a.face=1; b.face=-1;
  a.perfect=true; b.perfect=true;
  a.input=a.ctrl={ blocksBack:function(){ return this.back; }, back:false, dir:5, pressed:0 };
  b.input=b.ctrl={ blocksBack:function(){ return this.back; }, back:false, dir:5, pressed:0 };
  a.ai=(sideAI(0)?makeAI(MATCH.aiLevel):null);
  b.ai=(sideAI(1)?makeAI(MATCH.aiLevel):null);
  if (MATCH.mode==="training"){
    b.ai=null; b.dummyMode="stand"; b.ai={ aggr:0.0, block:0.0, react:99, aa:0, combo:0, level:0 };
    if (GAME.train.dummy==="cpu") b.ai=makeAI(2);
  }
  CAMX=clamp((a.x+b.x)/2-VW/2,0,WORLD_W-VW);
}
function sideAI(side){
  if (MATCH.mode==="vs") return false;
  if (MATCH.mode==="cpu") return side===1;
  if (MATCH.mode==="arcade") return side===1;
  if (MATCH.mode==="training") return false;
  return false;
}
function makeAI(level){
  var L=clamp(level,1,3);
  return { level:L, aggr:[0.5,0.68,0.86][L-1], block:[0.42,0.64,0.82][L-1],
           react:[18,13,9][L-1], aa:[0.3,0.55,0.76][L-1], combo:[1,2,3][L-1] };
}
function newMatch(o){
  MATCH.mode=o.mode||"arcade";
  MATCH.team=[o.teams[0].slice(0), o.teams[1].slice(0)];
  MATCH.aiLevel=o.aiLevel||2;
  MATCH.cur=[0,0]; MATCH.round=1; MATCH.timer=99*60; MATCH.phase="ready"; MATCH.phaseT=0;
  MATCH.winSide=-1; MATCH.doubleKO=false; MATCH.slow=0; MATCH.hurryPlayed=false;
  MATCH.stage=o.stage!=null?o.stage:(o.mode==="arcade"&&o.stage==null?0:0);
  MATCH.arcade=o.arcade||null;

  spawnFighters();
  PROJ.length=0; FX.length=0; AFTER.length=0;
  GAME.state="fight";

  say("ROUND "+MATCH.round); SND.voice(MATCH.round===1?"round1":(MATCH.round===2?"round2":"round3"));
}
function say(txt,sub){
  GAME.banner={ txt:txt, sub:sub||"", t:100 };
}
function stepFight(){
  var a=MATCH.f[0], b=MATCH.f[1];
  if (!a||!b) return;
  MATCH.phaseT++;
  if (GAME.banner&&GAME.banner.t>0) GAME.banner.t--;
  if (MATCH.phase==="ready"){
    a.ctrl={ blocksBack:function(){ return this.back; }, back:false, dir:5, pressed:0 };
    b.ctrl={ blocksBack:function(){ return this.back; }, back:false, dir:5, pressed:0 };
    if (MATCH.phaseT===1){ a.setSt("intro"); b.setSt("intro"); }
    if (MATCH.phaseT===64){ say("FIGHT!",""); SND.voice("fight"); FLASH=6; FLASHC="#ffffff"; }
    if (MATCH.phaseT>96){ MATCH.phase="fight"; MATCH.phaseT=0; a.setSt("idle"); b.setSt("idle"); }
  } else if (MATCH.phase==="fight"){
    if (!MATCH.hurryPlayed && MATCH.timer<=10*60){ MATCH.hurryPlayed=true; say("HURRY UP!",""); SND.sfx("bell"); }
    MATCH.timer--;
    a.ctrl = a.ai ? aiCtrl(a,b) : humanCtrl(a);
    b.ctrl = b.ai ? aiCtrl(b,a) : (b.tctrl || humanCtrl(b));
    a.input=a.ctrl; b.input=b.ctrl;
    updateFighter(a,b); updateFighter(b,a);
    separateBodies(); checkHits();
    updateProj();
    if ((a.st==="ko"&&a.stT>70)||(b.st==="ko"&&b.stT>70)) roundOver();
    else if (MATCH.timer<=0) timeOver();
  } else if (MATCH.phase==="ko"){
    MATCH.slow=1;
    a.ctrl=b.ctrl={ blocksBack:function(){ return false; }, back:false, dir:5, pressed:0 };
    updateFighter(a,b); updateFighter(b,a);
    updateProj();
    if (MATCH.phaseT>96){ MATCH.slow=0; MATCH.phase="roundend"; MATCH.phaseT=0; }
  } else if (MATCH.phase==="roundend"){
    MATCH.slow=0;
    updateFighter(a,b); updateFighter(b,a);
    if (MATCH.phaseT>130) advanceTeams();
  } else if (MATCH.phase==="matchend"){
    MATCH.slow=0;
    updateFighter(a,b); updateFighter(b,a);
    if (MATCH.phaseT>150) finishMatch();
  }
  updateFX();
  updateCamera();
}
function roundOver(){
  var a=MATCH.f[0], b=MATCH.f[1];
  var ha=(a.hp>0&&a.st!=="ko"), hb=(b.hp>0&&b.st!=="ko");
  MATCH.doubleKO=!ha&&!hb;
  MATCH.winSide = MATCH.doubleKO ? -1 : (ha?0:1);
  MATCH.phase="ko"; MATCH.phaseT=0;
  if (MATCH.winSide>=0 && MATCH.f[MATCH.winSide].perfect){
    say("PERFECT!",""); SND.voice("perfect");
  } else if (MATCH.doubleKO){ say("DOUBLE K.O.",""); }
  else { say("K.O.",""); }
  SND.sfx("ko");
}
function timeOver(){
  var a=MATCH.f[0], b=MATCH.f[1];
  if (a.hp===b.hp){ MATCH.doubleKO=true; MATCH.winSide=-1; koFighter(a); koFighter(b); }
  else { MATCH.winSide = a.hp>b.hp?0:1; koFighter(MATCH.f[1-MATCH.winSide]); }
  MATCH.phase="ko"; MATCH.phaseT=0;
  say("TIME UP",""); SND.sfx("bell");
}
function advanceTeams(){
  var a=MATCH.f[0], b=MATCH.f[1];
  if (MATCH.winSide<0){ MATCH.cur[0]++; MATCH.cur[1]++; }
  else MATCH.cur[1-MATCH.winSide]++;
  var over0=MATCH.cur[0]>=3, over1=MATCH.cur[1]>=3;
  if (over0||over1){ MATCH.phase="matchend"; MATCH.phaseT=0;
    var w = over0&&over1 ? -1 : (over0?1:0);
    MATCH.winSide=w;
    say(w<0?"DRAW GAME":"WINNER", w<0?"":"第 "+(MATCH.stage+1)+" 战");
    if (w>=0) SND.voice("winner");
    if (w>=0){ MATCH.f[w].setSt("win"); MATCH.f[w].hp=Math.min(MAXHP,MATCH.f[w].hp+18); }
    return; }
  /* 换人：胜者保留角色并回复少量体力 */
  var carry=[MATCH.f[0].hp, MATCH.f[1].hp];
  if (MATCH.winSide>=0) carry[MATCH.winSide]=Math.min(MAXHP, carry[MATCH.winSide]+22);
  MATCH.round++;
  MATCH.timer=99*60; MATCH.hurryPlayed=false;
  MATCH.phase="ready"; MATCH.phaseT=0;
  var prevCur=[MATCH.cur[0],MATCH.cur[1]];
  spawnFighters();
  for (var si=0;si<2;si++){ if (MATCH.cur[si]===prevCur[si]) MATCH.f[si].hp=carry[si]; }
  say("ROUND "+MATCH.round);
  SND.voice(MATCH.round===1?"round1":(MATCH.round===2?"round2":"round3"));
}
function finishMatch(){
  GAME.state="result"; GAME.result={ win:MATCH.winSide, mode:MATCH.mode };
  GAME.resT=0;
  if (MATCH.mode==="arcade"){
    if (MATCH.winSide===0){ MATCH.arcade.stage++;
      if (MATCH.arcade.stage>MATCH.arcade.teams.length-1){ GAME.state="result"; GAME.result.ending=true; }
    } else GAME.result.lose=true;
  }
  syncTouchLayer();
}

function bar(g,x,y,w,h,f,flip){
  var r=clamp(f.hp/f.maxhp,0,1);
  PX(g,x-1,y-1,w+2,h+2,"#05050a");
  PX(g,x,y,w,h,"#2a1418");
  var ww=Math.round(w*r);
  var gd=g.createLinearGradient(0,y,0,y+h);
  if (r>0.3){ gd.addColorStop(0,"#8af06a"); gd.addColorStop(0.5,"#f0e04a"); gd.addColorStop(1,"#c8a02a"); }
  else { gd.addColorStop(0,"#ff8a5a"); gd.addColorStop(1,"#c02a1a"); }
  g.fillStyle=gd;
  if (flip) g.fillRect(x+w-ww,y,ww,h); else g.fillRect(x,y,ww,h);
  for (var i=0;i<w;i+=6){ PX(g,x+i,y,1,h,"rgba(0,0,0,0.22)"); }
  PX(g,x,y,w,1,"rgba(255,255,255,0.35)");
  g.font="bold 8px monospace"; g.textAlign=flip?"right":"left";
  g.fillStyle="#0a0a0a"; g.fillText(f.ch.name, flip?x+w-3:x+3, y+h-2);
}

function meter(g,x,y,side){
  var f=MATCH.f[side], w=150, h=9;
  PX(g,x-1,y-1,w+2,h+2,"#05050a"); PX(g,x,y,w,h,"#101828");
  var seg=Math.floor(f.meter), part=f.meter-seg;
  for (var i=0;i<3;i++){
    var sw=w/3-2, sx=x+i*(w/3)+1;
    var fill = i<seg ? 1 : (i===seg ? part : 0);
    var gd=g.createLinearGradient(sx,y,sx,y+h);
    if (fill>=1&&f.maxT>0){ gd.addColorStop(0,"#fff0a0"); gd.addColorStop(1,"#ff6a2a"); }
    else { gd.addColorStop(0,"#7cd8ff"); gd.addColorStop(1,"#2a6ad8"); }
    g.fillStyle=gd; g.fillRect(sx,y,Math.round(sw*fill),h);
    PX(g,sx,y,sw,1,"rgba(255,255,255,0.22)");
  }
  g.font="bold 8px monospace"; g.textAlign=side?"right":"left";
  g.fillStyle=f.maxT>0?"#ffd25a":"#8a92b8";
  g.fillText((side?"P2":"P1")+" 气力"+(f.maxT>0?"  MAX "+Math.ceil(f.maxT/60)+"s":""), side?x+w:x, y-3);
}

var GAME = {
  state:"title", menuIdx:0, banner:null, resT:0, t:0,
  nav:[{last:5,cd:0},{last:5,cd:0}],
  sel:{ step:0, picks:[[],[]], cur:[4,0], done:[false,false] },
  order:{ side:0, cur:0 },
  train:{ dummy:"stand", regen:true, hitbox:false, lastDmg:0, maxCombo:0, comboShown:0 },
  settings:{ aiLevel:2, hitbox:false, dmg:true, bgm:true },
  setIdx:0, rebind:null, result:null, arcade:null, menuFrom:"title"
};
var TITLE_MENU=[
  { id:"arcade", n:"街 机 模 式", e:"ARCADE MODE", d:"连续挑战 6 支队伍 · 最后迎战霸王" },
  { id:"cpu",    n:"单 人 对 战", e:"SINGLE VS CPU", d:"3 对 3 组队战 · CPU 难度可调" },
  { id:"vs",     n:"本 地 双 人", e:"2 PLAYERS", d:"同一台设备 · 双人对战" },
  { id:"training",n:"训 练 模 式", e:"TRAINING", d:"无限气力 · 假人设置 · 判定框显示" },
  { id:"movelist",n:"出 招 表", e:"COMMAND LIST", d:"查看全部角色招式与指令" },
  { id:"settings",n:"设 置", e:"SETTINGS", d:"难度 / 音量 / 按键自定义" }
];
function navEdge(k){
  var ip=IN[k], nv=GAME.nav[k], out=0;
  if (nv.cd>0) nv.cd--;
  if (ip.dir!==nv.last){ nv.last=ip.dir;
    if (ip.dir!==5){ nv.cd=11;
      out = ip.dir===8?1:(ip.dir===2?2:(ip.dir===4?3:(ip.dir===6?4:0))); return out; } }
  else if (ip.dir!==5 && nv.cd===0){ nv.cd=6;
    out = ip.dir===8?1:(ip.dir===2?2:(ip.dir===4?3:(ip.dir===6?4:0))); return out; }
  if (ip.pressed&BTN.A) return 5;
  if (ip.pressed&BTN.B) return 6;
  if (ip.pressed&0x1000) return 7;
  return out;
}
function startSelect(mode){
  GAME.mode=mode;
  GAME.sel={ step:mode==="vs"?0:0, picks:[[],[]], cur:[0,0], done:[false,false] };
  GAME.state="select";
  SND.resume(); SND.startBgm(1);
}
function randTeam(exclude){
  var pool=[];
  for (var i=0;i<CHARS.length;i++){ if (CHARS[i].id==="ba") continue; pool.push(CHARS[i].id); }
  var t=[];
  for (var j=0;j<3;j++){
    var k=irnd(0,pool.length-1);
    t.push(pool[k]);
    if (pool.length>3) pool.splice(k,1);
  }
  return t;
}
function startArcade(team){
  var teams=[], st=0;
  for (var i=0;i<5;i++) teams.push(randTeam());
  teams.push([pick(["yan","lei","long"]), pick(["tie","feng","bing"]), "ba"]);
  GAME.arcade={ teams:teams, stage:0, final:false };
  GAME.playerTeam=team;
  beginArcadeMatch();
}
function beginArcadeMatch(){
  var st=GAME.arcade.stage, teams=GAME.arcade.teams[st];
  GAME.arcade.final = (st===GAME.arcade.teams.length-1);
  newMatch({ mode:"arcade", teams:[GAME.playerTeam, teams],
    stage: GAME.arcade.final?4:(st%3), aiLevel:GAME.settings.aiLevel, arcade:GAME.arcade });
}
function startCpu(team){ newMatch({ mode:"cpu", teams:[team, randTeam()], stage:irnd(0,2), aiLevel:GAME.settings.aiLevel }); }
function startVs(t1,t2){ newMatch({ mode:"vs", teams:[t1,t2], stage:irnd(0,3), aiLevel:2 }); }
function startTraining(team){ newMatch({ mode:"training", teams:[team,[CMAP["yan"].id,"lei","tie"]], stage:irnd(0,2), aiLevel:1 }); GAME.train.maxCombo=0; }
/* ---- 逐帧界面逻辑 ---- */
function updateScreens(){
  var a;
  if (GAME.state==="title"){
    a=navEdge(0);
    if (a===1){ GAME.menuIdx=(GAME.menuIdx+TITLE_MENU.length-1)%TITLE_MENU.length; SND.sfx("ui"); }
    else if (a===2){ GAME.menuIdx=(GAME.menuIdx+1)%TITLE_MENU.length; SND.sfx("ui"); }
    else if (a===5||a===7){
      var m=TITLE_MENU[GAME.menuIdx];
      SND.sfx("ok"); SND.resume();
      if (m.id==="movelist"){ GAME.state="movelist"; GAME.mlIdx=0; }
      else if (m.id==="settings"){ GAME.state="settings"; GAME.setIdx=0; }
      else startSelect(m.id);
    }
  } else if (GAME.state==="select"){
    var side=GAME.sel.step;
    a=navEdge(side);
    var cur=GAME.sel.cur, cols=5, total=CHARS.length;
    if (a===1){ cur[side]=(cur[side]+total-cols)%total; SND.sfx("ui"); }
    else if (a===2){ cur[side]=(cur[side]+cols)%total; SND.sfx("ui"); }
    else if (a===3){ cur[side]=(cur[side]+total-1)%total; SND.sfx("ui"); }
    else if (a===4){ cur[side]=(cur[side]+1)%total; SND.sfx("ui"); }
    else if (a===5){
      var id=CHARS[cur[side]].id;
      if (CHARS[cur[side]].id==="ba" && GAME.mode!=="training"){
        /* BOSS 不可选（街机最终 BOSS 专属） */
        SND.sfx("block"); GAME.toast={ t:110, s:"BOSS 为最终 BOSS，不可选择" };
      } else if (GAME.sel.picks[side].length<3){
        GAME.sel.picks[side].push(id); SND.sfx("ok"); SND.voice("select");
      }
      if (GAME.sel.picks[side].length>=3){
        GAME.sel.done[side]=true;
        if (GAME.mode==="vs" && side===0){ GAME.sel.step=1; }
        else { GAME.state="order"; GAME.order.side=0; GAME.order.cur=0; SND.sfx("ok"); }
      }
    } else if (a===6){
      if (GAME.sel.picks[side].length){ GAME.sel.picks[side].pop(); SND.sfx("ui"); }
      else if (side===1&&GAME.mode==="vs"){ GAME.sel.step=0; }
      else { GAME.state="title"; }
    }
  } else if (GAME.state==="order"){
    var picks=GAME.sel.picks[GAME.order.side];
    a=navEdge(0);
    if (a===3){ GAME.order.cur=(GAME.order.cur+2)%3; SND.sfx("ui"); }
    else if (a===4){ GAME.order.cur=(GAME.order.cur+1)%3; SND.sfx("ui"); }
    else if (a===1||a===2){
      var j=(GAME.order.cur+ (a===1?2:1))%3, tmp=picks[GAME.order.cur];
      picks[GAME.order.cur]=picks[j]; picks[j]=tmp; SND.sfx("ui");
    }
    else if (a===5){
      SND.sfx("ok");
      if (GAME.mode==="vs" && GAME.order.side===0){ GAME.order.side=1; GAME.order.cur=0; }
      else {
        if (GAME.mode==="arcade") startArcade(GAME.sel.picks[0].slice(0));
        else if (GAME.mode==="cpu") startCpu(GAME.sel.picks[0].slice(0));
        else if (GAME.mode==="vs") startVs(GAME.sel.picks[0].slice(0), GAME.sel.picks[1].slice(0));
        else if (GAME.mode==="training") startTraining(GAME.sel.picks[0].slice(0));
      }
    } else if (a===6){ GAME.state="select"; GAME.sel.done[GAME.order.side]=false; }
  } else if (GAME.state==="movelist"){
    a=navEdge(0);
    if (a===3){ GAME.mlIdx=(GAME.mlIdx+CHARS.length-1)%CHARS.length; SND.sfx("ui"); }
    else if (a===4){ GAME.mlIdx=(GAME.mlIdx+1)%CHARS.length; SND.sfx("ui"); }
    else if (a===6||a===5){ GAME.state="title"; SND.sfx("ui"); }
  } else if (GAME.state==="settings"){
    a=navEdge(0);
    var S=GAME.settings, items=9;
    if (a===1){ GAME.setIdx=(GAME.setIdx+items-1)%items; SND.sfx("ui"); }
    else if (a===2){ GAME.setIdx=(GAME.setIdx+1)%items; SND.sfx("ui"); }
    else if (a===3||a===4||a===5){
      var inc=(a===4||a===5)?1:-1;
      if (GAME.setIdx===0){ S.aiLevel=clamp(S.aiLevel+inc,1,3); SND.sfx("ui"); }
      else if (GAME.setIdx===1){ S.bgm=!S.bgm; SND.setMuted(!S.bgm); SND.sfx("ui"); }
      else if (GAME.setIdx===2){ SND.setBgmVol(clamp(SND.bgmVol()+inc*0.1,0,1)); SND.sfx("ui"); }
      else if (GAME.setIdx===3){ S.hitbox=!S.hitbox; SND.sfx("ui"); }
      else if (GAME.setIdx===4){ S.dmg=!S.dmg; SND.sfx("ui"); }
      else if (GAME.setIdx===5||GAME.setIdx===6){
        if (a===5) startRebind(GAME.setIdx===5?"p1":"p2");
      }
      else if (GAME.setIdx===7){ if (a===5){ BIND=JSON.parse(JSON.stringify(DEFAULT_KEYS)); saveBind(); GAME.toast={ t:120, s:"按键已恢复默认" }; SND.sfx("ok"); } }
      else if (GAME.setIdx===8){ if (a===5){ GAME.state=GAME.menuFrom==="pause"?"pause":"title"; SND.sfx("ui"); } }
    }
    else if (a===6){ GAME.state=GAME.menuFrom==="pause"?"pause":"title"; GAME.menuFrom="title"; SND.sfx("ui"); }
  } else if (GAME.state==="fight"){
    /* 暂停在 stepGame 中处理；此处保留空分支以便后续扩展 */
  } else if (GAME.state==="pause"){
    a=navEdge(0);
    if (GAME.pauseIdx==null) GAME.pauseIdx=0;
    if (a===1){ GAME.pauseIdx=(GAME.pauseIdx+4)%5; SND.sfx("ui"); }
    else if (a===2){ GAME.pauseIdx=(GAME.pauseIdx+1)%5; SND.sfx("ui"); }
    else if (a===5){
      var P=GAME.pauseIdx; SND.sfx("ok");
      if (P===0){ GAME.state="fight"; }
      else if (P===1){ GAME.state="fight"; newMatch({ mode:MATCH.mode, teams:MATCH.team, stage:MATCH.stage, aiLevel:MATCH.aiLevel, arcade:GAME.arcade }); }
      else if (P===2){ GAME.state="select"; GAME.sel={ step:0, picks:[[],[]], cur:[0,0], done:[false,false] }; }
      else if (P===3){ GAME.menuFrom="pause"; GAME.state="settings"; }
      else { GAME.state="title"; SND.startBgm(0); }
    } else if (a===6||a===7){ GAME.state="fight"; SND.sfx("ui"); }
  } else if (GAME.state==="result"){
    GAME.resT++;
    a=navEdge(0);
    if (GAME.resT>40 && (a===5||a===7)){
      var R=GAME.result;
      SND.sfx("ok");
      if (R.mode==="arcade" && R.win===0 && !R.ending && !R.lose){ beginArcadeMatch(); }
      else if (R.mode==="arcade" && R.lose){ GAME.arcade={teams:GAME.arcade.teams, stage:0}; GAME.state="continue"; GAME.contT=9*60; }

function stepGame(){
  FRAME++;
  pollGamepads();
  snapInputs();
  GAME.t++;
  if (GAME.toast && GAME.toast.t>0) GAME.toast.t--;
  if (HITSTOP>0){ HITSTOP--; updateFX(); if (MATCH.f[0]) updateCamera(); return; }
  if (GAME.state==="fight"){
    if (IN[0].pressed&0x1000){ GAME.state="pause"; GAME.pauseIdx=0; SND.sfx("ui"); return; }
    trainingTick();
    stepFight();
    if (MATCH.mode==="training"){
      var cb=MATCH.f[0].combo;
      if (cb>GAME.train.maxCombo) GAME.train.maxCombo=cb;
      if (MATCH.f[0].combo>=2&&MATCH.f[0].combo!==GAME.train.comboShown){ GAME.train.comboShown=MATCH.f[0].combo; }
    }
  }
  updateScreens();
  syncTouchLayer();
}
var lastT=0, acc=0;
var FPS=60, fpsAcc=0, fpsN=0, fpsT=0;
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastT) lastT=ts;
  var dt=(ts-lastT)/1000; lastT=ts;
  if (!isFinite(dt)||dt<0) dt=0;
  if (dt>0.25) dt=0.25;
  acc+=dt;
  var steps=0;
  while (acc>=1/60 && steps<5){
    acc-=1/60;
    var sl=MATCH.slow&&GAME.state==="fight";
    if (sl){ if ((FRAME%2)===0) stepGame(); else { FRAME++; snapInputs(); updateFX(); } }
    else stepGame();
    steps++;
  }
  if (steps>=5) acc=0;
  render();
  fpsAcc+=dt; fpsN++;
  if (fpsAcc>0.5){ FPS=Math.round(fpsN/fpsAcc); fpsAcc=0; fpsN=0; }
}

  var pre=["yan","lei","ying","tie","feng","long","bing","lang","ba"];
  for (var p=0;p<pre.length;p++){
    var ch=CMAP[pre[p]];
    var anims=["idle","walkF","punchL","kickH","jump","hit","down","proj","uppercut"];
    for (var a2=0;a2<anims.length;a2++) spriteFrame(ch,anims[a2],0.5);
  }
  GAME.state="title";
  showTouchIfNeeded();
  requestAnimationFrame(loop);
}
function showTouchIfNeeded(){ syncTouchLayer(); }
/* 调试钩子 */
window.__kof = {
  G:GAME, MATCH:MATCH, CHARS:CHARS, CMAP:CMAP, IN:IN, SND:SND,
  stats:function(){
    return { state:GAME.state, mode:MATCH.mode, phase:MATCH.phase, round:MATCH.round, timer:Math.round(MATCH.timer),
      camx:Math.round(CAMX), stage:STAGE.id, fps:FPS,
      p:MATCH.f.map(function(f){ return f?{ id:f.cid, hp:Math.round(f.hp*10)/10, st:f.st, x:Math.round(f.x), y:Math.round(f.y),
        face:f.face, meter:Math.round(f.meter*100)/100, maxT:f.maxT, combo:f.combo, ai:!!f.ai }:null; }),
      teams:MATCH.team, cur:MATCH.cur, winSide:MATCH.winSide, proj:PROJ.length, fx:FX.length };
  },
  start:function(mode,t1,t2){ if (mode==="training") startTraining(t1||["yan","lei","tie"]);
    else if (mode==="cpu") startCpu(t1||["yan","lei","tie"]);
    else if (mode==="vs") startVs(t1||["yan","lei","tie"], t2||["tie","feng","bing"]);
    else startArcade(t1||["yan","lei","tie"]); },
  setAI:function(l){ MATCH.aiLevel=l; },
  warp:function(x){ MATCH.f[0].x=x; },
  cmd:function(key,heavy){ return tryAction(MATCH.f[0],key,!!heavy,true); },
  hit:function(){ MATCH.f[1].hp=1; },
  setHp:function(side,v){ var f=MATCH.f[side]; if(!f) return; f.hp=v; if (v<=0) koFighter(f); },
  ko:function(side){ var f=MATCH.f[side]; if(f) koFighter(f); },
  phase:function(){ return MATCH.phase; },
  seq:function(list){ var i=0; var t=setInterval(function(){ if (i>=list.length){ clearInterval(t); return; }
    tryAction(MATCH.f[0],list[i++],false,true); }, 120); },
  charOf:function(id){ return CMAP[id]; },
  poseKey:poseKey, setSt:setSt, spriteFrame:spriteFrame,
  forceState:function(s){ GAME.state=s; },
  ai:function(on){ MATCH.f[1].ai=on?makeAI(2):null; },
  rot:function(){ return { on:ROT.on, dir:ROT.dir, isTouch:isTouch, portrait:portraitNow(), logical:logicalSize(), scale:SCALE }; },
  setRot:setRot, detectTouch:detectTouch,
  teams:function(){ return GAME.arcade?GAME.arcade.teams:null; }
};
boot();
})();

</script>
