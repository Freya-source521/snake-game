<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#10121c" />
<title>像素世界 · 泰拉瑞亚式沙盒冒险</title>
<link rel="icon" href="./favicon.svg" />
<style>
  :root{
    --panel:#33334a; --panel2:#23233a; --hi:#6d6d97; --lo:#12121d;
    --text:#e9e6ff; --muted:#9a97bd; --gold:#f0d17a; --hp:#ff4a5a; --mp:#4aa8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060b;color:var(--text);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  canvas{display:block;position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
  .hidden{display:none !important}
  .bevel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:3px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);
    box-shadow:0 6px 22px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.35)}
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:40;
    background:radial-gradient(900px 600px at 50% 30%,rgba(70,60,120,.55),rgba(4,5,10,.96) 70%);padding:16px;overflow:auto}
  h1.title{font-family:"Courier New",monospace;font-weight:900;letter-spacing:6px;font-size:clamp(24px,6vw,52px);
    color:#ffe9a8;text-shadow:3px 3px 0 #6b4a12,6px 6px 0 rgba(0,0,0,.6)}
  h2.sub{letter-spacing:3px;color:#cdb9ff;font-weight:600;font-size:clamp(12px,2.6vw,17px);text-shadow:2px 2px 0 rgba(0,0,0,.7);text-align:center}
  .btn{font-family:inherit;font-size:15px;letter-spacing:2px;color:#f4f1ff;cursor:pointer;padding:11px 22px;min-width:190px;
    background:linear-gradient(180deg,#4b4b70,#2a2a42);border:3px solid;border-color:#8282b0 #191926 #191926 #8282b0;text-shadow:1px 1px 0 #000}
  .btn:hover{background:linear-gradient(180deg,#5d5d92,#33334f)}
  .btn:active{transform:translate(1px,1px)}
  .btn.small{min-width:auto;padding:7px 13px;font-size:12.5px;letter-spacing:1px}
  .btn.on{border-color:#f0d17a #6b4a12 #6b4a12 #f0d17a;background:linear-gradient(180deg,#6b5a2a,#3c3117)}
  .btn:disabled{opacity:.45;cursor:default}
  .card-box{width:min(780px,96vw);padding:20px;display:flex;flex-direction:column;gap:13px;align-items:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
  label.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:1px}
  input.fld,select.fld{background:#1b1b2a;border:2px solid;border-color:#5a5a80 #101018 #101018 #5a5a80;color:#eee;padding:8px 10px;font-size:14px;font-family:inherit;min-width:180px}
  .tip{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.75;max-width:660px}
  #hud{position:absolute;inset:0;pointer-events:none;z-index:10}
  #hud > *{pointer-events:auto}
  #stats{position:absolute;left:10px;top:8px;display:flex;flex-direction:column;gap:4px}
  .barrow{display:flex;align-items:center;gap:6px}
  .bar{width:min(232px,42vw);height:16px;background:#1a1020;border:2px solid;border-color:#5a5a80 #0d0d14 #0d0d14 #5a5a80;position:relative;overflow:hidden}
  .bar > i{position:absolute;left:0;top:0;bottom:0;display:block}
  .bar > span{position:absolute;inset:0;font-size:11px;font-weight:700;text-align:center;line-height:13px;color:#fff;text-shadow:1px 1px 0 #000;letter-spacing:1px}
  #hpfill{background:linear-gradient(180deg,#ff7a86,#c01a2a)}
  #mpfill{background:linear-gradient(180deg,#8fd0ff,#1f5fd0)}
  #buffs{display:flex;gap:3px;flex-wrap:wrap;max-width:280px}
  .buff{width:28px;height:28px;position:relative;background:#241d33;border:2px solid #6d6d97;font-size:15px;display:flex;align-items:center;justify-content:center}
  .buff b{position:absolute;right:-1px;bottom:-3px;font-size:9px;color:#ffe9a8;text-shadow:1px 1px 0 #000}
  #hotbar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(20,18,32,.72);border:2px solid #4b4b70}
  body.touch #hotbar{left:50%;bottom:196px;transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,46px);gap:3px}
  body.touch #topbtns .btn{padding:5px 8px;font-size:11px;letter-spacing:0}
  body.touch #worldinfo{bottom:8px;max-width:44vw;font-size:10.5px}
  .slot{width:46px;height:46px;background:linear-gradient(180deg,#33334a,#22223a);border:2px solid;border-color:#5f5f8c #14141f #14141f #5f5f8c;position:relative;cursor:pointer;flex:0 0 auto}
  .slot.sel{border-color:#ffe9a8 #6b4a12 #6b4a12 #ffe9a8;background:linear-gradient(180deg,#5a4d30,#332b18)}
  .slot canvas{position:static;width:38px;height:38px;margin:2px;pointer-events:none}
  .slot .ct{position:absolute;right:1px;bottom:0;font-size:11px;font-weight:800;color:#fff;text-shadow:1px 1px 0 #000,0 0 3px #000}
  .slot .key{position:absolute;left:2px;top:0;font-size:9px;color:#b9b6dd;text-shadow:1px 1px 0 #000}
  #minimap{position:absolute;right:8px;top:162px;border:3px solid;border-color:#6d6d97 #101018 #101018 #6d6d97;background:#05060b;cursor:pointer}
  #worldinfo{position:absolute;left:10px;bottom:72px;text-align:left;font-size:11.5px;color:#d8d5ff;text-shadow:1px 1px 0 #000,0 0 4px #000;line-height:1.5;pointer-events:none}
  #topbtns{position:absolute;right:10px;top:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #topbtns .btn{min-width:0;padding:6px 10px;font-size:12px}
  #tooltip{position:absolute;z-index:30;max-width:240px;padding:8px 10px;font-size:12px;line-height:1.6;pointer-events:none;
    background:rgba(12,12,22,.96);border:2px solid #6d6d97;box-shadow:0 4px 14px rgba(0,0,0,.7)}
  #tooltip b{color:#ffe9a8}
  #tooltip .st{color:#8ff0c0}
  #tooltip .bad{color:#ff9a9a}
  #tooltip .dim{color:#9a97bd}
  #bossbar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(560px,80vw);display:flex;flex-direction:column;gap:3px;align-items:center}
  #bossbar .bn{font-size:13px;letter-spacing:3px;color:#ffd9d9;text-shadow:2px 2px 0 #000}
  #bossbar .bar{width:100%;height:20px}
  #bossfill{background:linear-gradient(180deg,#ff8a5e,#a1122a)}
  #events{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;font-size:clamp(16px,4vw,30px);font-weight:800;
    letter-spacing:4px;color:#ffe9a8;text-shadow:3px 3px 0 #000;pointer-events:none;opacity:0;transition:opacity .6s;z-index:30}
  #dialog{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);width:min(720px,94vw);padding:12px 14px;display:none;flex-direction:column;gap:8px;z-index:20}
  #dialog .who{color:#ffe9a8;font-weight:800;letter-spacing:2px;font-size:14px}
  #dialog .txt{font-size:13.5px;line-height:1.7;color:#e6e3ff}
  .panelwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;flex-direction:row;gap:12px;z-index:25;max-width:98vw}
  .panel{padding:10px}
  .panel .ptitle{font-size:12.5px;letter-spacing:2px;color:#ffe9a8;margin-bottom:8px;text-align:center}
  .grid10{display:grid;grid-template-columns:repeat(10,46px);gap:4px}
  .grid5{display:grid;grid-template-columns:repeat(5,46px);gap:4px}
  .invcol{display:flex;flex-direction:column;gap:8px}
  #recipes{width:250px;max-height:calc(var(--vh,100vh)*0.6);overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
  .recipe{display:flex;align-items:center;gap:8px;padding:4px 6px;background:linear-gradient(180deg,#33334a,#24243a);
    border:2px solid;border-color:#5f5f8c #14141f #14141f #5f5f8c;cursor:pointer;color:#e9e6ff;font-size:12.5px;text-align:left}
  .recipe:hover{background:linear-gradient(180deg,#45456a,#2e2e48)}
  .recipe.no{opacity:.4}
  .recipe canvas{position:static;width:34px;height:34px}
  .recipe .rw{flex:1;min-width:0}
  .recipe .rn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .recipe .rs{color:#9a97bd;font-size:11px}
  #touch{position:absolute;inset:0;z-index:15;display:none;pointer-events:none}
  #stick{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(40,38,64,.4);border:3px solid rgba(150,150,200,.5);pointer-events:auto}
  #stick i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(220,215,255,.5);border:3px solid rgba(255,255,255,.6)}
  .tbtn{position:absolute;border-radius:50%;background:rgba(40,38,64,.5);border:3px solid rgba(150,150,200,.55);color:#fff;
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:auto;letter-spacing:1px}
  #tjump{right:22px;bottom:26px;width:84px;height:84px}
  #tuse{right:120px;bottom:34px;width:74px;height:74px}
  #tinv{right:24px;bottom:124px;width:58px;height:58px}
  #tmap{right:92px;bottom:124px;width:58px;height:58px}
#thook{right:160px;bottom:124px;width:58px;height:58px}
  #rotate{position:absolute;inset:0;z-index:300;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;
    background:radial-gradient(900px 620px at 50% 32%,#181432 0%,#05060b 72%);text-align:center;padding:22px}
  #rotate h2{font-size:19px;letter-spacing:3px;color:#ffe9a8}
  #rotate .ph{width:66px;height:112px;border:4px solid #6d6d97;border-radius:12px;position:relative;animation:rotshake 2.4s ease-in-out infinite}
  #rotate .ph:after{content:"";position:absolute;left:50%;top:7px;width:24px;height:4px;margin-left:-12px;border-radius:2px;background:#6d6d97}
  @keyframes rotshake{0%,30%{transform:rotate(90deg)}60%,100%{transform:rotate(0deg)}}
  body.touch.landscape{
    --landscape:1}
  body.touch.landscape #hotbar{left:50%;bottom:8px;transform:translateX(-50%);display:flex;grid-template-columns:none;gap:3px;padding:4px;max-width:calc(100vw - 260px)}
  body.touch.landscape #hotbar .slot{width:min(38px,4.2vw);height:min(38px,4.2vw)}
  body.touch.landscape #hotbar .slot canvas{width:calc(100% - 4px);height:calc(100% - 4px);margin:2px}
  body.touch.landscape #hotbar .slot .ct{font-size:10px}
  body.touch.landscape #hotbar .slot .key{font-size:8px}
  body.touch.landscape #worldinfo{left:8px;top:52px;bottom:auto;max-width:26vw;font-size:10.5px}
  body.touch.landscape #topbtns{flex-direction:row;gap:5px;align-items:center}
  body.touch.landscape #topbtns .btn{padding:4px 7px;font-size:11px}
  body.touch.landscape #minimap{top:52px}
  body.touch.landscape #stats .bar{width:min(210px,26vw)}
  body.touch.landscape #stick{width:112px;height:112px;left:12px;bottom:12px}
  body.touch.landscape #stick i{width:46px;height:46px;margin:-23px 0 0 -23px}
  body.touch.landscape #tjump{right:14px;bottom:14px;width:72px;height:72px}
  body.touch.landscape #tuse{right:92px;bottom:20px;width:62px;height:62px}
  body.touch.landscape #tinv{right:14px;bottom:94px;width:50px;height:50px}
  body.touch.landscape #tmap{right:68px;bottom:94px;width:50px;height:50px}
  body.touch.landscape #thook{right:122px;bottom:94px;width:50px;height:50px}
  body.touch.landscape .screen{overflow-y:auto;overflow-x:hidden;padding:8px;justify-content:flex-start}
  body.touch.landscape .card-box{padding:12px;gap:8px;margin:auto}
  body.touch.landscape #charprev,body.touch.landscape #worldprev{width:126px;height:132px}
  body.touch.landscape .panelwrap{top:4px;left:50%;transform:translateX(-50%);flex-wrap:wrap;justify-content:center;align-items:flex-start;
    max-height:calc(var(--vh,100vh) - 8px);overflow-y:auto;overflow-x:hidden;max-width:100vw;gap:8px}
  body.touch.landscape .panel{padding:8px}
  body.touch.landscape .panelwrap .slot{width:38px;height:38px}
  body.touch.landscape .panelwrap .slot canvas{width:30px;height:30px;margin:2px}
  body.touch.landscape .grid10{grid-template-columns:repeat(10,42px);gap:3px}
  body.touch.landscape .grid5{grid-template-columns:repeat(5,42px);gap:3px}
  body.touch.landscape .scroll{max-height:calc(var(--vh,100vh)*0.34)}
  body.touch.landscape .kv{font-size:12px;gap:3px 10px}
  #loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#05060b;z-index:50}
  #loading .track{width:min(460px,80vw);height:20px;background:#16162a;border:3px solid;border-color:#5f5f8c #0d0d14 #0d0d14 #5f5f8c}
  #loading .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38f0d0,#7c6bff)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;line-height:1.7}
  .kv b{color:#ffe9a8;font-weight:600}
  .shopitem{display:flex;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
  .shopitem canvas{position:static;width:34px;height:34px;cursor:pointer}
  .shopitem .sn{flex:1;font-size:12.5px}
  .coin{color:#f0d17a;font-size:12px}
  .scroll{max-height:calc(var(--vh,100vh)*0.5);overflow-y:auto;width:340px}
  #charprev,#worldprev{width:170px;height:190px;background:#0d0f18;border:3px solid;border-color:#5f5f8c #101018 #101018 #5f5f8c}
  .slider{width:190px}
  .keyhint{font-size:12px;color:#b9b6dd;line-height:2;text-align:left}
  .keyhint b{color:#ffe9a8}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#1b1b2a}
  ::-webkit-scrollbar-thumb{background:#4b4b70;border:2px solid #1b1b2a}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="stats" class="hidden">
    <div class="barrow"><div class="bar"><i id="hpfill"></i><span id="hptxt">100/100</span></div></div>
    <div class="barrow"><div class="bar"><i id="mpfill"></i><span id="mptxt">20/20</span></div></div>
    <div id="buffs"></div>
  </div>
  <div id="minimap" class="hidden"><canvas id="mmcv" width="188" height="132"></canvas></div>
  <div id="topbtns" class="hidden">
    <button class="btn small" id="btn-inv">背包 B</button>
    <button class="btn small" id="btn-craft">合成 C</button>
    <button class="btn small" id="btn-map">地图 M</button>
    <button class="btn small" id="btn-pause">菜单 ESC</button>
    <button class="btn small" id="btn-music">音乐</button>
  </div>
  <div id="worldinfo" class="hidden"></div>
  <div id="hotbar" class="hidden"></div>
  <div id="bossbar" class="hidden"><div class="bn" id="bossname">BOSS</div><div class="bar"><i id="bossfill"></i></div></div>
</div>
<div id="events"></div>
<div id="dialog" class="bevel"></div>
<div class="panelwrap" id="panelwrap"></div>
<div id="tooltip" class="hidden"></div>
<div id="touch">
  <div id="stick"><i></i></div>
  <div class="tbtn" id="tjump">跳</div>
  <div class="tbtn" id="tuse">用</div>
  <div class="tbtn" id="tinv">包</div>
  <div class="tbtn" id="tmap">图</div>
  <div class="tbtn" id="thook">钩</div>
</div>
<div id="rotate">
  <div class="ph"></div>
  <h2>请横屏游玩</h2>
  <div class="tip" id="rotatetip">本游戏为横屏体验：点下面的按钮进入全屏横屏。<br/>如果手机仍然竖着，请手动旋转设备。</div>
  <button class="btn" id="btn-rotate">进入全屏横屏</button>
  <button class="btn small" id="btn-force">已经是横屏 · 直接继续</button>
</div>
<div id="loading"><h2 class="sub" id="loadtxt">正在生成世界…</h2><div class="track"><i id="loadbar"></i></div><div class="tip" id="loadtip"></div></div>

<div class="screen" id="scr-title">
  <h1 class="title">像 素 世 界</h1>
  <h2 class="sub">TERRA PIXEL · 探索 · 挖掘 · 建造 · 战斗 · 成长</h2>
  <div class="row">
    <button class="btn" id="b-newchar">创建角色</button>
    <button class="btn" id="b-continue">继续游戏</button>
  </div>
  <div class="row">
    <button class="btn small" id="b-help">操作说明</button>
    <button class="btn small" id="b-settings">设置</button>
  </div>
  <div class="tip" id="titlesave"></div>
</div>

<div class="screen hidden" id="scr-create"></div>
<div class="screen hidden" id="scr-death">
  <h1 class="title" style="font-size:clamp(22px,5vw,40px)">你 死 了</h1>
  <div class="tip" id="deathtxt"></div>
  <div class="row">
    <button class="btn" id="b-respawn">重生</button>
    <button class="btn" id="b-totitle">返回主菜单</button>
  </div>
</div>

<script>
"use strict";
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const sign=v=>v<0?-1:(v>0?1:0);
const floor=Math.floor, ceil=Math.ceil, abs=Math.abs, min=Math.min, max=Math.max, sqrt=Math.sqrt, sin=Math.sin, cos=Math.cos;
const now=()=>performance.now();
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function pick(rnd,arr){return arr[(rnd()*arr.length)|0];}
function rint(rnd,a,b){return a+((rnd()*(b-a+1))|0);}
function chance(rnd,p){return rnd()<p;}
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}
function dist(ax,ay,bx,by){return sqrt(dist2(ax,ay,bx,by));}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtTime(t){const h=floor(t)%24,m=floor((t%1)*60);return (h<10?"0":"")+h+":"+(m<10?"0":"")+m;}
const Noise=(()=>{
  const cache={};
  function grad(h,x,y){const u=(h&1)?x:-x,v=(h&2)?y:-y;return u+v;}
  function make(seed){return function(x,y){
    const xi=floor(x),yi=floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const h=(a,b)=>{let n=(a*374761393+b*668265263+seed*1442695040)|0;n=(n^(n>>13))*1274126177;return (n^(n>>16))>>>0;};
    const n00=h(xi,yi),n10=h(xi+1,yi),n01=h(xi,yi+1),n11=h(xi+1,yi+1);
    return lerp(lerp(grad(n00,xf,yf),grad(n10,xf-1,yf),u),lerp(grad(n01,xf,yf-1),grad(n11,xf-1,yf-1),u),v)/2;
  };}
  function of(seed){if(!cache[seed])cache[seed]=make(seed);return cache[seed];}
  function fbm(seed,x,y,oct,lac,gain){oct=oct||3;lac=lac||2;gain=gain||.5;const n=of(seed);let f=1,a=1,s=0,m=0;
    for(let i=0;i<oct;i++){s+=a*n(x*f,y*f);m+=a;a*=gain;f*=lac;}return s/m;}
  return {of,fbm};
})();
const Audio2=(()=>{
  let ctx=null,master=null,mg=null,sg=null,musicTimer=null,track=null,step=0,nextT=0,muted=false;
  let sfxOn=true,musicVol=.5,sfxVol=.5;
  const NOTE={C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
  function nf(n){if(!n||n===".")return 0;const m=/^([A-G]#?)(-?\d)$/.exec(n);if(!m)return 0;return 440*Math.pow(2,(NOTE[m[1]]-9)/12+(+m[2]-4));}

function updateEnemies(dt){

        if(e.onGround&&!aware&&Math.random()<0.01)e.vx=sign(Math.random()-0.5)*sp*0.5;

          const ang=Math.atan2(dy,dx)+wob;e.vx=lerp(e.vx,cos(ang)*sp,2.6*dt);e.vy=lerp(e.vy,sin(ang)*sp,2.6*dt);}

        if(aware&&e.shoot){e.shootCd-=dt;if(e.shootCd<=0&&d<340){e.shootCd=1.5;shootAt(e,pl,e.shoot,e.dmg);}}
        break;}
      case "caster":{if(aware){const want=210;const ang=Math.atan2(dy,dx);

        else if(Math.random()<0.02)e.vx=(Math.random()-0.5)*e.spd;

      case "boss":{updateBoss(e,dt,dx,dy,d);break;}
    }
    if(e.ai!=="flyer"&&e.ai!=="swimmer"&&e.ai!=="wormHead"&&e.ai!=="wormSeg"&&e.ai!=="critterFly"&&e.ai!=="boss"){}
    const dist=distToPlayer(e);

    if(e.fire&&dist<40)addBuff(pl,"onfire",4);

  }
}

function checkRoom(sx,sy){const seen={};const q=[[sx,sy]];const cells=[];let minx=sx,maxx=sx,miny=sy,maxy=sy;let hasDoor=false,hasChair=false,hasTable=false,hasLight=false,hasWallCount=0,leak=false;
  while(q.length){const c=q.pop();const x=c[0],y=c[1];const k=x+","+y;if(seen[k])continue;seen[k]=1;
    const t=TILE[til(x,y)];if(t.solid)continue;
    if(!inW(x,y)||y<2||y>W.h-2||abs(x-sx)>40||abs(y-sy)>30){leak=true;continue;}
    cells.push([x,y]);minx=min(minx,x);maxx=max(maxx,x);miny=min(miny,y);maxy=max(maxy,y);
    if(wal(x,y)!==0)hasWallCount++;

    if(t.n==="chair")hasChair=true;
    if(t.n==="table"||t.n==="workbench"||t.n==="bookcase")hasTable=true;
    if(t.n==="torch"||t.n==="lamp"||t.n==="furnace"||t.light>0)hasLight=true;
    if(cells.length>900){leak=true;break;}
    [[x-1,y],[x+1,y],[x,y-1],[x,y+1]].forEach(n=>{const nx=n[0],ny=n[1];if(!inW(nx,ny)){leak=true;return;}

function rleEncode(arr){const src=arr;const out=[];let i=0;const n=src.length;
  while(i<n){const v=src[i];let c=1;while(i+c<n&&src[i+c]===v&&c<2097151)c++;out.push(v);let x=c;
    while(x>=128){out.push((x&127)|128);x>>=7;}out.push(x);i+=c;}
  let s="";const CH=8192;for(let k=0;k<out.length;k+=CH)s+=String.fromCharCode.apply(null,out.slice(k,k+CH));return btoa(s);}
function rleDecode(str,len){const s=atob(str);const out=new Uint8Array(len);let p=0,i=0;
  while(p<len&&i<s.length){const v=s.charCodeAt(i++);let c=0,sh=0;while(true){const b=s.charCodeAt(i++);c|=(b&127)<<sh;if(!(b&128))break;sh+=7;}
    for(let k=0;k<c&&p<len;k++)out[p++]=v;}
  return out;}

  bindInput();detectTouch();initOrientationWatch();showScreen("scr-title");updateTitle();
  document.addEventListener("mousedown",()=>{Audio2.resume();if(!Audio2.current())Audio2.play(G.player?biomeMusic():"day");},{once:false});
  document.addEventListener("touchstart",()=>{Audio2.resume();if(!Audio2.current())Audio2.play(G.player?biomeMusic():"day");},{passive:true});
  requestAnimationFrame(loop);}
window.__terra={G:G,W:W,TILE:TILE,TID:TID,ITEMS:ITEMS,RECIPES:RECIPES,startNewWorld:startNewWorld,saveGame:saveGame,loadGame:loadGame,

  setTile:(x,y,v)=>{setTil(x,y,v);},getState:()=>({screen:G.screen,hp:G.player&&G.player.hp,x:G.player&&G.player.x,y:G.player&&G.player.y,

  setWall:(x,y,v)=>setWal(x,y,v),teleport:(x,y)=>{if(G.player){G.player.x=x;G.player.y=y;G.player.vx=G.player.vy=0;}},craft:craft,closePanels:closePanels,
  tryGrapple:tryGrapple,mineTest:(tx,ty,dt)=>mineTile(tx,ty,dt),
  mining:()=>{const pl=G.player;const tx=floor(G.mouse.world.x/TS),ty=floor(G.mouse.world.y/TS);mineTile(tx,ty,0.5);},
  breakAt:(tx,ty)=>breakTile(tx,ty,"pick"),placeAt:(id,tx,ty)=>placeBlock(id,tx,ty),stationNear:stationNear,checkRoom:checkRoom,
  findRoomFor:findRoomFor,startInvasion:startInvasion,meteorLand:meteorLand,shatterOrb:shatterOrb,startHardmode:startHardmode,
  respawn:respawn,openChestAt:openChestAt,openShop:openShop,pickups:()=>G.drops.map(d=>d.id),npcList:()=>G.npc.map(n=>n.type),
  oMetrics:oMetrics,portraitNow:portraitNow,updateOrientation:updateOrientation,resize:resize,isTouch:()=>isTouch,ART:ART,artBottomRow:artBottomRow};
