<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='16' fill='%232f6fd6'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>48</text></svg>" />
<style>
  :root {
    --bg: #0b0e1a; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --accent: #38f0d0; --accent2: #7c6bff; --text: #e8ecff; --muted: #8a92b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 20%, #141a33 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    min-height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  a.home {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    text-decoration: none; border-radius: 12px; padding: 8px 14px; font-size: 14px;
  }
  a.home:hover { background: rgba(255,255,255,0.1); }
  .hud { display: flex; flex-direction: column; align-items: center; min-width: 96px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 6px 16px; }
  .hud .label { font-size: 11px; color: var(--muted); letter-spacing: 2px; }
  .hud .value { font-size: 24px; font-weight: 700; line-height: 1.2; }
  #score { color: var(--accent); } #best { color: #ffd166; }
  #wrap { position: relative; }
  #board {
    position: relative;
    width: min(88vmin, 460px);
    aspect-ratio: 1 / 1;
    background: rgba(13,18,38,0.9);
    border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  #slots { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); padding: 2.2%; gap: 2.2%; }
  .slot { background: rgba(255,255,255,0.045); border-radius: 10px; }
  .tile {
    position: absolute; top: 0; left: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; border-radius: 10px;
    transition: transform 0.12s ease, opacity 0.15s ease;
    will-change: transform;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .tile.new { animation: pop 0.18s ease-out; }
  .tile.merged { animation: mergePulse 0.2s ease-out; }
  @keyframes pop { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes mergePulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: rgba(8,10,22,0.8); backdrop-filter: blur(5px);
    border-radius: 18px; text-align: center; padding: 20px; z-index: 5;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 40px; letter-spacing: 4px; margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay .sub { color: var(--muted); font-size: 14px; line-height: 2; }
  #overlay .sub b { color: var(--accent); }
  #start-btn { margin-top: 6px; background: linear-gradient(90deg, var(--accent), #22c1a8);
    color: #062a24; font-size: 18px; font-weight: 700; border: none; padding: 12px 36px;
    border-radius: 999px; cursor: pointer; box-shadow: 0 8px 24px rgba(56,240,208,.35); }
  #start-btn:active { transform: scale(.96); }
  .keys { display: flex; gap: 6px; justify-content: center; margin-top: 4px; flex-wrap: wrap; }
  .key { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <a class="home" href="./">🏠 返回主页</a>
    <div class="hud"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="hud"><div class="label">最高分</div><div class="value" id="best">0</div></div>
  </header>
  <div id="wrap">
    <div id="board">
      <div id="slots"></div>
      <div id="overlay">
        <h1 id="ov-title">2048</h1>
        <div class="sub" id="ov-sub">合并相同数字，合成 <b>2048</b> 方块！<br/>方向键 / 滑动屏幕操作</div>
        <button id="start-btn">开始游戏</button>
        <div class="keys"><span class="key">↑↓←→ / WASD</span><span class="key">📱 滑动</span><span class="key">R 重开</span></div>
      </div>
    </div>
  </div>
  <footer>相同数字相撞会合并 · 每步会随机出现新方块</footer>
  <script>
(function () {
  'use strict';

  var boardEl = document.getElementById('board');
  var slotsEl = document.getElementById('slots');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovSub = document.getElementById('ov-sub');
  var startBtn = document.getElementById('start-btn');

  var SIZE = 4;
  var BEST_KEY = 'game2048.best.v1';
  var MUTE_KEY = 'game2048.muted.v1';

  var COLORS = {
    2:    { bg: '#2a3050', text: '#dfe6ff' },
    4:    { bg: '#35427a', text: '#dfe6ff' },
    8:    { bg: '#2f6fd6', text: '#ffffff' },
    16:   { bg: '#2a9fd6', text: '#ffffff' },
    32:   { bg: '#22b8a8', text: '#06231f' },
    64:   { bg: '#2ed3ae', text: '#06231f' },
    128:  { bg: '#ffd166', text: '#3a2a00' },
    256:  { bg: '#ffb347', text: '#3a2200' },
    512:  { bg: '#ff8f5e', text: '#3a1600' },
    1024: { bg: '#ff6b6b', text: '#ffffff' },
    2048: { bg: '#ffd700', text: '#4a3800' }
  };

  var grid = [];      // grid[r][c] = tile obj or null
  var boardPx = 0, cell = 0, gap = 0;
  var score = 0, best = 0, state = 'idle'; // idle | playing | over | won
  var moved = false;
  var audio = null, muted = false;

  try { best = +(localStorage.getItem(BEST_KEY) || 0); } catch (e) {}
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  bestEl.textContent = best;

  // ---------- audio ----------
  function ensureAudio() {
    try {
      if (!audio) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audio = new AC();
      }
      if (audio && audio.state === 'suspended') audio.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type, vol, slide) {
    if (muted || !audio) return;
    try {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, audio.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    move: function () { tone(260, 0.04, 'sine', 0.05); },
    merge: function (v) { tone(400 + Math.min(800, v), 0.1, 'triangle', 0.15, 200); },
    win: function () { tone(523, 0.12, 'triangle', 0.18, 0); setTimeout(function(){ tone(659,0.12,'triangle',0.18,0); },120); setTimeout(function(){ tone(784,0.2,'triangle',0.18,0); },240); },
    over: function () { tone(300, 0.4, 'sawtooth', 0.16, -160); }
  };

  // ---------- layout ----------
  function layout() {
    boardPx = boardEl.clientWidth;
    gap = boardPx * 0.022;
    cell = (boardPx - gap * (SIZE + 1)) / SIZE;
    renderTiles();
  }

  function tilePos(r, c) {
    return 'translate(' + (gap + c * (cell + gap)) + 'px,' + (gap + r * (cell + gap)) + 'px)';
  }

  // ---------- board ----------
  function makeTile(value, r, c, isNew) {
    var el = document.createElement('div');
    el.className = 'tile' + (isNew ? ' new' : '');
    var t = { value: value, r: r, c: c, el: el, merged: false };
    el.style.width = cell + 'px';
    el.style.height = cell + 'px';
    el.style.transform = tilePos(r, c);
    el.style.fontSize = fontFor(value);
    paintTile(t);
    boardEl.appendChild(el);
    return t;
  }

  function fontFor(v) {
    var s = cell;
    if (v < 100) return Math.round(s * 0.46) + 'px';
    if (v < 1000) return Math.round(s * 0.40) + 'px';
    return Math.round(s * 0.32) + 'px';
  }

  function paintTile(t) {
    var v = t.value;
    var c = COLORS[v];
    if (c) {
      t.el.style.background = c.bg;
      t.el.style.color = c.text;
      t.el.style.boxShadow = v >= 128 ? '0 0 22px rgba(255,255,255,0.15)' : '0 4px 14px rgba(0,0,0,0.3)';
    } else {
      t.el.style.background = 'linear-gradient(135deg,#8b7bff,#ff6b9d)';
      t.el.style.color = '#fff';
      t.el.style.boxShadow = '0 0 26px rgba(255,255,255,0.2)';
    }
    t.el.textContent = v;
  }

  function renderTiles() {
    for (var r = 0; r < SIZE; r++) {
      var row = grid[r];
      if (!row) continue;
      for (var c = 0; c < SIZE; c++) {
        var t = row[c];
        if (!t) continue;
        t.el.style.width = cell + 'px';
        t.el.style.height = cell + 'px';
        t.el.style.transform = tilePos(r, c);
        t.el.style.fontSize = fontFor(t.value);
        paintTile(t);
        if (t.merged) {
          t.el.classList.remove('merged');
          void t.el.offsetWidth;
          t.el.classList.add('merged');
          t.merged = false;
        }
      }
    }
  }

  function reset() {
    grid = [];
    for (var r = 0; r < SIZE; r++) { grid.push([]); for (var c = 0; c < SIZE; c++) grid[r].push(null); }
    // remove existing tile DOM
    var old = boardEl.querySelectorAll('.tile');
    for (var i = 0; i < old.length; i++) old[i].remove();
    score = 0; scoreEl.textContent = '0';
    spawnTile(); spawnTile();
    renderTiles();
  }

  function emptyCells() {
    var list = [];
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) if (!grid[r][c]) list.push([r, c]);
    return list;
  }

  function spawnTile() {
    var cells = emptyCells();
    if (!cells.length) return;
    var p = cells[(Math.random() * cells.length) | 0];
    var v = Math.random() < 0.9 ? 2 : 4;
    var t = makeTile(v, p[0], p[1], true);
    grid[p[0]][p[1]] = t;
  }

  function addScore(n) {
    score += n;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
  }

  // ---------- move logic ----------
  function move(dx, dy) {
    if (state === 'over') return;
    if (state === 'won') state = 'playing'; // continue after win
    moved = false;

    var lines = [];
    if (dx !== 0) {
      for (var r = 0; r < SIZE; r++) {
        var line = [];
        for (var c = 0; c < SIZE; c++) line.push([r, c]);
        if (dx === -1) line.reverse();
        lines.push(line);
      }
    } else {
      for (var c = 0; c < SIZE; c++) {
        var line2 = [];
        for (var r = 0; r < SIZE; r++) line2.push([r, c]);
        if (dy === -1) line2.reverse();
        lines.push(line2);
      }
    }

    for (var li = 0; li < lines.length; li++) {
      var line = lines[li];
      var tiles = [];
      for (var k = 0; k < line.length; k++) {
        var rr = line[k][0], cc = line[k][1];
        if (grid[rr][cc]) tiles.push(grid[rr][cc]);
      }
      if (!tiles.length) continue;
      var ti = 0;
      for (var i = 0; i < line.length && ti < tiles.length; i++) {
        var pos = line[i];
        var tile = tiles[ti];
        if (tile.r !== pos[0] || tile.c !== pos[1]) moved = true;
        var next = tiles[ti + 1];
        if (next && next.value === tile.value) {
          var newV = tile.value * 2;
          grid[tile.r][tile.c] = null;
          grid[next.r][next.c] = null;
          tile.value = newV; tile.merged = true;
          tile.r = pos[0]; tile.c = pos[1];
          grid[pos[0]][pos[1]] = tile;
          next.el.remove();
          addScore(newV);
          sfx.merge(newV);
          if (newV === 2048 && state !== 'won' && state !== 'over') showWin();
          tiles.splice(ti + 1, 1);
          moved = true;
          ti++;
        } else {
          grid[tile.r][tile.c] = null;
          tile.r = pos[0]; tile.c = pos[1];
          grid[pos[0]][pos[1]] = tile;
          ti++;
        }
      }
      // clear leftover cells in the line
      for (var j = ti; j < line.length; j++) {
        var r2 = line[j][0], c2 = line[j][1];
        if (grid[r2][c2]) { grid[r2][c2].el.remove(); grid[r2][c2] = null; }
      }
    }

    if (moved) {
      renderTiles();
      sfx.move();
      spawnTile();
      renderTiles();
      if (noMoves()) gameOver();
    }
  }

  function noMoves() {
    if (emptyCells().length) return false;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var v = grid[r][c].value;
        if (c + 1 < SIZE && grid[r][c + 1].value === v) return false;
        if (r + 1 < SIZE && grid[r + 1][c].value === v) return false;
      }
    }
    return true;
  }

  // ---------- flow ----------
  function setOverlay(title, sub, btn, show) {
    ovTitle.textContent = title;
    ovSub.innerHTML = sub;
    startBtn.textContent = btn;
    overlay.classList.toggle('hidden', !show);
  }
  function start() {
    ensureAudio();
    reset();
    state = 'playing';
    setOverlay('', '', '', false);
  }
  function showWin() {
    state = 'won';
    sfx.win();
    setOverlay('达成 2048！🎉', '太厉害了！可以继续玩，冲击更高分', '继续游戏', true);
  }
  function gameOver() {
    state = 'over';
    sfx.over();
    setOverlay('游戏结束', '本局得分 <b>' + score + '</b><br/>最高分 <b>' + best + '</b>', '再来一局', true);
  }

  // ---------- input ----------
  var DIRS = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    W: { x: 0, y: -1 }, S: { x: 0, y: 1 }, A: { x: -1, y: 0 }, D: { x: 1, y: 0 }
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key.indexOf('Arrow') === 0) e.preventDefault();
    var d = DIRS[e.key];
    if (d) {
      ensureAudio();
      if (state === 'idle' || state === 'over') start();
      if (state === 'won') setOverlay('', '', '', false);
      move(d.x, d.y);
      return;
    }
    if (e.key === 'r' || e.key === 'R') start();
    if (e.key === 'Enter') { if (state !== 'playing') start(); }
  });

  var touchStart = null;
  boardEl.addEventListener('touchstart', function (e) {
    ensureAudio();
    var t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  boardEl.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (state === 'idle' || state === 'over') start();
    if (state === 'won') setOverlay('', '', '', false);
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 1 : -1, 0);
    else move(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  boardEl.addEventListener('pointerup', function (e) {
    if (e.pointerType !== 'mouse') return;
    ensureAudio();
    if (state === 'idle' || state === 'over') start();
    else if (state === 'won') setOverlay('', '', '', false);
  });

  startBtn.addEventListener('click', function () {
    ensureAudio();
    start();
  });
  window.addEventListener('resize', function () { layout(); });

  // ---------- boot ----------
  for (var i = 0; i < 16; i++) {
    var s = document.createElement('div');
    s.className = 'slot';
    slotsEl.appendChild(s);
  }
  reset();
  layout();
  setOverlay('2048', '合并相同数字，合成 <b>2048</b> 方块！<br/>方向键 / 滑动屏幕操作', '开始游戏', true);
})();
  </script>
</body>
</html>
