<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>数独 12×12</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='16' fill='%230b0e1a' stroke='%2338f0d0' stroke-width='6'/><text x='50' y='66' font-size='44' text-anchor='middle' fill='%2338f0d0' font-family='sans-serif' font-weight='bold'>9</text></svg>" />
<style>
  :root {
    --bg: #0b0e1a; --panel: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.12);
    --accent: #38f0d0; --accent2: #7c6bff; --text: #e8ecff; --muted: #8a92b8;
    --given: #dfe6ff; --user: #38e0d0; --note: #7c86b0; --err: #ff5d6c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% 20%, #141a33 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    min-height: 100%; padding: 10px 8px 14px; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 640px; }
  a.home { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    text-decoration: none; border-radius: 10px; padding: 7px 12px; font-size: 13px; }
  .hud { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 6px 12px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 6px; }
  .hud .lbl { color: var(--muted); font-size: 11px; }
  .btn { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: rgba(255,255,255,0.1); }
  .btn.active { border-color: var(--accent); color: var(--accent); }
  select { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 7px 8px; font-size: 13px; cursor: pointer; }
  select option { background: #141a33; }
  #board { display: grid; grid-template-columns: repeat(12, 1fr);
    width: min(94vmin, 560px); aspect-ratio: 1/1; background: #0d1226;
    border: 2px solid rgba(255,255,255,0.25); border-radius: 10px; overflow: hidden; }
  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: min(3.6vmin, 22px); font-weight: 700;
    border: 1px solid rgba(255,255,255,0.06); cursor: pointer;
    position: relative; color: var(--user);
  }
  .cell.given { color: var(--given); }
  .cell.br { border-right: 2px solid rgba(255,255,255,0.25); }
  .cell.bb { border-bottom: 2px solid rgba(255,255,255,0.25); }
  .cell.sel { background: rgba(56,240,208,0.22); }
  .cell.peer { background: rgba(56,240,208,0.08); }
  .cell.samenum { background: rgba(56,240,208,0.14); }
  .cell.conflict { color: var(--err) !important; }
  .cell .notes { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr); font-size: min(1.8vmin, 10px); color: var(--note); font-weight: 600; }
  .cell .notes span { display: flex; align-items: center; justify-content: center; }
  #pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: min(94vmin, 560px); }
  .num { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 9px 0; font-size: 17px; font-weight: 700; cursor: pointer; }
  .num .rem { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
  .num:active { background: rgba(255,255,255,0.15); }
  .num.zero { color: var(--muted); }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8,10,22,0.85); backdrop-filter: blur(5px); z-index: 20; }
  #overlay.hidden { display: none; }
  #overlay .box { background: #141a33; border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 34px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #overlay h2 { font-size: 30px; letter-spacing: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #overlay p { color: var(--muted); font-size: 14px; line-height: 1.8; }
  #overlay p b { color: var(--accent); }
  #overlay button { background: linear-gradient(90deg, var(--accent), #22c1a8); color: #062a24;
    font-size: 16px; font-weight: 700; border: none; padding: 11px 30px; border-radius: 999px; cursor: pointer; }
  footer { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <a class="home" href="./">🏠 返回主页</a>
    <div class="hud"><span class="lbl">用时</span><span id="timer">00:00</span></div>
    <select id="diff">
      <option value="easy">简单</option>
      <option value="medium" selected>中等</option>
      <option value="hard">困难</option>
    </select>
    <button class="btn" id="undo-btn">↩ 撤销</button>
    <button class="btn" id="hint-btn">💡 提示</button>
    <button class="btn" id="check-btn">✓ 检查</button>
    <button class="btn" id="new-btn">🔄 新局</button>
  </header>
  <div id="board"></div>
  <div id="pad"></div>
  <footer>点击格子选中 · 数字键盘填数 · 笔记模式可标候选数 · 1-9 键盘直输</footer>
  <div id="overlay"><div class="box"><h2 id="ov-title">数独 12×12</h2><p id="ov-sub">更大的棋盘 · 数字 1-12 · 三行四列宫格</p><button id="ov-btn">开始游戏</button></div></div>
  <script>
(function () {
  'use strict';

  var SIZE = 12, BOX_H = 3, BOX_W = 4;
  var GIVENS = { easy: 62, medium: 50, hard: 46 };
  var SAVE_KEY = 'sudoku.save.v1';

  var boardEl = document.getElementById('board');
  var padEl = document.getElementById('pad');
  var timerEl = document.getElementById('timer');
  var diffSel = document.getElementById('diff');
  var undoBtn = document.getElementById('undo-btn');
  var hintBtn = document.getElementById('hint-btn');
  var checkBtn = document.getElementById('check-btn');
  var newBtn = document.getElementById('new-btn');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ov-title');
  var ovSub = document.getElementById('ov-sub');
  var ovBtn = document.getElementById('ov-btn');

  var solution = [], puzzle = [], current = [], notes = [];
  var cellEls = [];
  var selected = null;
  var notesMode = false;
  var undoStack = [];
  var timerSec = 0, timerId = null, started = false;
  var difficulty = 'medium';

  // ---------- utils ----------
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0;
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // ---------- solver ----------
  var NODE_BUDGET = { n: 0 };

  function candidatesSet(g, r, c) {
    var used = new Set();
    for (var i = 0; i < SIZE; i++) {
      if (g[r][i]) used.add(g[r][i]);
      if (g[i][c]) used.add(g[i][c]);
    }
    var br = Math.floor(r / BOX_H) * BOX_H, bc = Math.floor(c / BOX_W) * BOX_W;
    for (var rr = br; rr < br + BOX_H; rr++)
      for (var cc = bc; cc < bc + BOX_W; cc++)
        if (g[rr][cc]) used.add(g[rr][cc]);
    var s = new Set();
    for (var v = 1; v <= SIZE; v++) if (!used.has(v)) s.add(v);
    return s;
  }

  function solveWith(g, limit, randomize) {
    var cand = [];
    var empty = [];
    for (var r = 0; r < SIZE; r++) {
      cand.push([]);
      for (var c = 0; c < SIZE; c++) {
        if (g[r][c]) cand[r].push(null);
        else { cand[r].push(candidatesSet(g, r, c)); empty.push([r, c]); }
      }
    }
    var found = 0, aborted = false;
    function recomputeAffected(r, c) {
      var br = Math.floor(r / BOX_H) * BOX_H, bc = Math.floor(c / BOX_W) * BOX_W;
      for (var rr = br; rr < br + BOX_H; rr++)
        for (var cc = bc; cc < bc + BOX_W; cc++)
          if (!g[rr][cc] && cand[rr][cc]) cand[rr][cc] = candidatesSet(g, rr, cc);
      for (var i = 0; i < SIZE; i++) {
        if (i !== c && !g[r][i] && cand[r][i]) cand[r][i] = candidatesSet(g, r, i);
        if (i !== r && !g[i][c] && cand[i][c]) cand[i][c] = candidatesSet(g, i, c);
      }
    }
    function bt() {
      if (found >= limit) return;
      if (NODE_BUDGET.n <= 0) { aborted = true; return; }
      NODE_BUDGET.n--;
      var best = null, bestSize = 99;
      for (var i = 0; i < empty.length; i++) {
        var r = empty[i][0], c = empty[i][1];
        if (g[r][c]) continue;
        var sz = cand[r][c].size;
        if (sz === 0) return;
        if (sz < bestSize) { bestSize = sz; best = empty[i]; }
      }
      if (!best) { found++; return; }
      var r0 = best[0], c0 = best[1];
      var vals = Array.from(cand[r0][c0]);
      if (randomize) shuffle(vals);
      for (var i = 0; i < vals.length; i++) {
        var v = vals[i];
        g[r0][c0] = v;
        recomputeAffected(r0, c0);
        bt();
        if (found >= limit) return;
        g[r0][c0] = 0;
        recomputeAffected(r0, c0);
      }
    }
    bt();
    return aborted ? -1 : found;
  }

  function solve(g, limit, randomize) { return solveWith(g, limit, randomize); }

  function cloneGrid(g) { return g.map(function (row) { return row.slice(); }); }

  function generateSolved() {
    for (var attempt = 0; attempt < 3; attempt++) {
      var g = [];
      for (var r = 0; r < SIZE; r++) { g.push([]); for (var c = 0; c < SIZE; c++) g[r].push(0); }
      NODE_BUDGET.n = 500000;
      solveWith(g, 1, true);
      var complete = true;
      for (var r2 = 0; r2 < SIZE; r2++) for (var c2 = 0; c2 < SIZE; c2++) if (!g[r2][c2]) { complete = false; break; }
      if (complete) return g;
    }
    var g2 = [];
    for (var r3 = 0; r3 < SIZE; r3++) { g2.push([]); for (var c3 = 0; c3 < SIZE; c3++) g2[r3].push(0); }
    NODE_BUDGET.n = 100000000;
    solveWith(g2, 1, true);
    return g2;
  }

  function generatePuzzle(target) {
    var s = generateSolved();
    var g = cloneGrid(s);
    var cells = [];
    for (var r = 0; r < SIZE; r++) for (var c = 0; c < SIZE; c++) cells.push([r, c]);
    shuffle(cells);
    var givens = SIZE * SIZE;
    NODE_BUDGET.n = 100000;
    for (var i = 0; i < cells.length && givens > target && NODE_BUDGET.n > 0; i++) {
      var r = cells[i][0], c = cells[i][1];
      var v = g[r][c];
      g[r][c] = 0;
      var cnt = solveWith(cloneGrid(g), 2, false);
      if (cnt !== 1) { g[r][c] = v; } else { givens--; }
    }
    return { solution: s, puzzle: g };
  }

  // ---------- board build ----------
  function buildBoard() {
    boardEl.innerHTML = '';
    cellEls = [];
    for (var r = 0; r < SIZE; r++) {
      cellEls.push([]);
      for (var c = 0; c < SIZE; c++) {
        var el = document.createElement('div');
        el.className = 'cell' + ((c + 1) % BOX_W === 0 ? ' br' : '') + ((r + 1) % BOX_H === 0 ? ' bb' : '');
        if (r === SIZE - 1) el.style.borderBottom = 'none';
        if (c === SIZE - 1) el.style.borderRight = 'none';
        el.dataset.r = r; el.dataset.c = c;
        (function (rr, cc) {
          el.addEventListener('click', function () { selectCell(rr, cc); });
        })(r, c);
        boardEl.appendChild(el);
        cellEls[r].push(el);
      }
    }
  }

  // ---------- pad ----------
  function buildPad() {
    padEl.innerHTML = '';
    var nums = [];
    for (var v = 1; v <= SIZE; v++) nums.push(v);
    nums.push(0); // erase
    for (var i = 0; i < nums.length; i++) {
      (function (v) {
        var el = document.createElement('button');
        el.className = 'num';
        if (v === 0) { el.innerHTML = '⌫'; el.classList.add('zero'); }
        else { el.innerHTML = v + '<span class="rem" id="rem-' + v + '"></span>'; }
        el.addEventListener('click', function () { inputNumber(v); });
        padEl.appendChild(el);
      })(nums[i]);
    }
    // notes toggle
    var noteBtn = document.createElement('button');
    noteBtn.className = 'num zero';
    noteBtn.textContent = '✎ 笔记';
    noteBtn.id = 'note-btn';
    noteBtn.addEventListener('click', function () {
      notesMode = !notesMode;
      noteBtn.style.color = notesMode ? 'var(--accent)' : 'var(--muted)';
    });
    padEl.appendChild(noteBtn);
  }

  // ---------- game ----------
  // ---------- save ----------
  var saveTimer = null;
  function queueSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 400);
  }
  function saveNow() {
    try {
      var n = [];
      for (var r = 0; r < SIZE; r++) { n.push([]); for (var c = 0; c < SIZE; c++) n[r].push(Array.from(notes[r][c])); }
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1, difficulty: difficulty, solution: solution, puzzle: puzzle, current: current, notes: n,
        timerSec: timerSec, started: started, ts: Date.now()
      }));
    } catch (e) {}
  }
  function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
  window.addEventListener('pagehide', saveNow);
  function fmtTime(s) {
    var m = Math.floor(s / 60), ss = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function restoreGame(data) {
    difficulty = data.difficulty || 'medium';
    diffSel.value = difficulty;
    solution = data.solution;
    puzzle = data.puzzle;
    current = data.current;
    notes = [];
    for (var r = 0; r < SIZE; r++) { notes.push([]); for (var c = 0; c < SIZE; c++) notes[r].push(new Set(data.notes[r][c])); }
    timerSec = data.timerSec || 0;
    started = !!data.started;
    timerEl.textContent = fmtTime(timerSec);
    if (timerId) { clearInterval(timerId); timerId = null; }
    if (started && timerSec >= 0) startTimer();
    undoStack = [];
    selected = null;
    renderAll();
    overlay.classList.add('hidden');
    ovBtn.disabled = false;
  }

  function newGame() {
    clearSave();
    overlay.classList.remove('hidden');
    ovTitle.textContent = '生成谜题中…';
    ovSub.textContent = difficulty === 'easy' ? '简单' : (difficulty === 'medium' ? '中等' : '困难') + '难度 · 请稍候';
    ovBtn.textContent = '请稍候';
    ovBtn.disabled = true;
    setTimeout(function () {
      var target = GIVENS[difficulty];
      var gen = generatePuzzle(target);
      solution = gen.solution;
      puzzle = gen.puzzle;
      current = cloneGrid(puzzle);
      notes = [];
      for (var r = 0; r < SIZE; r++) { notes.push([]); for (var c = 0; c < SIZE; c++) notes[r].push(new Set()); }
      undoStack = [];
      selected = null;
      started = false; timerSec = 0; timerEl.textContent = '00:00';
      if (timerId) { clearInterval(timerId); timerId = null; }
      renderAll();
      overlay.classList.add('hidden');
      ovBtn.disabled = false;
      ovTitle.textContent = '数独 12×12';
      ovSub.textContent = '更大的棋盘 · 数字 1-12 · 三行四列宫格';
      ovBtn.textContent = '开始游戏';
    }, 30);
  }

  function selectCell(r, c) {
    selected = { r: r, c: c };
    renderHighlights();
  }

  function inputNumber(v) {
    if (!selected) return;
    var r = selected.r, c = selected.c;
    if (puzzle[r][c]) return; // given cells locked
    if (v === 0) {
      if (current[r][c] !== 0 || notes[r][c].size) {
        pushUndo(r, c);
        current[r][c] = 0;
        notes[r][c].clear();
        renderAll();
        queueSave();
      }
      return;
    }
    pushUndo(r, c);
    if (notesMode) {
      if (notes[r][c].has(v)) notes[r][c].delete(v); else notes[r][c].add(v);
      current[r][c] = 0;
    } else {
      current[r][c] = v;
      notes[r][c].clear();
      startTimer();
      if (checkWin()) win();
    }
    renderAll();
    queueSave();
  }

  function pushUndo(r, c) {
    undoStack.push({ r: r, c: c, val: current[r][c], notes: new Set(notes[r][c]) });
    if (undoStack.length > 300) undoStack.shift();
  }

  function undo() {
    var u = undoStack.pop();
    if (!u) return;
    current[u.r][u.c] = u.val;
    notes[u.r][u.c] = u.notes;
    selected = { r: u.r, c: u.c };
    renderAll();
    queueSave();
  }

  function hint() {
    var best = null;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (current[r][c] !== solution[r][c]) { best = [r, c]; break; }
      }
      if (best) break;
    }
    if (!best) return;
    var r = best[0], c = best[1];
    pushUndo(r, c);
    current[r][c] = solution[r][c];
    notes[r][c].clear();
    selected = { r: r, c: c };
    startTimer();
    renderAll();
    queueSave();
    if (checkWin()) win();
  }

  function checkWin() {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (current[r][c] !== solution[r][c]) return false;
    return true;
  }

  function win() {
    clearSave();
    if (timerId) clearInterval(timerId);
    overlay.classList.remove('hidden');
    ovTitle.textContent = '🎉 完成！';
    ovSub.textContent = '用时 <b>' + timerEl.textContent + '</b> · 难度 ' + (difficulty === 'easy' ? '简单' : difficulty === 'medium' ? '中等' : '困难');
    ovBtn.textContent = '再来一局';
    ovBtn.disabled = false;
    ovBtn.onclick = function () { ovBtn.onclick = null; newGame(); };
  }

  function checkNow() {
    var wrong = 0;
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (current[r][c] !== 0 && current[r][c] !== solution[r][c]) wrong++;
      }
    }
    if (wrong === 0) {
      ovTitle.textContent = '✓ 目前没有填错的数';
      ovSub.textContent = '继续加油！';
    } else {
      ovTitle.textContent = '有 ' + wrong + ' 个填错了';
      ovSub.textContent = '红色标出错误位置';
      var errCells = [];
      for (var r2 = 0; r2 < SIZE; r2++) for (var c2 = 0; c2 < SIZE; c2++)
        if (current[r2][c2] !== 0 && current[r2][c2] !== solution[r2][c2]) errCells.push(cellEls[r2][c2]);
      for (var i = 0; i < errCells.length; i++) errCells[i].style.background = 'rgba(255,93,108,0.35)';
      setTimeout(function () {
        for (var j = 0; j < errCells.length; j++) errCells[j].style.background = '';
        renderHighlights();
      }, 1200);
    }
    overlay.classList.remove('hidden');
    ovBtn.textContent = '继续';
    ovBtn.disabled = false;
    ovBtn.onclick = function () { ovBtn.onclick = null; overlay.classList.add('hidden'); };
  }

  function startTimer() {
    if (started) return;
    started = true;
    timerId = setInterval(function () {
      timerSec++;
      var m = Math.floor(timerSec / 60), s = timerSec % 60;
      timerEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }, 1000);
  }

  // ---------- render ----------
  function renderAll() {
    renderCells();
    renderPadCounts();
    renderHighlights();
  }

  function renderCells() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var el = cellEls[r][c];
        el.innerHTML = '';
        el.classList.toggle('given', !!puzzle[r][c]);
        if (current[r][c]) {
          el.textContent = current[r][c];
        } else if (notes[r][c].size) {
          var wrap = document.createElement('div');
          wrap.className = 'notes';
          for (var v = 1; v <= SIZE; v++) {
            var sp = document.createElement('span');
            if (notes[r][c].has(v)) sp.textContent = v;
            wrap.appendChild(sp);
          }
          el.appendChild(wrap);
        }
      }
    }
  }

  function renderPadCounts() {
    var remain = [];
    for (var v = 1; v <= SIZE; v++) remain[v] = 0;
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (solution[r][c]) remain[solution[r][c]]++;
    for (var r2 = 0; r2 < SIZE; r2++)
      for (var c2 = 0; c2 < SIZE; c2++)
        if (current[r2][c2]) remain[current[r2][c2]]--;
    for (var v2 = 1; v2 <= SIZE; v2++) {
      var el = document.getElementById('rem-' + v2);
      if (el) el.textContent = remain[v2] > 0 ? '剩 ' + remain[v2] : '✓';
    }
  }

  function renderHighlights() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var el = cellEls[r][c];
        el.classList.remove('sel', 'peer', 'samenum', 'conflict');
        if (!puzzle[r][c] && current[r][c] && hasDuplicate(r, c, current[r][c])) el.classList.add('conflict');
      }
    }
    if (!selected) return;
    var sr = selected.r, sc = selected.c;
    cellEls[sr][sc].classList.add('sel');
    var br = Math.floor(sr / BOX_H) * BOX_H, bc = Math.floor(sc / BOX_W) * BOX_W;
    var sv = current[sr][sc];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (r === sr && c === sc) continue;
        if (r === sr || c === sc || (r >= br && r < br + BOX_H && c >= bc && c < bc + BOX_W)) {
          cellEls[r][c].classList.add('peer');
        }
        if (sv && current[r][c] === sv) cellEls[r][c].classList.add('samenum');
      }
    }
  }

  function hasDuplicate(r, c, v) {
    for (var i = 0; i < SIZE; i++) {
      if (i !== c && current[r][i] === v) return true;
      if (i !== r && current[i][c] === v) return true;
    }
    var br = Math.floor(r / BOX_H) * BOX_H, bc = Math.floor(c / BOX_W) * BOX_W;
    for (var rr = br; rr < br + BOX_H; rr++)
      for (var cc = bc; cc < bc + BOX_W; cc++)
        if ((rr !== r || cc !== c) && current[rr][cc] === v) return true;
    return false;
  }

  // ---------- input ----------
  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '9') { inputNumber(+e.key); return; }
    if (e.key === 'Backspace' || e.key === 'Delete') { inputNumber(0); return; }
    if (e.key === 'n' || e.key === 'N') {
      notesMode = !notesMode;
      var nb = document.getElementById('note-btn');
      if (nb) nb.style.color = notesMode ? 'var(--accent)' : 'var(--muted)';
      return;
    }
    if (e.key.indexOf('Arrow') === 0 && selected) {
      e.preventDefault();
      var nr = selected.r, nc = selected.c;
      if (e.key === 'ArrowUp') nr = Math.max(0, nr - 1);
      else if (e.key === 'ArrowDown') nr = Math.min(SIZE - 1, nr + 1);
      else if (e.key === 'ArrowLeft') nc = Math.max(0, nc - 1);
      else if (e.key === 'ArrowRight') nc = Math.min(SIZE - 1, nc + 1);
      selected = { r: nr, c: nc };
      renderHighlights();
    }
  });

  // ---------- events ----------
  diffSel.addEventListener('change', function () { difficulty = diffSel.value; });
  undoBtn.addEventListener('click', undo);
  hintBtn.addEventListener('click', function () { if (overlay.classList.contains('hidden')) hint(); });
  checkBtn.addEventListener('click', function () { if (overlay.classList.contains('hidden')) checkNow(); });
  newBtn.addEventListener('click', newGame);
  ovBtn.addEventListener('click', function () {
    if (ovBtn.disabled) return;
    overlay.classList.add('hidden');
    newGame();
  });

  // ---------- boot ----------
  buildBoard();
  buildPad();
  var savedSudoku = loadSave();
  if (savedSudoku) {
    ovTitle.textContent = '检测到存档';
    ovSub.innerHTML = '上次玩到一半，是否继续？<br/>难度 ' + (savedSudoku.difficulty === 'easy' ? '简单' : savedSudoku.difficulty === 'medium' ? '中等' : '困难') + ' · 用时 <b>' + fmtTime(savedSudoku.timerSec || 0) + '</b>';
    ovBtn.textContent = '放弃存档，新游戏';
    var resumeBtn = document.createElement('button');
    resumeBtn.textContent = '继续上次游戏';
    resumeBtn.style.cssText = 'background:linear-gradient(90deg,var(--accent),#22c1a8);color:#062a24;font-size:15px;font-weight:700;border:none;padding:10px 24px;border-radius:999px;cursor:pointer;';
    ovBtn.parentNode.insertBefore(resumeBtn, ovBtn.nextSibling);
    resumeBtn.addEventListener('click', function () { resumeBtn.remove(); restoreGame(savedSudoku); });
  } else {
    newGame();
  }

  // debug hook (read-only, harmless)
  window.__sudoku = {
    getSolution: function () { return solution.map(function (row) { return row.slice(); }); },
    getPuzzle: function () { return puzzle.map(function (row) { return row.slice(); }); },
    getCurrent: function () { return current.map(function (row) { return row.slice(); }); },
    setCurrent: function (r, c, v) { current[r][c] = v; },
    solve: function (g, limit) { NODE_BUDGET.n = 1000000000; return solveWith(cloneGrid(g), limit, false); }
  };
})();
  </script>
</body>
</html>
